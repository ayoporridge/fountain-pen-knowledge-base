<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HongDian N7 Grey Rabbit 身份与规格事实图</title>
  <desc id="desc">示意图，非产品照片。灰色 N7 Rabbit 的活塞、旋帽、兔子帽顶及版本化规格提示。</desc>
  <rect width="1280" height="720" fill="#f1eee8"/>
  <text x="70" y="94" font-family="serif" font-size="52" fill="#2b2925">HongDian N7 Grey Rabbit</text>
  <text x="70" y="137" font-family="sans-serif" font-size="24" fill="#665f55">示意图，非产品照片</text>
  <g stroke="#3c3934" stroke-width="7" stroke-linecap="round">
    <path d="M170 390 L810 390"/><path d="M240 340 L240 440"/><path d="M710 340 L710 440"/>
    <rect x="290" y="350" width="350" height="80" rx="36" fill="#aaa9a5" stroke="none"/>
    <rect x="640" y="350" width="90" height="80" rx="16" fill="#c3a477" stroke="none"/>
    <path d="M170 390 L270 365 L290 390 L270 415 Z" fill="#1f1f1e" stroke="none"/>
    <circle cx="770" cy="390" r="48" fill="#aaa9a5" stroke="none"/>
    <path d="M748 350 Q740 320 760 330 Q770 300 782 330 Q802 320 792 350" fill="#eee7dc" stroke="none"/>
  </g>
  <g font-family="sans-serif" fill="#2b2925">
    <text x="160" y="525" font-size="28">Grey Rabbit SKU：树脂＋黄铜 · 旋帽 · 内置活塞</text>
    <text x="160" y="575" font-size="28">约 136 mm · 15 mm · 38 g；黑色 PVD steel nib F/M</text>
    <text x="160" y="630" font-size="23" fill="#655d52">以上是特定 SKU 的资料，不代表 Peacock、N12、N23 或全部年份。</text>
