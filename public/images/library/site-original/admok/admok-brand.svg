<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Admok 与 J800 名称边界事实卡</title><desc id="desc">J800/简800 与卖家 M800 称呼边界的原创示意图，非产品照片。</desc><rect width="1600" height="900" fill="#f2eee5"/><rect x="104" y="100" width="1392" height="700" rx="34" fill="#fffdf8" stroke="#47403a" stroke-width="4"/><text x="168" y="200" font-family="Georgia,serif" font-size="66" fill="#292521">ADMOK · J800 名称边界</text><rect x="176" y="326" width="518" height="248" rx="26" fill="#dbe6e1"/><text x="230" y="414" font-family="Arial,sans-serif" font-size="46" fill="#26443c">J800／简800</text><text x="230" y="472" font-family="Arial,sans-serif" font-size="28" fill="#355d51">canonical 型号名</text><text x="230" y="518" font-family="Arial,sans-serif" font-size="24" fill="#355d51">独立活塞笔平台</text><path d="M744 450 H850" stroke="#9e8460" stroke-width="10" stroke-linecap="round"/><path d="M824 424 L856 450 L824 476" fill="none" stroke="#9e8460" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="906" y="326" width="510" height="248" rx="26" fill="#eadfd7"/><text x="960" y="414" font-family="Arial,sans-serif" font-size="46" fill="#573e35">“Admok M800”</text><text x="960" y="472" font-family="Arial,sans-serif" font-size="28" fill="#6b4d42">卖家/检索别名</text><text x="960" y="518" font-family="Arial,sans-serif" font-size="24" fill="#6b4d42">不是 Pelikan 型号或跳转</text><text x="180" y="700" font-family="Arial,sans-serif" font-size="30" fill="#47403a">事实卡：相似外形、改装成功或卖家标题，不建立品牌关系与零件兼容承诺。</text></svg>
