<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Platinum Procyon PNS-5000 evidence boundary map</title>
  <desc id="desc">Site-original factual editorial diagram: non-photo, non-logo, not-to-scale, not-colour-proof and not-finish-proof. It separates PNS-5000 structure, current four, launch-only colours, PNS-8000 limited sibling and two supplied samples.</desc>
  <rect width="1600" height="900" fill="#f5f1e8"/>
  <style>
    .h{font:700 32px system-ui,sans-serif;fill:#17202a}.s{font:600 21px system-ui,sans-serif;fill:#17202a}.t{font:17px system-ui,sans-serif;fill:#263238}.m{font:14px system-ui,sans-serif;fill:#4b5563}.box{fill:#fffdf8;stroke:#263238;stroke-width:2}.dash{fill:#fff8ed;stroke:#9a5b16;stroke-width:3;stroke-dasharray:12 9}.line{stroke:#263238;stroke-width:5;fill:none;stroke-linecap:round}
  </style>
  <text x="70" y="65" class="h">PROCYON / PNS-5000 — evidence map</text>
  <text x="70" y="96" class="m">site-original factual SVG · non-photo · non-logo · not-to-scale · not-colour-proof · not-finish-proof</text>

  <rect x="55" y="135" width="470" height="680" rx="24" class="box"/>
  <text x="85" y="182" class="s">PNS-5000 structure &amp; filling</text>
  <path d="M135 310 L410 310 M175 280 L175 340 M365 272 L410 310 L365 348" class="line"/>
  <circle cx="135" cy="310" r="28" fill="#d9e8ef" stroke="#263238" stroke-width="3"/>
  <text x="85" y="390" class="t">Slip &amp; Seal</text>
  <text x="85" y="425" class="t">coated / textured aluminium body</text>
  <text x="85" y="460" class="t">pentagon-shaped steel nib · F / M</text>
  <text x="85" y="495" class="t">Platinum cartridge / converter</text>
  <text x="85" y="530" class="t">139.7 × 14.4 mm · approx. 23.3 g</text>
  <path d="M150 625 C220 570 315 570 385 625" fill="none" stroke="#287a8a" stroke-width="7"/>
  <path d="M385 625 l-20 -5 l8 19 z" fill="#287a8a"/>
  <text x="85" y="675" class="t">2018 launch: immerse nib end</text>
  <text x="85" y="710" class="t">current manual: up to breather hole</text>
  <text x="85" y="752" class="m">two locators; no extra performance promise</text>

  <rect x="555" y="135" width="515" height="680" rx="24" class="box"/>
  <text x="585" y="182" class="s">Current four · retrieved 2026-07-22</text>
  <g transform="translate(585 220)">
    <rect width="210" height="65" rx="12" fill="#334c5e"/><text x="18" y="40" fill="white" class="t">#1 Shadow Mica</text>
    <rect x="230" width="220" height="65" rx="12" fill="#a93e46"/><text x="248" y="40" fill="white" class="t">#10 Carmine Red</text>
    <rect y="85" width="210" height="65" rx="12" fill="#ece8dc" stroke="#263238"/><text x="18" y="125" class="t">#3 Porcelain White</text>
    <rect x="230" y="85" width="220" height="65" rx="12" fill="#285f78"/><text x="248" y="125" fill="white" class="t">#50 Deep Sea</text>
  </g>
  <text x="585" y="405" class="m">labels group evidence; colours are not colour proof</text>
  <line x1="585" y1="445" x2="1038" y2="445" stroke="#7c6f64" stroke-width="2"/>
  <text x="585" y="490" class="s">2018 launch five — dated history</text>
  <text x="585" y="535" class="t">shared: #3 Porcelain White · #50 Deep Sea</text>
  <text x="585" y="580" class="t">launch-only: #25 Persimmon Orange</text>
  <text x="585" y="620" class="t">#52 Turquoise Blue · #68 Citron Yellow</text>
  <text x="585" y="670" class="m">launch-only ≠ 2026 current</text>
  <path d="M610 725 L1005 725" stroke="#9a5b16" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="585" y="775" class="m">same colour name may carry two time-scoped evidence chains</text>

  <rect x="1100" y="135" width="445" height="260" rx="24" class="dash"/>
  <text x="1130" y="182" class="s">PNS-8000 limited fence</text>
  <text x="1130" y="235" class="t">#18 Rose Gold</text>
  <text x="1130" y="275" class="t">#79 Satin Silver</text>
  <text x="1130" y="322" class="m">separate sibling model code</text>
  <text x="1130" y="350" class="m">not PNS-5000 variant / spec / alias</text>

  <rect x="1100" y="430" width="445" height="165" rx="20" class="box"/>
  <text x="1130" y="475" class="s">2019 supplied sample</text>
  <text x="1130" y="515" class="t">Porcelain White · F · Jeff Abbott</text>
  <text x="1130" y="552" class="m">JetPens free sample · sample-only observations</text>

  <rect x="1100" y="625" width="445" height="165" rx="20" class="box"/>
  <text x="1130" y="670" class="s">2021 supplied sample</text>
  <text x="1130" y="710" class="t">Deep Sea · M · Jeff Abbott</text>
  <text x="1130" y="747" class="m">JetPens free sample · sample-only observations</text>
</svg>
