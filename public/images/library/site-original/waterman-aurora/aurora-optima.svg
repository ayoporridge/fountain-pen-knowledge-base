<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Optima factual diagram</title>
  <desc id="desc">Editorial diagram distinguishing Auroloide, Resina, reserve tank piston and 18K limited editions.</desc>
  <rect width="1600" height="900" fill="#17261f"/>
  <rect x="70" y="70" width="1460" height="760" rx="36" fill="#284936" stroke="#e2bd66" stroke-width="4"/>
  <text x="120" y="165" fill="#fffdf5" font-family="Arial, sans-serif" font-size="74" font-weight="700">AURORA OPTIMA</text>
  <text x="120" y="225" fill="#e2bd66" font-family="Arial, sans-serif" font-size="31">996 AUROLOIDE · 997 RESINA · RESERVE-TANK PISTON</text>
  <g transform="translate(150 350)">
    <rect x="0" y="72" width="790" height="118" rx="59" fill="#5b7d61" stroke="#fffdf5" stroke-width="4"/>
    <rect x="690" y="72" width="130" height="118" rx="18" fill="#cebb87" stroke="#fffdf5" stroke-width="4"/>
    <path d="M820 131 L965 131 L1050 101 L1135 131 L1050 161 L965 131" fill="#e2bd66"/>
    <circle cx="1135" cy="131" r="17" fill="#fffdf5"/>
  </g>
  <g fill="#fffdf5" font-family="Arial, sans-serif" font-size="30">
    <text x="150" y="650">Regular 14K EF/F/M/B · 18K only explicit LE (e.g. 996-LW)</text>
    <text x="150" y="710">Approx. 126–127 mm capped · 153–155 mm writing · 22–23 g</text>
    <text x="150" y="770" fill="#d8e4d6">Auroloide / resin variants stay on one canonical series page</text>
    <text x="150" y="810" fill="#b7cbb6" font-size="25">Fountain Pen Graph editorial · 示意图，非产品照片、非比例图</text>
  </g>
</svg>
