<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Waterman Hémisphère fact card</title>
  <desc id="desc">Editorial diagram distinguishing current Hémisphère from historical Charleston.</desc>
  <rect width="1600" height="900" fill="#13283b"/>
  <rect x="70" y="70" width="1460" height="760" rx="36" fill="#1e4058" stroke="#c5d9e8" stroke-width="4"/>
  <text x="120" y="165" fill="#f8fafc" font-family="Arial, sans-serif" font-size="70" font-weight="700">WATERMAN HÉMISPHÈRE</text>
  <text x="120" y="225" fill="#c5d9e8" font-family="Arial, sans-serif" font-size="32">1994 · CURRENT SLIM DAILY LINE · STAINLESS NIB</text>
  <g transform="translate(150 350)">
    <rect x="0" y="80" width="790" height="100" rx="50" fill="#b9c2cb" stroke="#f8fafc" stroke-width="4"/>
    <rect x="660" y="80" width="130" height="100" rx="18" fill="#424f5b" stroke="#f8fafc" stroke-width="4"/>
    <path d="M790 130 L930 130 L1020 100 L1110 130 L1020 160 L930 130" fill="#d8e6ef"/>
    <circle cx="1110" cy="130" r="16" fill="#f8fafc"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="30">
    <text x="150" y="650">Waterman cartridge / converter</text>
    <text x="150" y="710">Charleston：独立历史系列，不是旧别名</text>
    <text x="150" y="770" fill="#c8d4df">商品号、颜色、饰件与市场状态按官方 collection 核对</text>
    <text x="150" y="810" fill="#9fb3c2" font-size="25">Fountain Pen Graph editorial · 示意图，非产品照片、非比例图</text>
  </g>
</svg>
