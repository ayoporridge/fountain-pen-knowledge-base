  <title id="title">Waterman Charleston factual diagram</title>
  <desc id="desc">Editorial diagram for historical Charleston, cartridge converter and Art Deco lineage.</desc>
  <rect width="1600" height="900" fill="#33251d"/>
  <rect x="70" y="70" width="1460" height="760" rx="36" fill="#5c3e2e" stroke="#e1b873" stroke-width="4"/>
  <text x="120" y="165" fill="#fff9ec" font-family="Arial, sans-serif" font-size="72" font-weight="700">WATERMAN CHARLESTON</text>
  <text x="120" y="225" fill="#e1b873" font-family="Arial, sans-serif" font-size="32">CA. 2001–02 · HISTORICAL · ART-DECO LINEAGE</text>
  <g transform="translate(150 350)">
    <rect x="0" y="72" width="820" height="116" rx="58" fill="#e6d1b1" stroke="#fff9ec" stroke-width="4"/>
