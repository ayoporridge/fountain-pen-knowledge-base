<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-factual-svg="true" data-product-photo="false" data-logo="false" data-to-scale="false" data-colour-proof="false">
  <title id="title">Kilk Orient factual diagram</title>
  <desc id="desc">Editorial diagram of the Kilk Orient resin fountain pen with a curved body, 925 sterling silver band, #6 nib and international cartridge/converter filling. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#f0eee8"/>
  <rect x="80" y="78" width="1440" height="744" rx="34" fill="#fffefa" stroke="#a9a095" stroke-width="4"/>
  <text x="140" y="170" font-family="Georgia,serif" font-size="56" fill="#292b2c">Kilk Orient</text>
  <text x="140" y="220" font-family="Arial,sans-serif" font-size="25" fill="#64696b">resin curve · aged 925 silver · #6 Bock steel / 14k option · international fill</text>
  <g transform="translate(150 305)">
    <path d="M92 110 C210 30 540 30 820 105 C930 135 1030 135 1110 110 L1190 110 L1270 145 L1190 180 L1110 180 C1010 150 930 160 820 185 C540 260 210 255 92 175 C35 137 35 142 92 110Z" fill="#dd8f70" stroke="#4e3531" stroke-width="8"/>
    <path d="M625 78 C720 80 800 93 865 110 L865 180 C790 198 720 211 625 215Z" fill="#b8a26f" stroke="#4e3531" stroke-width="5"/>
    <path d="M645 104 L690 190 M700 95 L745 194 M755 91 L800 191" stroke="#eee4c8" stroke-width="8" opacity="0.8"/>
    <path d="M1110 110 L1200 90 L1270 145 L1200 200 L1110 180Z" fill="#d2d6d8" stroke="#4e3531" stroke-width="8"/>
    <path d="M1270 145 L1380 145" stroke="#4e3531" stroke-width="12" stroke-linecap="round"/>
    <text x="180" y="320" font-family="Arial,sans-serif" font-size="28" fill="#4e3531">resin body and curved grip</text>
    <text x="640" y="320" font-family="Arial,sans-serif" font-size="28" fill="#4e3531">925 silver band / geometry</text>
    <text x="1120" y="320" font-family="Arial,sans-serif" font-size="28" fill="#4e3531">#6 nib</text>
  </g>
  <g transform="translate(200 670)" font-family="Arial,sans-serif" font-size="28" fill="#292b2c">
    <rect x="0" y="0" width="420" height="76" rx="18" fill="#e7e0d3" stroke="#9d8b73" stroke-width="3"/>
    <rect x="470" y="0" width="420" height="76" rx="18" fill="#e7e0d3" stroke="#9d8b73" stroke-width="3"/>
    <text x="74" y="49">international cartridge</text>
    <text x="585" y="49">converter included</text>
  </g>
  <text x="140" y="790" font-family="Arial,sans-serif" font-size="22" fill="#64696b">示意图不表示真实比例、颜色、Logo、库存或价格；金尖与颜色均为商品变体。</text>
