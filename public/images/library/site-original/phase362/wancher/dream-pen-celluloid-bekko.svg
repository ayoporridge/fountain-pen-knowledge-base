<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wancher Dream Pen Celluloid BEKKO factual diagram</title>
  <desc id="desc">A site-original, not-to-scale material and evidence diagram for the BEKKO celluloid colourway.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8efe2"/>
      <stop offset="1" stop-color="#ead8c0"/>
    </linearGradient>
    <linearGradient id="bekko" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7b96e"/>
      <stop offset="0.42" stop-color="#9a5b2e"/>
      <stop offset="0.72" stop-color="#d3974c"/>
      <stop offset="1" stop-color="#2e1b18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#3a241d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect x="72" y="64" width="1456" height="772" rx="42" fill="#fffaf2" stroke="#4b3027" stroke-width="4"/>
