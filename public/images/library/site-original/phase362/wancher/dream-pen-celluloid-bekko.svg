  <text x="130" y="194" fill="#8b5a3b" font-family="Arial, sans-serif" font-size="26">鼈甲色 · Traditional Celluloid · project-documented colourway</text>

  <g filter="url(#shadow)" transform="translate(160 310) rotate(-7 520 86)">
    <rect x="70" y="48" width="250" height="86" rx="42" fill="url(#bekko)" stroke="#2f1c18" stroke-width="6"/>
    <rect x="290" y="48" width="670" height="86" rx="34" fill="url(#bekko)" stroke="#2f1c18" stroke-width="6"/>
    <path d="M960 48h130l44 43-44 43H960z" fill="#bd8a4b" stroke="#2f1c18" stroke-width="6"/>
    <circle cx="1148" cy="91" r="18" fill="#cfaa5f" stroke="#2f1c18" stroke-width="5"/>
    <path d="M302 60c120 22 156 64 274 58 126-7 180-55 294-26" fill="none" stroke="#f4ce84" stroke-width="18" stroke-linecap="round" opacity=".48"/>
    <path d="M112 113c76-39 140-6 198-40M530 117c90-36 132-1 204-38M790 72c82 36 116 32 158 8" fill="none" stroke="#1f1514" stroke-width="16" stroke-linecap="round" opacity=".78"/>
    <rect x="948" y="42" width="22" height="98" rx="10" fill="#a9a9a2"/>
    <text x="492" y="193" fill="#5a3827" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">amber · brown · black mottled pattern</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#3e2820">
    <rect x="132" y="590" width="410" height="158" rx="22" fill="#f2e5d2" stroke="#b88854" stroke-width="3"/>
    <text x="162" y="635" font-size="28" font-weight="700">官方身份</text>
    <text x="162" y="676" font-size="23">Wancher × Kyoto Celluloid</text>
    <text x="162" y="711" font-size="23">Kickstarter 2025 发货记录</text>

    <rect x="590" y="590" width="410" height="158" rx="22" fill="#efe3d6" stroke="#96725b" stroke-width="3"/>
    <text x="620" y="635" font-size="28" font-weight="700">家族级结构背景</text>
    <text x="620" y="676" font-size="23">titanium parts · 925 ring</text>
    <text x="620" y="711" font-size="23">尖材与接口按订单核对</text>

    <rect x="1048" y="590" width="390" height="158" rx="22" fill="#f5ebe2" stroke="#9b6e54" stroke-width="3"/>
    <text x="1078" y="635" font-size="28" font-weight="700">证据边界</text>
    <text x="1078" y="676" font-size="23">独立尺寸／重量未发布</text>
    <text x="1078" y="711" font-size="23">non-photo · non-logo</text>
