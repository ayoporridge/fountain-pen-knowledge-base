    <path d="M1160 136 L1310 136" stroke="#31444f" stroke-width="12" stroke-linecap="round"/>
    <path d="M1030 104 L1090 118 M1030 168 L1090 154" stroke="#d6c17f" stroke-width="8"/>
    <text x="245" y="275" font-family="Arial,sans-serif" font-size="26" fill="#31444f">hard enamel over guilloché</text>
    <text x="645" y="275" font-family="Arial,sans-serif" font-size="26" fill="#31444f">three engraved levels</text>
    <text x="1070" y="275" font-family="Arial,sans-serif" font-size="26" fill="#31444f">18k gold nib</text>
  </g>
  <g transform="translate(170 650)" font-family="Arial,sans-serif" font-size="25" fill="#24313a">
    <rect x="0" y="0" width="380" height="78" rx="18" fill="#e0e8ed" stroke="#8d9ba8" stroke-width="3"/>
    <rect x="420" y="0" width="380" height="78" rx="18" fill="#e0e8ed" stroke="#8d9ba8" stroke-width="3"/>
    <rect x="840" y="0" width="380" height="78" rx="18" fill="#e0e8ed" stroke="#8d9ba8" stroke-width="3"/>
    <text x="60" y="49">cartridge</text>
    <text x="505" y="49">piston converter</text>
    <text x="932" y="49">eyedropper + O-ring</text>
