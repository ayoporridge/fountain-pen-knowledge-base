<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-factual-svg="true" data-product-photo="false" data-logo="false" data-to-scale="false" data-colour-proof="false">
  <title id="title">David Oscarson Winter Collection factual diagram</title>
  <desc id="desc">Editorial diagram of the David Oscarson Winter Collection showing guilloche layers, hard enamel over precious metal, 18 karat gold nib and cartridge, converter or eyedropper filling. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#e9edf1"/>
  <rect x="82" y="76" width="1436" height="748" rx="34" fill="#fbfcfd" stroke="#8d9ba8" stroke-width="4"/>
  <text x="140" y="166" font-family="Georgia,serif" font-size="56" fill="#24313a">David Oscarson Winter</text>
  <text x="140" y="216" font-family="Arial,sans-serif" font-size="25" fill="#61707a">three guilloche levels · hot enamel · 18k gold / .925 silver · 128 per colour incl. roller ball</text>
  <g transform="translate(145 300)">
    <path d="M100 135 C250 70 520 62 780 86 L1050 104 L1160 136 L1050 168 L780 190 C520 216 250 205 100 160 L48 147Z" fill="#7ea8bd" stroke="#31444f" stroke-width="8"/>
