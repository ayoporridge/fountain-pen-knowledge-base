<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Edison Menlo 结构示意</title>
  <desc id="desc">本站原创 factual SVG：表达 Menlo 的 Signature Line、Pump Filler、Draw Filler 与 C/C 配置边界；非产品照片、非 Logo、非真实比例、非颜色校样。</desc>
  <rect width="1600" height="900" fill="#e9edf2"/>
  <rect x="100" y="100" width="1400" height="700" rx="42" fill="#fbfcfe" stroke="#253246" stroke-width="5"/>
  <text x="150" y="180" font-family="sans-serif" font-size="46" fill="#253246">Edison Menlo</text>
  <text x="150" y="232" font-family="sans-serif" font-size="25" fill="#5b6b80">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text>
  <g transform="translate(160 320)">
    <path d="M35 150 Q70 48 190 25 H760 Q875 30 950 92 L1035 150 L950 208 Q875 270 760 275 H190 Q70 252 35 150 Z" fill="#6f91ad" stroke="#253246" stroke-width="7"/>
    <path d="M430 44 Q470 88 465 150 Q460 212 430 256" fill="#d7b191" stroke="#253246" stroke-width="6"/>
    <path d="M1035 150 L1135 105 L1265 130 L1320 150 L1265 170 L1135 195 Z" fill="#c7a35f" stroke="#253246" stroke-width="7"/>
    <text x="475" y="345" font-family="sans-serif" font-size="28" fill="#253246">Signature Line · 定制材料／尖号</text>
  </g>
  <g font-family="sans-serif" fill="#253246">
    <rect x="190" y="610" width="330" height="88" rx="18" fill="#d3e4f0" stroke="#253246" stroke-width="4"/>
    <text x="225" y="650" font-size="28">Pump Filler</text><text x="225" y="680" font-size="22">按压排气／释放吸墨</text>
    <rect x="635" y="610" width="330" height="88" rx="18" fill="#e6d8c7" stroke="#253246" stroke-width="4"/>
    <text x="670" y="650" font-size="28">Draw Filler</text><text x="670" y="680" font-size="22">抽拉式容量路线</text>
    <rect x="1080" y="610" width="330" height="88" rx="18" fill="#dce8d8" stroke="#253246" stroke-width="4"/>
    <text x="1115" y="650" font-size="28">C/C</text><text x="1115" y="680" font-size="22">标准国际墨囊／转换器</text>
  </g>
  <text x="150" y="755" font-family="sans-serif" font-size="23" fill="#5b6b80">示意图不证明真实颜色、材质、尺寸、Logo、容量、库存或某一支订单。</text>
</svg>
