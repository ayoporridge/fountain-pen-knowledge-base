<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dagong 56 mechanism diagram</title>
  <desc id="desc">Factual editorial diagram of the Dagong 56 retractable nib, push button, closing lid, knurled grip and integrated aerometric filler. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#f1f0ec"/>
  <rect x="90" y="90" width="1420" height="720" rx="36" fill="#fffefa" stroke="#4f5961" stroke-width="6"/>
  <text x="150" y="180" fill="#2d373c" font-family="sans-serif" font-size="58" font-weight="700">大公 Dagong 56</text>
  <text x="154" y="232" fill="#68757c" font-family="sans-serif" font-size="28">按压式伸缩笔尖 · 结构事实示意</text>
  <g transform="translate(180 355)">
    <rect x="0" y="90" width="690" height="105" rx="52" fill="#aeb7bb" stroke="#414b50" stroke-width="8"/>
    <rect x="470" y="82" width="180" height="121" rx="35" fill="#202b2f" stroke="#101719" stroke-width="8"/>
    <path d="M490 91v105M525 91v105M560 91v105M595 91v105M630 91v105" stroke="#8e999d" stroke-width="8" opacity=".75"/>
    <rect x="670" y="103" width="118" height="78" rx="24" fill="#b8c1c4" stroke="#414b50" stroke-width="8"/>
    <path d="M788 142h90" stroke="#414b50" stroke-width="12"/>
    <circle cx="885" cy="142" r="32" fill="#d1b36a" stroke="#6f5a2b" stroke-width="8"/>
    <path d="M0 142H-82" stroke="#414b50" stroke-width="12"/>
    <path d="M-82 142l54 -34v68z" fill="#d1b36a" stroke="#6f5a2b" stroke-width="7"/>
    <path d="M-16 119v46" stroke="#fff5d0" stroke-width="8"/>
    <text x="32" y="270" fill="#2d373c" font-family="sans-serif" font-size="27">镀金钢尖</text>
    <text x="440" y="270" fill="#2d373c" font-family="sans-serif" font-size="27">黑色滚花塑料握位</text>
    <text x="730" y="270" fill="#2d373c" font-family="sans-serif" font-size="27">尾部按钮</text>
    <text x="-5" y="325" fill="#2d373c" font-family="sans-serif" font-size="27">前端封闭片（伸缩时保护笔尖）</text>
  </g>
  <g transform="translate(1060 525)">
    <rect x="0" y="0" width="300" height="74" rx="37" fill="#d8e6e8" stroke="#57777c" stroke-width="6"/>
    <rect x="25" y="18" width="175" height="38" rx="19" fill="#a7cdd1"/>
    <circle cx="250" cy="37" r="23" fill="#57777c"/>
    <text x="0" y="125" fill="#2d373c" font-family="sans-serif" font-size="26">笔尖单元内置 aerometric</text>
  </g>
  <text x="150" y="745" fill="#68757c" font-family="sans-serif" font-size="24">本站原创 factual SVG；非产品照片／非比例图／不证明每支旧笔的颜色、尺寸、内部状态或批次</text>
</svg>
