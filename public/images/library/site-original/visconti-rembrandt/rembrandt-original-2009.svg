  <rect x="150" y="704" width="1300" height="72" rx="18" fill="#171a1d"/>
  <text x="194" y="751" fill="#ded0bb" font-family="Arial, sans-serif" font-size="29">2024 regular catalogue：合盖 139.5 mm × 13.5 mm · 36.5 g　｜　不等于 2022 Rembrandt-S</text>
