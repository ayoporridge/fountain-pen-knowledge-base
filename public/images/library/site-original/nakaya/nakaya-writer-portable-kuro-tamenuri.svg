<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Nakaya Writer Portable Kuro-tamenuri 事实图</title><desc id="desc">原创示意图，展示带笔夹 Writer 轮廓、约 150 mm、25 g 和黑溜涂命名边界，不是实物照片。</desc><rect width="1200" height="630" fill="#130e0d"/><text x="74" y="100" fill="#f2e7dc" font-family="serif" font-size="51">Writer Portable Kuro-tamenuri</text><text x="76" y="143" fill="#cfbeb5" font-family="sans-serif" font-size="21">原创 factual SVG · 非实物照片 · 不代表真实漆色、反光、比例、Logo 或笔尖</text><g transform="translate(110 286)"><path d="M0 39Q22 0 72 0H790Q840 0 862 39Q840 78 790 78H72Q22 78 0 39Z" fill="#170f10" stroke="#874034" stroke-width="7"/><path d="M596 4V74" stroke="#bf8f7c" stroke-width="3"/><path d="M88 -46h132v33H118v50h-30Z" fill="#c9ae8a"/><text x="228" y="125" fill="#cfbeb5" font-family="sans-serif" font-size="21">带笔夹 Writer 轮廓；与同长 Cigar Portable 的重量与携带方式不同</text></g><g fill="#f2e7dc" font-family="sans-serif"><text x="110" y="525" font-size="30">约 150 mm</text><text x="470" y="525" font-size="30">约 25 g</text><text x="762" y="525" font-size="30">硬橡胶 · 约 15 mm</text></g></svg>
