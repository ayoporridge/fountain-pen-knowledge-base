<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SKB 文明钢笔品牌导航事实图</title>
  <desc id="desc">台湾 SKB 文明钢笔品牌与 RS-301N、ES-520 型号导航的编辑事实图，不是产品照片或标志。</desc>
  <rect width="1600" height="900" fill="#f4eee3"/>
  <g fill="none" stroke="#27353b" stroke-width="14">
    <rect x="180" y="280" width="440" height="220" rx="28" fill="#b68b54"/>
    <rect x="990" y="170" width="360" height="150" rx="24" fill="#7f929a"/>
