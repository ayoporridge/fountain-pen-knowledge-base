<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sailor 1911 Large 11-2024 factual diagram</title>
  <desc id="desc">Editorial factual diagram of Sailor 1911 Large silver trim 11-2024 with 21K rhodium-plated nib, PMMA body and cartridge/converter filling. Not a product photo, not to scale, and not a colour proof.</desc>
  <!-- data-factual-svg; data-non-photo; data-non-logo; data-not-to-scale; data-non-colour-proof -->
  <rect width="1600" height="900" fill="#f2f0ec"/>
  <rect x="90" y="90" width="1420" height="720" rx="32" fill="#fff" stroke="#a8a8aa" stroke-width="4"/>
  <text x="150" y="170" font-family="sans-serif" font-size="44" font-weight="700" fill="#202124">Sailor 1911 Large · 11-2024</text>
  <text x="150" y="220" font-family="sans-serif" font-size="26" fill="#64666a">银／铑饰 · 21K rhodium-plated nib · PMMA · converter &amp; cartridge</text>
  <g transform="translate(150 360)">
    <rect x="110" y="80" width="760" height="102" rx="51" fill="#24262a"/>
    <rect x="180" y="98" width="590" height="66" rx="30" fill="#15171a"/>
    <rect x="850" y="76" width="82" height="110" rx="12" fill="#c7c9cc" stroke="#65676c" stroke-width="4"/>
    <path d="M932 76 L1130 131 L932 186 Z" fill="#d9dadd" stroke="#66686d" stroke-width="4"/>
    <path d="M1130 131 L1215 131" stroke="#66686d" stroke-width="7"/>
    <text x="300" y="42" font-family="sans-serif" font-size="25" fill="#404247">PMMA resin body · threaded cap</text>
    <line x1="500" y1="54" x2="500" y2="80" stroke="#707278" stroke-width="3"/>
    <text x="1020" y="250" font-family="sans-serif" font-size="25" fill="#404247">21K rhodium-plated nib</text>
    <line x1="1030" y1="190" x2="1030" y2="230" stroke="#707278" stroke-width="3"/>
  </g>
  <g transform="translate(180 650)">
    <rect x="0" y="0" width="390" height="86" rx="18" fill="#e2e3e5" stroke="#96989c" stroke-width="3"/>
    <text x="36" y="53" font-family="sans-serif" font-size="28" fill="#303236">11-2024 silver trim</text>
    <rect x="480" y="0" width="390" height="86" rx="18" fill="#e2e3e5" stroke="#96989c" stroke-width="3"/>
    <text x="530" y="53" font-family="sans-serif" font-size="28" fill="#303236">φ18×141 mm · 21.6 g</text>
    <rect x="960" y="0" width="390" height="86" rx="18" fill="#e2e3e5" stroke="#96989c" stroke-width="3"/>
    <text x="1010" y="53" font-family="sans-serif" font-size="28" fill="#303236">Sailor C/C</text>
  </g>
  <text x="150" y="775" font-family="sans-serif" font-size="20" fill="#77797e">示意图｜非产品照片｜非 Logo｜not-to-scale｜non-colour-proof</text>
</svg>
