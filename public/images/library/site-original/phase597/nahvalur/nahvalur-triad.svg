<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nahvalur Triad 八色、钢笔 SKU 与 RollerBall 排除事实图</title>
  <desc id="desc">本站原创示意图，非产品照片。用圆角三角结构、八个色块和 F/M 与 RollerBall 分流矩阵说明 Triad 的 ABS、按压帽、No.5 钢尖与商品类型边界。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22183e"/><stop offset="1" stop-color="#4a3274"/></linearGradient><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.small{font-size:23px;fill:#ddd4f2}.label{font-size:28px;font-weight:750;fill:#fff}.pill{font-size:20px;font-weight:750;fill:#292442}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g class="sans">
    <text x="88" y="82" font-size="24" letter-spacing="5" fill="#cbbce7">FOUNTAIN PEN GRAPH · FACT DIAGRAM</text>
