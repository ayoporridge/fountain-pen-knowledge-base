      <text x="34" y="102" text-anchor="middle" font-size="18" fill="#453c54">Black</text><text x="130" y="102" text-anchor="middle" font-size="18" fill="#453c54">Blue</text><text x="226" y="102" text-anchor="middle" font-size="18" fill="#453c54">Demo</text><text x="322" y="102" text-anchor="middle" font-size="18" fill="#453c54">Chocolate</text>
      <text x="418" y="102" text-anchor="middle" font-size="18" fill="#453c54">Verdant</text><text x="514" y="102" text-anchor="middle" font-size="18" fill="#453c54">Crimson</text><text x="610" y="102" text-anchor="middle" font-size="18" fill="#453c54">Azure</text><text x="706" y="102" text-anchor="middle" font-size="18" fill="#453c54">Violet</text>
