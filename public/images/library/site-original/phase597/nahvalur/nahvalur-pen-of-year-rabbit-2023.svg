<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nahvalur Pen of the Year Rabbit 2023 身份与 Brilliant Bunny 排除事实图</title>
  <desc id="desc">本站原创示意图，非产品照片。用月相、223、珠光白与玫瑰金、14K F/M 以及独立的 Brilliant Bunny 分支说明 Rabbit 2023 的身份。</desc>
  <defs><radialGradient id="moon"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#c7cedd"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172034"/><stop offset="1" stop-color="#55546e"/></linearGradient><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.small{font-size:23px;fill:#e5e4ec}.label{font-size:29px;font-weight:760;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1318" cy="166" r="118" fill="url(#moon)" opacity=".86"/>
  <g class="sans">
    <text x="86" y="82" font-size="24" letter-spacing="5" fill="#d8ccd8">FOUNTAIN PEN GRAPH · YEARLY IDENTITY</text>
    <text x="86" y="150" font-size="52" font-weight="800" fill="#fff">Rabbit 2023</text><text x="86" y="196" class="small">Starry Night Resins pearl white · rose-gold trim · Nautilus piston</text>
    <rect x="86" y="244" width="714" height="504" rx="36" fill="#f6f3ef"/>
    <text x="132" y="306" font-size="29" font-weight="780" fill="#4a4550">年度 edition</text><text x="132" y="478" font-size="190" font-weight="900" fill="#b77b7d">223</text><text x="132" y="532" font-size="26" fill="#655a63">numbered units</text>
    <path d="M534 372c55-82 124-69 112 4 56-46 111-10 78 49-29 52-105 103-151 149-46-46-122-97-151-149-33-59 22-95 78-49-12-73 57-86 34-4z" fill="#d8c3c9" opacity=".76"/>
    <text x="132" y="635" font-size="29" font-weight="760" fill="#4f4650">No.6 in-house 14K</text><rect x="132" y="663" width="105" height="54" rx="27" fill="#c9979b"/><rect x="253" y="663" width="105" height="54" rx="27" fill="#c9979b"/><text x="184" y="698" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">F</text><text x="305" y="698" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">M</text>
    <rect x="844" y="244" width="670" height="218" rx="36" fill="#2b3349" stroke="#c2b9c5" stroke-width="2"/>
    <text x="890" y="306" class="label">canonical identity</text><text x="890" y="357" class="small">Pen of the Year: Rabbit 2023</text><text x="890" y="405" class="small">pearl white · rose gold · 223 · 14K F/M</text>
    <rect x="844" y="500" width="670" height="248" rx="36" fill="#392d42" stroke="#bd7e9b" stroke-width="2"/>
    <text x="890" y="562" class="label">不要合并</text><text x="890" y="618" font-size="31" font-weight="780" fill="#e9a9c6">Enigma Stationery Brilliant Bunny</text><text x="890" y="665" class="small">50-piece sibling · separate collaboration identity</text><text x="890" y="711" class="small">同属兔主题，不等于同一年度型号</text>
    <text x="86" y="827" class="small">包装、编号、14K 刻印与三枚舷窗应一起核对；白色树脂会受光线影响</text>
    <text x="86" y="873" class="small">本站原创示意图／非产品照片 · 不复制真实产品、纹理、编号、笔尖或商标</text>
  </g>
</svg>
