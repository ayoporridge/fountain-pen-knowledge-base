    <circle cx="220" cy="632" r="26" fill="#d8e3da"/><circle cx="306" cy="632" r="26" fill="#d8e3da"/><circle cx="392" cy="632" r="26" fill="#d8e3da"/><text x="132" y="696" class="small">three portholes · piston · black metal</text>
