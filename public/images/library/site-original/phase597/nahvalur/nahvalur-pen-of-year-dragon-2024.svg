<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nahvalur Pen of the Year Dragon 2024 限量与代码证据事实图</title>
  <desc id="desc">本站原创示意图，非产品照片。用黑红金轨迹、224、三枚舷窗、钢尖矩阵和仅核实的 03080041 说明 Dragon 2024 的身份与代码边界。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160e12"/><stop offset=".55" stop-color="#4e1520"/><stop offset="1" stop-color="#b98331"/></linearGradient><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.small{font-size:23px;fill:#ead8d6}.label{font-size:29px;font-weight:760;fill:#fff}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M1080 65c260 84 315 257 180 379-119 108-29 247 210 262" fill="none" stroke="#e2ad4d" stroke-width="25" opacity=".55"/><path d="M1040 100c194 121 151 242 40 322-93 67-53 205 121 292" fill="none" stroke="#b92c39" stroke-width="47" opacity=".48"/>
