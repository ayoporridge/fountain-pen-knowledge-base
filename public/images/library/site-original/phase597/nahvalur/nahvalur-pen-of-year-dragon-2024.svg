    <text x="86" y="82" font-size="24" letter-spacing="5" fill="#d7a66b">FOUNTAIN PEN GRAPH · YEARLY IDENTITY</text><text x="86" y="150" font-size="52" font-weight="800" fill="#fff">Dragon 2024</text><text x="86" y="196" class="small">custom black / red / gold resin · gold-plated trim · Nautilus piston</text>
    <rect x="86" y="244" width="540" height="500" rx="36" fill="#160e12" fill-opacity=".84" stroke="#dca444" stroke-width="3"/><text x="132" y="306" class="label">编号限量</text><text x="132" y="500" font-size="198" font-weight="900" fill="#e0a545">224</text><text x="132" y="553" font-size="25" fill="#e8d4be">不是 Snake 的 888</text><circle cx="188" cy="642" r="25" fill="#efe7d8"/><circle cx="272" cy="642" r="25" fill="#efe7d8"/><circle cx="356" cy="642" r="25" fill="#efe7d8"/><text x="132" y="704" class="small">three portholes · internal piston</text>
