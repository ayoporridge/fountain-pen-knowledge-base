<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Parker Duofold Geometric 1939–1940 事实示意图</title>
  <desc id="desc">本站原创证据卡，说明两种尺寸、四种目录色，以及 Visiometer solid rod 与实际 button filler 墨囊之间的区别。示意图，非产品照片。</desc>
  <rect width="1200" height="760" fill="#e9f0ec"/>
  <path d="M0 0H1200V205L0 340Z" fill="#183f3a"/>
  <text x="76" y="104" fill="#ffffff" font-family="system-ui, sans-serif" font-size="40" font-weight="700">Duofold Geometric · 1939–1940</text>
  <text x="76" y="150" fill="#d6e7df" font-family="system-ui, sans-serif" font-size="22">“Toothbrush” 是收藏界俗称 · 示意图，非产品照片</text>
  <rect x="70" y="270" width="470" height="382" rx="28" fill="#ffffff" stroke="#183f3a" stroke-width="3"/>
  <text x="108" y="326" fill="#183f3a" font-family="system-ui, sans-serif" font-size="27" font-weight="700">1939 官方目录轮廓</text>
  <text x="108" y="372" fill="#314e49" font-family="system-ui, sans-serif" font-size="21">两种尺寸</text>
  <rect x="108" y="398" width="166" height="46" rx="12" fill="#dcebe4"/>
  <rect x="294" y="398" width="166" height="46" rx="12" fill="#dcebe4"/>
  <text x="159" y="429" fill="#183f3a" font-family="system-ui, sans-serif" font-size="19">Standard</text>
  <text x="347" y="429" fill="#183f3a" font-family="system-ui, sans-serif" font-size="19">Slender</text>
  <text x="108" y="486" fill="#314e49" font-family="system-ui, sans-serif" font-size="21">四种颜色</text>
  <circle cx="142" cy="536" r="24" fill="#47745e"/>
  <circle cx="232" cy="536" r="24" fill="#9b8f82"/>
  <circle cx="322" cy="536" r="24" fill="#785238"/>
  <circle cx="412" cy="536" r="24" fill="#1e1e1e"/>
  <text x="108" y="598" fill="#6b746f" font-family="system-ui, sans-serif" font-size="18">绿 · 灰 · 棕 · 黑（饰件随颜色不同）</text>
  <rect x="598" y="270" width="532" height="382" rx="28" fill="#fff8e8" stroke="#9c6324" stroke-width="3"/>
  <text x="636" y="326" fill="#6f4218" font-family="system-ui, sans-serif" font-size="27" font-weight="700">最容易认错的结构</text>
  <rect x="636" y="372" width="192" height="94" rx="18" fill="#f1d49f"/>
  <text x="674" y="410" fill="#6f4218" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Visiometer</text>
  <text x="661" y="440" fill="#6f4218" font-family="system-ui, sans-serif" font-size="17">内有 solid rod</text>
  <path d="M846 419H920" stroke="#9c6324" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="938" y="372" width="154" height="94" rx="18" fill="#f1d49f"/>
  <text x="968" y="410" fill="#6f4218" font-family="system-ui, sans-serif" font-size="19" font-weight="700">不是</text>
  <text x="953" y="440" fill="#6f4218" font-family="system-ui, sans-serif" font-size="17">Vac filler</text>
  <rect x="636" y="506" width="456" height="92" rx="18" fill="#e8c16f"/>
  <text x="682" y="544" fill="#5a3718" font-family="system-ui, sans-serif" font-size="21" font-weight="700">实际：button + pressure bar + sac</text>
  <text x="690" y="576" fill="#6f4218" font-family="system-ui, sans-serif" font-size="18">旧囊未检修前，不要强按尾端按钮</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9c6324"/></marker></defs>
</svg>
