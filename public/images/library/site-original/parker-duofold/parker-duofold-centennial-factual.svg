<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Parker Duofold Classic Centennial 1987/88 至今事实卡</title>
  <desc id="desc">本站原创时间线与现行 SKU 证据表，用于说明现代 Duofold Classic Centennial 的代际及型号边界。示意图，非产品照片。</desc>
  <rect width="1200" height="760" fill="#f1f2f4"/>
  <circle cx="1024" cy="112" r="210" fill="#b32636" opacity="0.95"/>
  <circle cx="1024" cy="112" r="142" fill="none" stroke="#f6d7a7" stroke-width="18"/>
  <text x="78" y="112" fill="#202934" font-family="system-ui, sans-serif" font-size="42" font-weight="700">Duofold Classic Centennial</text>
  <text x="78" y="158" fill="#59636d" font-family="system-ui, sans-serif" font-size="22">1987 production / 1988 centenary introduction</text>
  <rect x="70" y="218" width="1060" height="464" rx="32" fill="#ffffff" stroke="#202934" stroke-width="3"/>
  <line x1="112" y1="322" x2="544" y2="322" stroke="#202934" stroke-width="5"/>
  <circle cx="146" cy="322" r="18" fill="#b32636"/>
  <circle cx="328" cy="322" r="18" fill="#c68a32"/>
  <circle cx="510" cy="322" r="18" fill="#202934"/>
  <text x="112" y="280" fill="#202934" font-family="system-ui, sans-serif" font-size="24" font-weight="700">1987</text>
  <text x="288" y="280" fill="#202934" font-family="system-ui, sans-serif" font-size="24" font-weight="700">1988</text>
  <text x="464" y="280" fill="#202934" font-family="system-ui, sans-serif" font-size="24" font-weight="700">今天</text>
  <text x="112" y="370" fill="#59636d" font-family="system-ui, sans-serif" font-size="18">开始生产</text>
  <text x="278" y="370" fill="#59636d" font-family="system-ui, sans-serif" font-size="18">百年纪念正式推出</text>
  <text x="478" y="366" fill="#59636d" font-family="system-ui, sans-serif" font-size="17">现售</text>
  <text x="447" y="390" fill="#59636d" font-family="system-ui, sans-serif" font-size="17">仅 Centennial</text>
  <rect x="112" y="426" width="432" height="188" rx="22" fill="#f5e6e8"/>
  <text x="148" y="470" fill="#7d2530" font-family="system-ui, sans-serif" font-size="22" font-weight="700">目前能确认的信息</text>
  <text x="148" y="510" fill="#69434a" font-family="system-ui, sans-serif" font-size="18">Centennial Size · 18K bi-tonal nib</text>
  <text x="148" y="546" fill="#69434a" font-family="system-ui, sans-serif" font-size="18">Big Red CT：1931375 F / 1931376 M</text>
  <text x="148" y="582" fill="#69434a" font-family="system-ui, sans-serif" font-size="18">Black GT：1931381 F / 1931382 M</text>
  <rect x="604" y="266" width="470" height="348" rx="24" fill="#edf0f3"/>
  <text x="644" y="314" fill="#202934" font-family="system-ui, sans-serif" font-size="24" font-weight="700">不要外推</text>
  <line x1="644" y1="344" x2="1034" y2="344" stroke="#9ca3aa" stroke-width="2"/>
  <text x="644" y="390" fill="#4d5963" font-family="system-ui, sans-serif" font-size="19">International 的尺寸 ≠ 当前 Centennial</text>
  <text x="644" y="432" fill="#4d5963" font-family="system-ui, sans-serif" font-size="19">早期 Mk I 的 14K/18K ≠ 当前统一配置</text>
  <text x="644" y="474" fill="#4d5963" font-family="system-ui, sans-serif" font-size="19">当前页未列精确长度、直径与重量</text>
  <text x="644" y="516" fill="#4d5963" font-family="system-ui, sans-serif" font-size="19">以型号编号、当前页面与地区目录交叉核对</text>
  <text x="644" y="566" fill="#7d2530" font-family="system-ui, sans-serif" font-size="19" font-weight="700">示意图，非产品照片</text>
</svg>
