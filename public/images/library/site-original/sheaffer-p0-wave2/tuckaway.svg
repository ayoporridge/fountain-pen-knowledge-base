<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sheaffer Tuckaway 便携家族图</title><desc id="desc">本站原创 factual SVG，说明短身、加帽书写和多个填充阶段，非实物照片。</desc><rect width="1600" height="900" fill="#f4f0e7"/><text x="100" y="110" font-size="54" fill="#443d33">Tuckaway · 短身携带，套帽书写</text><rect x="250" y="310" width="420" height="120" rx="60" fill="#826a4b"/><rect x="740" y="310" width="580" height="120" rx="60" fill="#9a825f"/><path d="M690 370 H720" stroke="#443d33" stroke-width="20"/><text x="215" y="510" font-size="35" fill="#443d33">闭帽：口袋长度</text><text x="820" y="510" font-size="35" fill="#443d33">加帽：书写长度</text><text x="180" y="650" font-size="38" fill="#443d33">lever-fill → Vacuum-Fil → Triumph → Touchdown</text><text x="180" y="760" font-size="30" fill="#665c50">短身不等于单一版本；不同阶段不共用维修方法。图示非产品照片。</text></svg>
