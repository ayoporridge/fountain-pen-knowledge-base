<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sheaffer Balance 家族结构图</title><desc id="desc">本站原创 factual SVG，以轮廓和分支说明 Balance 是家族，不是具体产品照片。</desc><rect width="1600" height="900" fill="#f7f2e8"/><text x="100" y="110" font-size="54" fill="#22332e">Sheaffer Balance · 1929 起的家族边界</text><path d="M220 360 C330 270 610 270 720 360 L720 470 C610 560 330 560 220 470 Z" fill="#536c61"/><path d="M710 360 C850 300 1120 320 1270 390 L1270 440 C1120 510 850 530 710 470 Z" fill="#9fb49c"/><text x="235" y="650" font-size="38" fill="#22332e">流线轮廓</text><text x="690" y="650" font-size="38" fill="#22332e">尺寸 / 等级 / 机构变化</text><text x="100" y="770" font-size="30" fill="#58645e">Craftsman、33T、Tip-Dip、TM 是独立节点；图示非产品照片、不按比例。</text></svg>
