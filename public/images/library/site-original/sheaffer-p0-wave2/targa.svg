<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sheaffer Targa 版本层级图</title><desc id="desc">本站原创 factual SVG，标示标准、钢尖、Slim 与特别版的边界，非实物照片。</desc><rect width="1600" height="900" fill="#f3f0ea"/><text x="100" y="110" font-size="54" fill="#27333a">Targa · 1976–约1998 · inlaid-nib family</text><path d="M230 360 H1320" stroke="#405d69" stroke-width="74" stroke-linecap="round"/><path d="M1180 360 H1335" stroke="#c79d4b" stroke-width="38"/><text x="185" y="540" font-size="38" fill="#27333a">standard</text><text x="500" y="540" font-size="38" fill="#27333a">all-stainless / steel nib</text><text x="970" y="540" font-size="38" fill="#27333a">Slim</text><text x="1230" y="540" font-size="38" fill="#27333a">special</text><text x="160" y="730" font-size="30" fill="#53636b">大多数为14K尖，但钢尖低价款存在；饰面不自动等于新型号。图示非产品照片。</text></svg>
