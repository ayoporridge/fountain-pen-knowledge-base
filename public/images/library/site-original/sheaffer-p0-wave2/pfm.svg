<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sheaffer PFM I 至 V 边界图</title><desc id="desc">本站原创 factual SVG，显示 PFM I和II 的钯银尖与 III至V 的14K尖边界，非实物照片。</desc><rect width="1600" height="900" fill="#f6f2ea"/><text x="100" y="110" font-size="54" fill="#3c3429">PFM · Pen For Men · 1959–1968</text><rect x="150" y="280" width="500" height="260" rx="42" fill="#aab0ad"/><path d="M570 410 H720" stroke="#7b817e" stroke-width="52"/><text x="250" y="620" font-size="42" fill="#3c3429">PFM I / II</text><text x="210" y="680" font-size="31" fill="#3c3429">palladium-silver inlaid nib</text><rect x="910" y="280" width="500" height="260" rx="42" fill="#5b4a31"/><path d="M830 410 H980" stroke="#c69c4d" stroke-width="52"/><text x="1010" y="620" font-size="42" fill="#3c3429">PFM III / IV / V</text><text x="1060" y="680" font-size="31" fill="#3c3429">14K inlaid nib</text><text x="170" y="790" font-size="30" fill="#5c554b">共享 Snorkel 工程，不等于 Legacy；示意图非产品照片。</text></svg>
