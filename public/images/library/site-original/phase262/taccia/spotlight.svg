<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TACCIA Spotlight factual diagram</title>
  <desc id="desc">Non-photo, non-logo, not-to-scale, non-colour-proof diagram of a transparent resin cartridge converter pen.</desc>
  <rect width="1600" height="900" fill="#eef5f6"/>
  <text x="80" y="92" font-family="sans-serif" font-size="42" font-weight="700" fill="#12363b">TACCIA Spotlight</text>
  <text x="80" y="142" font-family="sans-serif" font-size="24" fill="#35666b">transparent demonstrator · hand-turned resin · cartridge / converter</text>
  <g transform="translate(120 285)">
    <path d="M80 180 C80 110 160 60 280 60 H900 C1030 60 1140 110 1220 180 C1140 250 1030 300 900 300 H280 C160 300 80 250 80 180Z" fill="#a7d7da" fill-opacity=".56" stroke="#276a70" stroke-width="8"/>
    <path d="M1010 180 C1100 130 1200 130 1300 180 C1200 230 1100 230 1010 180Z" fill="#d8eff0" fill-opacity=".72" stroke="#276a70" stroke-width="8"/>
    <path d="M250 180 H880" stroke="#2f7f86" stroke-width="18" stroke-linecap="round"/>
    <rect x="450" y="130" width="330" height="100" rx="22" fill="#fff" fill-opacity=".38" stroke="#3b8f95" stroke-width="6"/>
    <path d="M785 180 h155" stroke="#996c32" stroke-width="12"/>
    <path d="M1160 180 h170" stroke="#606b72" stroke-width="10"/>
    <text x="470" y="120" font-family="sans-serif" font-size="24" fill="#12363b">converter visible</text>
    <text x="875" y="348" font-family="sans-serif" font-size="24" fill="#12363b">Japanese nib option</text>
  </g>
  <g font-family="sans-serif" font-size="28" fill="#12363b">
    <text x="110" y="720">● steel EF/F/M/B/Music</text>
    <text x="560" y="720">● 14K EF/F/MF/M/B/Music</text>
    <text x="1110" y="720">● colors are variants</text>
  </g>
  <text x="80" y="830" font-family="sans-serif" font-size="22" fill="#4c6b70">NON-PHOTO · NON-LOGO · NOT-TO-SCALE · NON-COLOUR-PROOF</text>
</svg>
