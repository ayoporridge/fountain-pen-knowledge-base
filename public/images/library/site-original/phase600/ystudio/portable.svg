<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YSTUDIO Classic Revolve Portable 事实示意图</title>
  <desc id="desc">展示便携钢笔、木制携带管、不可后插、Schmidt 五号钢尖与国际标准转换器关系；非产品照片。</desc>
  <rect width="1600" height="900" fill="#171612"/>
  <text x="80" y="110" fill="#f4ecd8" font-family="Arial,sans-serif" font-size="52" font-weight="700">YSTUDIO Portable</text>
  <text x="82" y="154" fill="#d0b071" font-family="Arial,sans-serif" font-size="22">138 mm · 46–50 g samples · factual diagram · not a product photo</text>
  <rect x="85" y="290" width="920" height="170" rx="18" fill="#795226" stroke="#e2bc70" stroke-width="5"/>
  <path d="M115 320h860M115 430h860" stroke="#c59450" stroke-width="5" opacity=".65"/>
  <path d="M1010 290l110 85-110 85z" fill="#d9c7a0"/>
  <circle cx="970" cy="330" r="16" fill="none" stroke="#f1d48f" stroke-width="5"/>
  <rect x="90" y="570" width="770" height="105" rx="52" fill="#3c2617" stroke="#b98245" stroke-width="5"/>
  <text x="330" y="635" fill="#ead8b3" font-family="Arial,sans-serif" font-size="30">maple carry tube / lanyard</text>
  <text x="1190" y="305" fill="#f4ecd8" font-family="Arial,sans-serif" font-size="30" font-weight="700">#5 Schmidt steel</text>
  <text x="1190" y="350" fill="#d0b071" font-family="Arial,sans-serif" font-size="24">F / M · international C/C</text>
  <text x="1190" y="445" fill="#f4ecd8" font-family="Arial,sans-serif" font-size="30" font-weight="700">Cap does not post</text>
  <text x="1190" y="490" fill="#d0b071" font-family="Arial,sans-serif" font-size="24">uncapped sample ≈119 mm</text>
  <text x="82" y="790" fill="#d0b071" font-family="Arial,sans-serif" font-size="22">Brass / Black are surface variants · wood tube is storage, not impact or loss protection</text>
