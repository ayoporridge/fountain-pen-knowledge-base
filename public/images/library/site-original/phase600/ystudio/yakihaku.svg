<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YSTUDIO Classic Renaissance YAKIHAKU 两种钢笔版本对照图</title>
  <desc id="desc">用清楚的钢笔轮廓对照带帽版和桌面版的尺寸、重量、十四K笔尖与笔座，并说明云龙箔表面的维护禁忌。本站原创事实示意，非产品实拍。</desc>
  <metadata>site-original factual diagram; not a product photo; not to scale</metadata>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18242d"/>
      <stop offset="1" stop-color="#293943"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7656"/>
      <stop offset="0.45" stop-color="#c4ad7d"/>
      <stop offset="1" stop-color="#75664f"/>
    </linearGradient>
    <style>
      .zh { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #f7f3e9; font-size: 30px; font-weight: 700; }
      .spec { fill: #d8e3e6; font-size: 24px; }
      .small { fill: #b9c9ce; font-size: 20px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <text class="zh" x="72" y="86" fill="#f7f3e9" font-size="46" font-weight="700">YSTUDIO YAKIHAKU｜两种钢笔版本</text>
  <text class="zh" x="74" y="128" fill="#b9c9ce" font-size="22">YAKIHAKU 是云龙箔工艺家族，不是一个颜色名</text>

  <rect x="68" y="172" width="704" height="468" rx="26" fill="#ffffff" fill-opacity=".055" stroke="#79909a" stroke-width="2"/>
  <circle cx="116" cy="224" r="23" fill="#d0b476"/>
  <text class="zh" x="108" y="233" fill="#18242d" font-size="24" font-weight="700">1</text>
  <text class="zh label" x="158" y="235">带帽版</text>
  <text class="zh small" x="158" y="269">日常携带的完整钢笔</text>

  <g aria-label="带帽版钢笔轮廓">
    <rect x="124" y="337" width="475" height="92" rx="36" fill="url(#foil)" stroke="#e3d6b8" stroke-width="4"/>
    <path d="M173 347c50 41 91 37 139 3s96 38 146 0 78 27 116 0" fill="none" stroke="#ebdfc8" stroke-opacity=".47" stroke-width="12"/>
    <rect x="599" y="350" width="48" height="66" fill="#596b74" stroke="#d5e0e3" stroke-width="4"/>
    <path d="M647 350l98 33-98 33z" fill="#d5ba72" stroke="#f1dfaa" stroke-width="4"/>
    <line x1="696" y1="367" x2="696" y2="399" stroke="#72591f" stroke-width="3"/>
    <rect x="109" y="360" width="23" height="46" rx="8" fill="#d5ba72"/>
  </g>
  <text class="zh spec" x="120" y="500">总长 138 mm　｜　46 g</text>
  <text class="zh spec" x="120" y="545">德国制造 14K F 金尖</text>
  <text class="zh spec" x="120" y="590">附 converter；兼容国际标准墨囊</text>

  <rect x="828" y="172" width="704" height="468" rx="26" fill="#ffffff" fill-opacity=".055" stroke="#79909a" stroke-width="2"/>
  <circle cx="876" cy="224" r="23" fill="#d0b476"/>
  <text class="zh" x="868" y="233" fill="#18242d" font-size="24" font-weight="700">2</text>
  <text class="zh label" x="918" y="235">Desk 桌面版</text>
  <text class="zh small" x="918" y="269">无笔帽，放入配套黄铜笔座</text>

  <g aria-label="桌面版钢笔与笔座轮廓">
    <path d="M1320 506h148l-25 76h-98z" fill="#846e49" stroke="#ddc78d" stroke-width="4"/>
    <rect x="1340" y="435" width="105" height="86" rx="10" fill="#a89062" stroke="#e2d2aa" stroke-width="4"/>
    <g transform="rotate(-9 1140 376)">
      <rect x="930" y="332" width="390" height="78" rx="30" fill="url(#foil)" stroke="#e3d6b8" stroke-width="4"/>
      <path d="M971 344c49 36 84 31 129 1s84 32 127 1" fill="none" stroke="#ebdfc8" stroke-opacity=".47" stroke-width="11"/>
      <rect x="1320" y="343" width="43" height="56" fill="#596b74" stroke="#d5e0e3" stroke-width="4"/>
      <path d="M1363 343l84 28-84 28z" fill="#d5ba72" stroke="#f1dfaa" stroke-width="4"/>
    </g>
  </g>
  <text class="zh spec" x="880" y="500">笔身长 146 mm　｜　笔身 34 g</text>
  <text class="zh spec" x="880" y="545">14K F／M；无便携笔帽</text>
  <text class="zh spec" x="880" y="590">配实心黄铜笔座；附件按具体批次</text>

  <rect x="68" y="678" width="1464" height="142" rx="24" fill="#f2ead7"/>
  <text class="zh" x="110" y="731" fill="#433725" font-size="27" font-weight="700">云龙箔表面怎么保养？</text>
  <text class="zh" x="110" y="776" fill="#574a38" font-size="24">只清洗笔尖、笔舌和 converter；整支笔不要浸泡，也不要使用酒精、抛光膏、砂纸或超声波。</text>
  <text class="zh" x="1532" y="855" text-anchor="end" fill="#aebdc2" font-size="18">本站原创事实示意｜非产品实拍，不表示真实颜色、箔纹或比例</text>
</svg>
