<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KACO 与 Master 系列导航事实卡</title><desc id="desc">KACO 品牌和历史 Master 14K 与当代普通 Master 的边界示意图，非产品照片。</desc>
  <rect width="1600" height="900" fill="#f3f1ec"/><rect x="96" y="96" width="1408" height="708" rx="36" fill="#fff" stroke="#34383e" stroke-width="4"/>
  <text x="164" y="190" font-family="Georgia,serif" font-size="66" fill="#25282c">KACO · Master 导航</text><text x="168" y="242" font-family="Arial,sans-serif" font-size="27" fill="#697078">同名不等于同一笔尖、帽结构或年代</text>
  <rect x="170" y="330" width="560" height="242" rx="28" fill="#e4d5ba"/><text x="218" y="408" font-family="Arial,sans-serif" font-size="42" fill="#352d22">历史 Master 14K</text><text x="218" y="462" font-family="Arial,sans-serif" font-size="27" fill="#5e513d">官方旧目录 · 14K 金尖</text><text x="218" y="506" font-family="Arial,sans-serif" font-size="24" fill="#5e513d">具体笔尖/转换器按实物确认</text>
  <path d="M790 450 H870" stroke="#9a7a4d" stroke-width="10" stroke-linecap="round"/><path d="M846 424 L878 450 L846 476" fill="none" stroke="#9a7a4d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="914" y="330" width="512" height="242" rx="28" fill="#d9e3ea"/><text x="958" y="408" font-family="Arial,sans-serif" font-size="42" fill="#253846">当前 Master 商品</text><text x="958" y="462" font-family="Arial,sans-serif" font-size="27" fill="#435a68">EF · 按压帽 · 墨囊/转换器</text><text x="958" y="506" font-family="Arial,sans-serif" font-size="24" fill="#435a68">不自动回填历史 14K</text>
  <rect x="170" y="654" width="1256" height="80" rx="18" fill="#f0eee8"/><text x="212" y="705" font-family="Arial,sans-serif" font-size="28" fill="#34383e">资料卡：以笔尖刻字、SKU、帽结构与年代建立关系，不用近似照片判断。</text>
