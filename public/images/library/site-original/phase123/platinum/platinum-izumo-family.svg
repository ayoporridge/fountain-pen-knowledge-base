  <g transform="translate(925 304)" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="585" height="112" rx="23" fill="#fffaf2" stroke="#7a6957" stroke-width="2"/>
    <text x="30" y="45" fill="#302a26" font-size="25" font-weight="700">01　Izumo 是系列入口</text>
    <text x="30" y="80" fill="#6f6255" font-size="20">不是一支拥有统一规格的钢笔</text>
    <rect y="132" width="585" height="112" rx="23" fill="#fffaf2" stroke="#7a6957" stroke-width="2"/>
    <text x="30" y="177" fill="#302a26" font-size="25" font-weight="700">02　作品类型跨度很大</text>
    <text x="30" y="212" fill="#6f6255" font-size="20">可见莳绘、编竹、木轴与多种漆饰语境</text>
    <rect y="264" width="585" height="112" rx="23" fill="#fffaf2" stroke="#7a6957" stroke-width="2"/>
    <text x="30" y="309" fill="#302a26" font-size="25" font-weight="700">03　先看 PIZ / PBA 产品代码</text>
    <text x="30" y="344" fill="#6f6255" font-size="20">相近名称也可能指向不同作品</text>
    <rect y="396" width="585" height="112" rx="23" fill="#fffaf2" stroke="#7a6957" stroke-width="2"/>
    <text x="30" y="441" fill="#302a26" font-size="25" font-weight="700">04　规格回到具体产品页</text>
    <text x="30" y="476" fill="#6f6255" font-size="20">基材、笔尖与工艺不能跨作品套用</text>
  </g>
  <text x="92" y="875" fill="#665a4e" font-family="system-ui, 'PingFang SC', sans-serif" font-size="22">本站原创事实示意图，非产品照片 · 颜色、纹样与比例仅作信息区分</text>
