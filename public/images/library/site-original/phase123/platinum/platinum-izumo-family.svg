<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-license="site-original" data-kind="factual-svg">
  <title id="title">Platinum Izumo：先识别作品代码，再看具体工艺</title>
  <desc id="desc">用多支抽象钢笔轮廓和四条中文事实介绍 Platinum Izumo 系列的作品差异。本站原创事实示意图，非产品照片；不还原商标、真实漆色、纹样或精确比例。</desc>
  <rect width="1600" height="900" fill="#efe8dc"/>
  <path d="M0 0 H1600 V250 C1300 320 1080 145 770 235 S220 320 0 225Z" fill="#302a26"/>
  <circle cx="1375" cy="690" r="260" fill="#ded0bd"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="92" y="90" fill="#d9bd90" font-size="23" letter-spacing="5">系列结构导览</text>
    <text x="92" y="170" fill="#ffffff" font-size="66" font-weight="750">PLATINUM IZUMO</text>
    <text x="92" y="216" fill="#e7d9c3" font-size="28">先识别作品代码，再看具体工艺</text>
  </g>
  <g transform="translate(90 320)">
    <g transform="rotate(-8 370 100)">
      <path d="M35 74 Q56 45 100 45 H650 Q692 45 720 74 L690 130 Q676 154 640 154 H100 Q56 154 35 126Z" fill="#59443a" stroke="#2f2521" stroke-width="5"/>
      <rect x="160" y="37" width="24" height="126" rx="10" fill="#c79d5c"/>
      <path d="M500 54 Q545 100 500 144 M555 50 Q600 98 555 148" fill="none" stroke="#8b6b55" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(45 160) rotate(4 370 100)">
      <path d="M35 74 Q56 45 100 45 H650 Q692 45 720 74 L690 130 Q676 154 640 154 H100 Q56 154 35 126Z" fill="#4b5b4a" stroke="#283329" stroke-width="5"/>
      <rect x="160" y="37" width="24" height="126" rx="10" fill="#c79d5c"/>
      <path d="M470 48 L530 152 M530 48 L590 152 M590 48 L650 146" stroke="#788b70" stroke-width="6"/>
    </g>
    <g transform="translate(0 320) rotate(-3 370 100)">
      <path d="M35 74 Q56 45 100 45 H650 Q692 45 720 74 L690 130 Q676 154 640 154 H100 Q56 154 35 126Z" fill="#67453b" stroke="#352723" stroke-width="5"/>
      <rect x="160" y="37" width="24" height="126" rx="10" fill="#c79d5c"/>
      <path d="M520 54 C560 75 560 124 610 145" fill="none" stroke="#9a6d57" stroke-width="7"/>
