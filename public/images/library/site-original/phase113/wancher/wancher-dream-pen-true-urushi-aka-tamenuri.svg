  </g>

  <text x="800" y="854" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#6d5b51">本站原创事实示意 · 非产品照片 · 非比例 · 非色漆、漆层、表面或商标复刻</text>
