<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HongDian N23 2023 Year of the Rabbit factual identity card</title>
  <desc id="desc">Site-original factual diagram: four colour variants, EF and Long Knife M market options, metal lacquered screw cap and cartridge/converter boundary. Non-photo, non-logo, not-to-scale, non-colour-proof.</desc>
