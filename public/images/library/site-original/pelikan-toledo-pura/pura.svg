<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Pelikan Pura P40 材料与供墨事实示意图</title>
  <desc id="description">本站原创 factual SVG，标出 Pura P40 的铝制笔身、钢尖、墨囊或转换器以及 2008、2011、2020 版本边界；示意图，非产品照片。</desc>
  <rect width="1600" height="900" rx="42" fill="#eef1ef"/>
  <text x="96" y="112" font-family="Georgia,serif" font-size="60" font-weight="700" fill="#2b3b3c">Pelikan Pura / P40</text>
  <text x="100" y="164" font-family="sans-serif" font-size="26" fill="#647578">aluminium body · steel nib · cartridge / converter</text>
  <g font-family="sans-serif" fill="#2b3b3c">
    <rect x="100" y="244" width="560" height="330" rx="28" fill="#c7ced0" stroke="#647477" stroke-width="5"/>
    <text x="150" y="326" font-size="38" font-weight="700">铝制外壳</text>
