    <text x="150" y="476" font-size="25" fill="#4f6264">不是 sterling silver，也不是树脂 M200</text>
    <rect x="744" y="244" width="756" height="330" rx="28" fill="#dbe6dc" stroke="#6f8f79" stroke-width="5"/>
    <text x="794" y="326" font-size="38" font-weight="700">P40 供墨</text>
    <text x="794" y="380" font-size="27">钢尖 · standard cartridge</text>
    <text x="794" y="426" font-size="27">可使用 ink converter</text>
    <text x="794" y="476" font-size="25" fill="#4c6955">约 2 × 0.8 ml cartridge 参考值</text>
    <path d="M1110 506 v-112" stroke="#4d6c5a" stroke-width="12" stroke-linecap="round"/>
    <path d="M1110 394 l-25 30 h50 z" fill="#4d6c5a"/>
    <circle cx="1245" cy="444" r="42" fill="#89aa95"/>
    <text x="1216" y="454" font-size="22" fill="#fff">P</text>
    <circle cx="1375" cy="444" r="42" fill="#a8b8bf"/>
    <text x="1348" y="454" font-size="22">K/R</text>
  </g>
  <path d="M134 700 H1466" stroke="#849892" stroke-width="5"/>
  <circle cx="350" cy="700" r="18" fill="#547867"/><circle cx="800" cy="700" r="18" fill="#547867"/><circle cx="1250" cy="700" r="18" fill="#547867"/>
