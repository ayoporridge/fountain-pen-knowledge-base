    <path d="M1068 77 C1120 36 1160 42 1173 65 C1183 83 1169 102 1148 104 L1118 108 L1168 169 C1177 181 1168 198 1152 200 C1138 201 1126 191 1118 179 L1060 116Z" fill="#2d735d" stroke="#173f35" stroke-width="7"/>
