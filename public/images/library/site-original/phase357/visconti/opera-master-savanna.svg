<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <!-- non-photo; non-logo; not-to-scale; non-colour-proof -->
  <title id="title">Visconti Opera Master Savanna factual diagram</title>
  <desc id="desc">原创事实示意图：黄棕白渐变树脂、绿色珐琅夹、Hook Safe Lock、Power Filler Double Reservoir、A18 18K 尖、2021 年 888 支限量与目录尺寸。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#ead8b7"/>
    </linearGradient>
    <linearGradient id="resin" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d4a73e"/>
      <stop offset="0.34" stop-color="#f2d784"/>
      <stop offset="0.58" stop-color="#a76a2d"/>
      <stop offset="0.82" stop-color="#f1e5bb"/>
      <stop offset="1" stop-color="#8e512a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5b3b26" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
