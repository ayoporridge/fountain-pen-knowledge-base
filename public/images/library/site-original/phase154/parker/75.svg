<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Parker 75 设计与生产阶段事实示意图</title><desc id="desc">1963 Sterling Ciselé、可调角笔尖、Parker 上墨和美国／法国生产分支；非产品照片。</desc>
  <rect width="1600" height="900" fill="#f5f1eb"/><text x="100" y="105" font-family="sans-serif" font-size="50" font-weight="700" fill="#1e293b">PARKER 75 · VARIANT MAP</text><text x="100" y="155" font-family="sans-serif" font-size="24" fill="#475569">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text>
  <g font-family="sans-serif"><rect x="110" y="260" width="360" height="290" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="155" y="330" font-size="36" font-weight="700" fill="#1e3a8a">1963</text><text x="155" y="385" font-size="29" fill="#1e293b">Sterling Ciselé</text><text x="155" y="435" font-size="23" fill="#334155">公司 75 周年</text><text x="155" y="480" font-size="23" fill="#334155">格纹纯银与 14K 尖</text>
  <rect x="610" y="220" width="380" height="180" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="650" y="285" font-size="30" font-weight="700" fill="#166534">设计核心</text><text x="650" y="335" font-size="23" fill="#334155">三角握位 · 可旋转调角尖</text><text x="650" y="370" font-size="23" fill="#334155">Parker 墨囊／转换器</text>
  <rect x="610" y="470" width="380" height="180" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="650" y="535" font-size="30" font-weight="700" fill="#92400e">生产／尖材</text><text x="650" y="585" font-size="23" fill="#334155">美国 → 法国 Meru</text><text x="650" y="620" font-size="23" fill="#334155">14K / 18K / feed 变化</text>
  <rect x="1140" y="290" width="360" height="320" rx="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="1180" y="360" font-size="31" font-weight="700" fill="#3730a3">核对字段</text><text x="1180" y="415" font-size="23" fill="#334155">尖底代码</text><text x="1180" y="455" font-size="23" fill="#334155">帽环／factory code</text><text x="1180" y="495" font-size="23" fill="#334155">section 与 feed</text><text x="1180" y="535" font-size="23" fill="#334155">格纹与材质</text>
  <path d="M470 400h130M470 440h130M990 305h140M990 560h140" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/><text x="110" y="735" font-size="25" font-weight="700" fill="#1e293b">边界</text><text x="110" y="785" font-size="22" fill="#334155">75 的共同设计不覆盖所有年份、工厂、尖材、帽饰或转换器。</text></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
</svg>
