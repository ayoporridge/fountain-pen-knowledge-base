<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Parker 61 两种上墨路线事实示意图</title><desc id="desc">1956 毛细管上墨与 1969/70 后墨囊／上墨器版本；非产品照片。</desc>
  <rect width="1600" height="900" fill="#f3f5f7"/><text x="100" y="105" font-family="sans-serif" font-size="50" font-weight="700" fill="#1e293b">PARKER 61 · FILLER BOUNDARY</text><text x="100" y="155" font-family="sans-serif" font-size="24" fill="#475569">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text>
  <g font-family="sans-serif"><rect x="130" y="260" width="470" height="320" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="180" y="335" font-size="36" font-weight="700" fill="#1e3a8a">1956–1969</text><text x="180" y="395" font-size="30" fill="#1e293b">Capillary 61</text><text x="180" y="450" font-size="24" fill="#334155">尾部毛细管浸入墨水</text><text x="180" y="495" font-size="24" fill="#334155">不能当转换器拆装</text><text x="180" y="540" font-size="24" fill="#334155">需要专门清洁</text>
  <rect x="720" y="260" width="470" height="320" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="770" y="335" font-size="36" font-weight="700" fill="#166534">1969/70–</text><text x="770" y="395" font-size="30" fill="#1e293b">Cartridge 61</text><text x="770" y="450" font-size="24" fill="#334155">Parker 墨囊／上墨器</text><text x="770" y="495" font-size="24" fill="#334155">后期 Mark 边界</text><text x="770" y="540" font-size="24" fill="#334155">现代清洗路径</text>
  <rect x="1260" y="300" width="260" height="240" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="1300" y="370" font-size="28" font-weight="700" fill="#92400e">识别先后</text><text x="1300" y="420" font-size="22" fill="#334155">尾端</text><text x="1300" y="460" font-size="22" fill="#334155">握位</text><text x="1300" y="500" font-size="22" fill="#334155">帽与刻字</text>
  <path d="M600 420h110M1190 420h60" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/><text x="130" y="725" font-size="25" font-weight="700" fill="#1e293b">边界</text><text x="130" y="775" font-size="22" fill="#334155">同名 Parker 61 可能是两种完全不同的 filler；先确认结构，再谈年份和维护。</text></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
</svg>
