<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Parker 45 结构与版本事实示意图</title>
  <desc id="desc">1960 上市、墨囊／上墨器、可更换笔尖和 finish 分支；非产品照片。</desc>
  <rect width="1600" height="900" fill="#f5f1e8"/><text x="100" y="105" font-family="sans-serif" font-size="50" font-weight="700" fill="#1e293b">PARKER 45 · IDENTITY MAP</text><text x="100" y="155" font-family="sans-serif" font-size="24" fill="#475569">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text>
  <g font-family="sans-serif"><rect x="110" y="270" width="350" height="260" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="150" y="340" font-size="38" font-weight="700" fill="#1e3a8a">1960</text><text x="150" y="395" font-size="28" fill="#1e293b">Parker 45</text><text x="150" y="445" font-size="23" fill="#334155">日用／学生市场</text><text x="150" y="485" font-size="23" fill="#334155">Eversharp 工程血缘</text>
  <rect x="610" y="220" width="380" height="170" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="650" y="285" font-size="31" font-weight="700" fill="#166534">cartridge / converter</text><text x="650" y="335" font-size="23" fill="#334155">Parker 规格墨囊／上墨器</text><text x="650" y="370" font-size="23" fill="#334155">可旋出替换笔尖总成</text>
  <rect x="610" y="470" width="380" height="170" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="650" y="535" font-size="30" font-weight="700" fill="#92400e">版本分支</text><text x="650" y="585" font-size="23" fill="#334155">塑料 · Arrow/CT · Flighter</text><text x="650" y="620" font-size="23" fill="#334155">DeLuxe · Custom · Special</text>
  <rect x="1140" y="290" width="350" height="300" rx="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="1180" y="360" font-size="31" font-weight="700" fill="#3730a3">笔尖代码</text><text x="1180" y="415" font-size="23" fill="#334155">Fine / Medium / Broad</text><text x="1180" y="455" font-size="23" fill="#334155">stub / italic / oblique</text><text x="1180" y="495" font-size="23" fill="#334155">金尖与钢尖分开</text><text x="1180" y="535" font-size="23" fill="#334155">逐支按刻字核对</text>
  <path d="M460 400h140M460 440h140M990 305h140M990 555h140" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/><text x="110" y="735" font-size="25" font-weight="700" fill="#1e293b">边界</text><text x="110" y="785" font-size="22" fill="#334155">家族共用接口不等于各 variant 的帽材、尖材、年份或尺寸相同。</text></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
</svg>
