  <text x="1080" y="350" font-size="38" fill="#3d3328" font-family="sans-serif">尾端旋钮／活塞</text>
  <text x="535" y="690" font-size="38" fill="#8d3d32" font-family="sans-serif">回退形成负压，吸入瓶装墨水</text>
  <text x="160" y="820" font-size="28" fill="#66594c" font-family="sans-serif">本站原创 factual SVG；非产品照片；not-to-scale；non-colour-proof；non-logo</text>
