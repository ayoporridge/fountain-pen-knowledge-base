<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">活塞上墨结构事实示意图</title>
  <desc id="desc">原创示意图：尾端旋钮带动活塞，笔尖浸入墨水后吸入笔身墨仓。</desc>
  <rect width="1600" height="900" fill="#f5efe4"/>
  <rect x="160" y="300" width="1080" height="220" rx="110" fill="#d4b28a" stroke="#3d3328" stroke-width="12"/>
  <rect x="420" y="330" width="620" height="160" rx="80" fill="#9fc6c0" stroke="#3d3328" stroke-width="10"/>
  <rect x="980" y="330" width="110" height="160" fill="#6e6255"/>
  <line x1="1090" y1="410" x2="1370" y2="410" stroke="#3d3328" stroke-width="18"/>
  <polygon points="1370,410 1305,370 1305,450" fill="#3d3328"/>
  <line x1="700" y1="620" x2="700" y2="510" stroke="#8d3d32" stroke-width="14"/>
  <polygon points="700,510 660,570 740,570" fill="#8d3d32"/>
