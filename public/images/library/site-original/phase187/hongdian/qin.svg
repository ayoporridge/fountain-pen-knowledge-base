  <rect width="1200" height="520" fill="#f3eee6"/>
  <rect x="54" y="54" width="1092" height="412" rx="28" fill="#fffdf8" stroke="#443c35" stroke-width="4"/>
  <text x="96" y="118" font-family="Noto Sans CJK SC, sans-serif" font-size="36" fill="#443c35">HongDian D5 · 秦</text>
  <text x="96" y="158" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#756b60">主题金属纹样与活塞上墨｜原创事实示意，不代表比例、颜色或工厂雕刻</text>
  <g transform="translate(112 238)">
    <rect x="0" y="38" width="760" height="76" rx="38" fill="#304b48"/>
    <path d="M60 38 H680 V114 H60 Z" fill="url(#pattern)" opacity=".85"/>
    <rect x="760" y="38" width="145" height="76" rx="18" fill="#bd9954"/>
    <path d="M905 38 L1018 76 L905 114 Z" fill="#d4cec2" stroke="#304b48" stroke-width="5"/>
    <text x="150" y="165" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#304b48">金属主题纹样</text>
    <text x="755" y="165" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#785c31">活塞尾端</text>
    <text x="946" y="165" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#304b48">F / Long Knife</text>
