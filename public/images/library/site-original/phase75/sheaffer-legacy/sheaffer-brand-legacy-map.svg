<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sheaffer Legacy 世代与相邻型号关系示意图</title>
  <desc id="desc">本站原创 factual SVG；示意图，非产品照片。图区分 PFM、Legacy I、Legacy II、Legacy Heritage 与当前 Legacy revival 的年代、供墨和笔尖材料边界。</desc>
  <rect width="1600" height="900" fill="#f7f1e7"/>
  <rect x="80" y="64" width="1440" height="772" rx="34" fill="#fffdf8" stroke="#29241e" stroke-width="4"/>
  <text x="142" y="150" font-family="Georgia, serif" font-size="54" fill="#29241e">Sheaffer：Legacy 不是一个单一型号</text>
  <text x="142" y="195" font-family="Arial, sans-serif" font-size="26" fill="#62594f">年代、上墨结构与笔尖材料应同时核对</text>
  <line x1="226" y1="390" x2="1370" y2="390" stroke="#8c8173" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" fill="#29241e">
    <circle cx="280" cy="390" r="20" fill="#a6503c"/><text x="218" y="345" font-size="27">1959–1968</text><text x="206" y="456" font-size="31" font-weight="700">PFM</text><text x="147" y="496" font-size="23">Snorkel 旗舰</text><text x="131" y="529" font-size="23">不是 Legacy</text>
    <circle cx="662" cy="390" r="20" fill="#b97835"/><text x="600" y="345" font-size="27">1995–1998</text><text x="590" y="456" font-size="31" font-weight="700">Legacy I</text><text x="518" y="496" font-size="23">Touchdown converter</text>
    <circle cx="887" cy="390" r="20" fill="#b97835"/><text x="841" y="345" font-size="27">1999 起</text><text x="810" y="456" font-size="31" font-weight="700">Legacy II</text><text x="743" y="496" font-size="23">Touchdown converter</text>
    <circle cx="1120" cy="390" r="24" fill="#285a6a"/><text x="1068" y="345" font-size="27">2003 起</text><text x="1010" y="456" font-size="31" font-weight="700">Legacy Heritage</text><text x="1015" y="496" font-size="23">18K 嵌入尖 + C/C</text>
    <circle cx="1370" cy="390" r="20" fill="#6e6a65"/><text x="1303" y="345" font-size="27">2025–26</text><text x="1271" y="456" font-size="31" font-weight="700">Legacy revival</text><text x="1281" y="496" font-size="23">steel 嵌入尖</text>
  </g>
  <rect x="145" y="618" width="1310" height="138" rx="20" fill="#e9dfcf"/>
  <text x="192" y="673" font-family="Arial, sans-serif" font-size="28" fill="#29241e">读二手资料时：先看笔尖、尾端与供墨件；再核对年代、款号和饰面。</text>
  <text x="192" y="718" font-family="Arial, sans-serif" font-size="25" fill="#62594f">PFM 的 Snorkel、Legacy I/II 的专用 Touchdown converter、Heritage 的 C/C 互不替代。</text>
  <text x="96" y="812" font-family="Arial, sans-serif" font-size="19" fill="#62594f">Fountain Pen Graph 原创 factual SVG｜示意图，非产品照片｜不代表真实比例、颜色、Logo、刻字、笔尖、材质或具体 SKU</text>
</svg>
