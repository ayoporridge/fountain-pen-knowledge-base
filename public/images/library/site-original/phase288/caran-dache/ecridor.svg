<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Caran d’Ache Ecridor identity diagram</title>
  <desc id="desc">Original factual diagram showing a hexagonal Ecridor body, engraved Chevron and Avenue patterns, steel nib, and cartridge or converter boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#dce3ea"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#747f8a"/>
      <stop offset="0.45" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#87929c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#202a33">
    <text x="90" y="110" font-size="50" font-weight="700">Caran d’Ache Ecridor™</text>
    <text x="92" y="160" font-size="24" fill="#55636e">六角黄铜笔身 · guilloché 纹样 · 钢尖 · 墨囊／转换器</text>
  </g>
  <g transform="translate(150 330) rotate(-7)">
    <polygon points="0,80 90,0 850,0 940,80 850,160 90,160" fill="url(#metal)" stroke="#3f4b55" stroke-width="5"/>
    <polygon points="90,0 850,0 850,160 90,160" fill="#bcc6ce" opacity=".35"/>
    <path d="M180 20 L250 80 L180 140 M310 20 L380 80 L310 140 M440 20 L510 80 L440 140 M570 20 L640 80 L570 140" fill="none" stroke="#66727c" stroke-width="14" opacity=".75"/>
    <rect x="720" y="-10" width="36" height="180" rx="12" fill="#d8dee3" stroke="#4f5b65" stroke-width="4"/>
    <polygon points="940,80 1055,58 1055,102" fill="#adb8c1" stroke="#3f4b55" stroke-width="5"/>
    <path d="M1055 58 L1115 80 L1055 102 Z" fill="#eef2f5" stroke="#3f4b55" stroke-width="5"/>
    <line x1="1090" y1="70" x2="1090" y2="90" stroke="#63717c" stroke-width="4"/>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#26333d">
    <g transform="translate(190 650)"><circle cx="0" cy="0" r="10" fill="#8797a4"/><text x="28" y="8">六角黄铜笔身与笔帽</text></g>
    <g transform="translate(650 650)"><circle cx="0" cy="0" r="10" fill="#8797a4"/><text x="28" y="8">Chevron／Avenue 等雕刻纹样</text></g>
    <g transform="translate(1080 650)"><circle cx="0" cy="0" r="10" fill="#8797a4"/><text x="28" y="8">钢尖；尖幅按 SKU</text></g>
    <g transform="translate(360 745)"><rect x="0" y="-18" width="34" height="34" rx="7" fill="#8da1b1"/><text x="55" y="8">Caran d’Ache 墨囊</text></g>
    <g transform="translate(890 745)"><rect x="0" y="-18" width="34" height="34" rx="7" fill="#8da1b1"/><text x="55" y="8">piston ink pump 转换器</text></g>
  </g>
  <text x="90" y="850" font-family="system-ui, sans-serif" font-size="19" fill="#64737f">本站原创 factual SVG；非产品照片、非比例图、非颜色校样或品牌 Logo。</text>
</svg>
