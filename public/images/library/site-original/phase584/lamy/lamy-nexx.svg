  <g transform="translate(130 300)">
    <path d="M0 125 L760 70 L760 180 Z" fill="url(#al)" stroke="#d8e8e2" stroke-width="6"/>
    <rect x="715" y="58" width="250" height="134" rx="62" fill="#283b38" stroke="#96d2c4" stroke-width="8"/>
    <path d="M965 82 L1195 125 L965 168 Z" fill="#e8eee9"/>
