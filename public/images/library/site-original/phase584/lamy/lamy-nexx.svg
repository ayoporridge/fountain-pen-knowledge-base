  <g font-family="ui-sans-serif,system-ui">
    <g transform="translate(120 560)"><path d="M0 100 L90 0 L180 100 Z" fill="none" stroke="#b9ddd3" stroke-width="8"/><text x="220" y="50" fill="#f2f6e9" font-size="25">三角截面减少滚动</text><text x="220" y="88" fill="#b9ddd3" font-size="20">不是圆杆，也不是 AL-star 的透明握位</text></g>
    <rect x="930" y="535" width="530" height="170" rx="28" fill="#f2f6e9"/>
