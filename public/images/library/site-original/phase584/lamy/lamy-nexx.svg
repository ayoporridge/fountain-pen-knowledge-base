  <desc id="desc">本站原创示意图，非产品照片。解释 LAMY nexx 的三角阳极铝笔杆、橡胶化握位、钢尖和当前 A、M、LH 选择。</desc>
  <defs><linearGradient id="bgn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102c2b"/><stop offset="1" stop-color="#1d5d55"/></linearGradient><linearGradient id="al" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#91a3a2"/><stop offset=".5" stop-color="#dce4df"/><stop offset="1" stop-color="#778d89"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bgn)"/>
  <text x="110" y="130" fill="#f2f6e9" font-size="64" font-family="ui-sans-serif,system-ui" font-weight="700">LAMY nexx</text>
