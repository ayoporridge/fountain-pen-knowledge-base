<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <!-- Fountain Pen Graph site-original factual diagram: non-photo, non-logo, not-to-scale, non-colour-proof. -->
  <title id="title">SCRIBO Piuma factual diagram</title>
  <desc id="desc">A non-photo, non-logo, not-to-scale, non-colour-proof editorial diagram showing the SCRIBO Piuma resin cartridge/converter platform and its two gold nib routes.</desc>
  <rect width="1600" height="900" fill="#f3eee8"/>
  <rect x="72" y="72" width="1456" height="756" rx="34" fill="#fffdfa" stroke="#2b3035" stroke-width="4"/>
