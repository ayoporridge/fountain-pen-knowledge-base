    <text x="34" y="94" fill="#6b4b1c" font-family="Arial, sans-serif" font-size="21">EEF · EF · F · M · B</text>
    <text x="34" y="128" fill="#6b4b1c" font-family="Arial, sans-serif" font-size="19">BBB · 1.4 mm Stub</text>
    <rect x="0" y="190" width="315" height="154" rx="24" fill="#e3c3b6" stroke="#a45b45" stroke-width="4"/>
    <text x="34" y="243" fill="#68392e" font-family="Arial, sans-serif" font-size="27" font-weight="700">14K Extra-Flexible</text>
    <text x="34" y="285" fill="#68392e" font-family="Arial, sans-serif" font-size="21">EF · F · M · B</text>
