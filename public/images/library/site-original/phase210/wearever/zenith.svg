<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wearever Zenith factual diagram</title>
  <desc id="desc">Original editorial diagram showing the polystyrene solid-color body, ruby jewels, lever filler and wartime nib boundary. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#e9e5dc"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="#fffdf8" stroke="#3c3935" stroke-width="4"/>
  <text x="130" y="170" fill="#282522" font-family="sans-serif" font-size="60" font-weight="700">WEAREVER · ZENITH</text>
  <text x="134" y="225" fill="#71675e" font-family="sans-serif" font-size="28">1943–约 1950 · polystyrene · lever filler · 历史结构示意</text>
  <g transform="translate(150 330)">
    <path d="M90 160 H1100 C1165 160 1210 180 1245 215 L1320 275 L1245 335 C1210 370 1165 390 1100 390 H90 Z" fill="#253f55" stroke="#3f3a35" stroke-width="10"/>
    <path d="M90 160 H330 V390 H90 Z" fill="#304e68"/>
    <path d="M350 160 H1030 V390 H350 Z" fill="#2d485e" opacity=".95"/>
    <path d="M1050 160 H1100 C1165 160 1210 180 1245 215 L1320 275 L1245 335 C1210 370 1165 390 1100 390 H1050 Z" fill="#2a4356"/>
    <path d="M1238 237 L1380 275 L1238 313 L1200 275 Z" fill="#c95b4d" stroke="#3f3a35" stroke-width="8"/>
    <circle cx="150" cy="275" r="28" fill="#c95b4d" stroke="#3f3a35" stroke-width="8"/>
    <path d="M150 275 l35 -27 M150 275 l-31 28" stroke="#ddd3c4" stroke-width="7"/>
    <rect x="520" y="365" width="180" height="28" rx="8" fill="#b8a47c" stroke="#3f3a35" stroke-width="6"/>
    <path d="M600 392 V505 M600 505 C570 550 650 550 620 595" fill="none" stroke="#6c5b40" stroke-width="16"/>
    <text x="390" y="285" fill="#f4efe5" font-family="sans-serif" font-size="34" font-weight="700">纯色 polystyrene 杆帽</text>
  </g>
  <g fill="#403b36" font-family="sans-serif" font-size="30">
    <text x="160" y="760">红色 ruby top 固定夹子，尾端有相配顶珠</text>
    <text x="790" y="760">战时 14K 金尖／战后钢尖按单支核对</text>
    <text x="1210" y="760">示意图，非产品照片</text>
  </g>
</svg>
