<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Diplomat Excellence A+ factual diagram</title>
  <desc id="desc">A factual, non-photo diagram for Diplomat Excellence A+ showing the one-third-turn screw cap, the Rhomb steel SKU snapshot, nib boundaries, and the distinction from Excellence A2.</desc>
  <rect width="1600" height="900" fill="#f5f1ea"/>
  <rect x="54" y="54" width="1492" height="792" rx="34" fill="#fffdf9" stroke="#232323" stroke-width="4"/>
  <text x="112" y="138" fill="#181818" font-family="Arial, sans-serif" font-size="54" font-weight="700">Diplomat Excellence A+</text>
  <text x="114" y="190" fill="#555" font-family="Arial, sans-serif" font-size="25">事实卡 · 示意图，非产品照片</text>
  <g transform="translate(118 260)">
    <rect x="0" y="90" width="760" height="118" rx="58" fill="#222"/>
    <rect x="94" y="78" width="116" height="142" rx="22" fill="#989898" stroke="#111" stroke-width="5"/>
    <path d="M196 90h510c40 0 72 32 72 72s-32 72-72 72H196z" fill="#393939"/>
    <path d="M698 90h86c40 0 72 32 72 72s-32 72-72 72h-86c34-39 34-105 0-144z" fill="#c4c4c4"/>
    <path d="M806 116c-20 13-30 27-30 46s10 33 30 46" fill="none" stroke="#efe6c8" stroke-width="8"/>
    <path d="M819 116c-20 13-30 27-30 46s10 33 30 46" fill="none" stroke="#efe6c8" stroke-width="8"/>
    <circle cx="907" cy="162" r="34" fill="#b7a36a" stroke="#5d4d2a" stroke-width="5"/>
    <path d="M944 162h96" stroke="#b7a36a" stroke-width="9"/>
    <path d="M1040 162l38-28v56z" fill="#b7a36a"/>
    <text x="0" y="286" fill="#262626" font-family="Arial, sans-serif" font-size="30" font-weight="700">金属螺纹帽 · 约三分之一圈</text>
    <text x="0" y="330" fill="#555" font-family="Arial, sans-serif" font-size="24">Rhomb / Wave 是 A+ 的 SKU 变体</text>
  </g>
  <g transform="translate(1010 274)">
    <rect width="420" height="270" rx="24" fill="#f0ece4" stroke="#bcae9c" stroke-width="3"/>
    <text x="30" y="52" fill="#222" font-family="Arial, sans-serif" font-size="27" font-weight="700">Rhomb 钢尖样本</text>
    <text x="30" y="100" fill="#444" font-family="Arial, sans-serif" font-size="23">黄铜 · 45 g</text>
    <text x="30" y="138" fill="#444" font-family="Arial, sans-serif" font-size="23">136 / 155 / 14.7 mm</text>
    <text x="30" y="176" fill="#444" font-family="Arial, sans-serif" font-size="23">钢尖 · converter</text>
    <text x="30" y="214" fill="#444" font-family="Arial, sans-serif" font-size="23">2 支短国际墨胆</text>
  </g>
  <g transform="translate(130 650)">
    <rect width="560" height="112" rx="20" fill="#e5efe9" stroke="#6b8b7a" stroke-width="3"/>
    <text x="28" y="43" fill="#244638" font-family="Arial, sans-serif" font-size="25" font-weight="700">A+ 尖材边界</text>
    <text x="28" y="82" fill="#315b48" font-family="Arial, sans-serif" font-size="22">steel 或 14K bi-colour · EF/F/M/B</text>
  </g>
  <g transform="translate(740 650)">
    <rect width="690" height="112" rx="20" fill="#f5e8e5" stroke="#ad7770" stroke-width="3"/>
    <text x="28" y="43" fill="#6b2b24" font-family="Arial, sans-serif" font-size="25" font-weight="700">与 A2 分开</text>
    <text x="28" y="82" fill="#7e4841" font-family="Arial, sans-serif" font-size="22">A2 = Soft Sliding Click 按压帽；不是 A+</text>
  </g>
  <text x="112" y="812" fill="#777" font-family="Arial, sans-serif" font-size="18">SITE-ORIGINAL FACTUAL SVG · NON-PHOTO · NON-LOGO · NOT-TO-SCALE · NON-COLOUR-PROOF</text>
</svg>
