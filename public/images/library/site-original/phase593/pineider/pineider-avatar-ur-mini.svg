<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Avatar UR Mini 钢笔事实示意图</title>
  <desc id="desc">本站原创事实示意图，非产品照片。用紧凑通用钢笔轮廓和四项中文要点介绍 UltraResin、F 与 M 尖幅、墨囊上墨器和磁吸笔帽；图形、配色和比例不代表实物。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2f5"/>
      <stop offset="1" stop-color="#d8e7eb"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e6075"/>
      <stop offset="0.5" stop-color="#6b9aab"/>
      <stop offset="1" stop-color="#244e61"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#244e61" flood-opacity="0.2"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .fact-title { font-size: 24px; font-weight: 750; fill: #1d4457; }
      .fact-copy { font-size: 20px; fill: #557280; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1408" cy="120" r="245" fill="#2b7381" opacity="0.07"/>
  <circle cx="112" cy="800" r="215" fill="#d18256" opacity="0.07"/>
  <g class="text">
    <text x="90" y="92" font-size="25" letter-spacing="4" fill="#587884">紧凑型日用钢笔</text>
    <text x="90" y="155" font-size="51" font-weight="780" fill="#173b4d">Pineider Avatar UR Mini</text>
    <text x="92" y="198" font-size="24" fill="#557281">SPP6801／941 · Mini 是独立型号</text>

    <g transform="translate(90 286)" filter="url(#shadow)" aria-label="紧凑通用钢笔轮廓">
      <rect width="800" height="360" rx="38" fill="#fbfdfe"/>
      <text x="38" y="58" font-size="21" fill="#617c88">紧凑轮廓：短笔帽、笔杆、握位与笔尖</text>
      <g transform="translate(92 118)">
        <path d="M8 34Q8 9 38 9H236Q268 9 284 34V110Q268 135 236 135H38Q8 135 8 110Z" fill="url(#body)"/>
        <path d="M274 27Q308 11 348 19L492 38Q523 43 538 72Q523 101 492 106L348 125Q308 133 274 117Z" fill="#477d8f"/>
        <rect x="507" y="42" width="58" height="60" rx="22" fill="#c8d1d4"/>
        <path d="M558 39L622 72L558 105Q535 72 558 39Z" fill="#e5ebec" stroke="#6e7f84" stroke-width="4"/>
        <path d="M571 72H608" stroke="#6e7f84" stroke-width="3"/>
        <path d="M8 158H620" stroke="#9fb6be" stroke-width="3"/>
        <text x="314" y="196" text-anchor="middle" font-size="18" fill="#718993">图中短长关系仅用于提示“Mini”定位</text>
      </g>
    </g>

    <g transform="translate(950 286)">
      <g data-reader-fact="1">
        <rect width="560" height="96" rx="22" fill="#fbfdfe" stroke="#a9c1ca" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#397287"/><text x="80" y="43" class="fact-title">UltraResin 笔身</text>
        <text x="80" y="73" class="fact-copy">树脂表面用柔软布轻拭</text>
      </g>
      <g transform="translate(0 116)" data-reader-fact="2">
        <rect width="560" height="96" rx="22" fill="#fbfdfe" stroke="#a9c1ca" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#397287"/><text x="80" y="43" class="fact-title">F、M 两种尖幅</text>
        <text x="80" y="73" class="fact-copy">标称尖幅不等于固定纸面线宽</text>
      </g>
      <g transform="translate(0 232)" data-reader-fact="3">
        <rect width="560" height="96" rx="22" fill="#fbfdfe" stroke="#d5b08c" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#b8754e"/><text x="80" y="43" class="fact-title">墨囊／上墨器</text>
        <text x="80" y="73" class="fact-copy">不是 Alba Mini 的墨囊专用结构</text>
      </g>
      <g transform="translate(0 348)" data-reader-fact="4">
        <rect width="560" height="96" rx="22" fill="#fbfdfe" stroke="#d5b08c" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#b8754e"/><text x="80" y="43" class="fact-title">磁吸笔帽</text>
        <text x="80" y="73" class="fact-copy">沿轴线拔取，避免横向撬动</text>
      </g>
    </g>

    <rect x="90" y="762" width="1420" height="82" rx="25" fill="#173b4d"/>
    <text x="800" y="797" text-anchor="middle" font-size="23" font-weight="700" fill="#f3fbfd">本站原创事实示意图，非产品照片</text>
    <text x="800" y="826" text-anchor="middle" font-size="18" fill="#c4d8df">未复制品牌 logo；轮廓、颜色、材质效果与比例不代表实物</text>
  </g>
</svg>
