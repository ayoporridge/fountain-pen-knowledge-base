<rect width="1600" height="900" fill="#fff3d8"/><text x="90" y="105" font-size="54" font-family="sans-serif" fill="#342d54">Kakuno｜把正确方向画在笔尖上</text>
<text x="90" y="160" font-size="24" font-family="sans-serif" fill="#6e6483">本站原创示意图，非产品照片｜非比例、非颜色／表面复刻｜不含 Pilot Logo</text>
<polygon points="160,360 420,230 720,360 420,490" fill="#f2a65a" stroke="#342d54" stroke-width="6"/><path d="M720 360 L930 250 L1040 360 L930 470 Z" fill="#d7d9e1" stroke="#342d54" stroke-width="6"/>
