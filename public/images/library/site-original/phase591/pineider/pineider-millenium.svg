<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Millenium 钢笔事实示意图</title>
  <desc id="desc">本站原创事实示意图，非产品照片。用直身通用钢笔轮廓和四项中文要点介绍铝制笔身、14K 笔尖、活塞上墨与磁吸笔帽；图形、配色和比例不代表实物。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20293a"/>
      <stop offset="1" stop-color="#424a60"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8cdd5"/>
      <stop offset="0.48" stop-color="#606b7a"/>
      <stop offset="1" stop-color="#2a3342"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#080d17" flood-opacity="0.35"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .fact-title { font-size: 24px; font-weight: 750; fill: #f5ead0; }
      .fact-copy { font-size: 20px; fill: #c7d0de; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M1190 0H1600V900H1375C1452 643 1327 488 1401 290C1443 178 1370 87 1190 0Z" fill="#dfaf5e" opacity="0.08"/>
  <g class="text">
    <text x="90" y="90" font-size="25" letter-spacing="4" fill="#bfc9db">金属笔身与活塞结构</text>
    <text x="90" y="154" font-size="51" font-weight="780" fill="#fff8e9">Pineider Millenium</text>
    <text x="92" y="198" font-size="24" fill="#c6cfdf">PP4801／945 · 商品名采用单 n 拼写</text>

    <g transform="translate(90 277)" filter="url(#shadow)" aria-label="直身通用钢笔轮廓">
      <rect width="800" height="390" rx="38" fill="#171e2b" stroke="#68758b" stroke-width="2"/>
      <text x="40" y="60" font-size="21" fill="#aeb9cb">直身钢笔轮廓：笔帽、铝制笔杆、尾钮与笔尖</text>
      <g transform="translate(50 133)">
        <rect x="0" y="12" width="285" height="118" rx="22" fill="url(#metal)"/>
        <rect x="279" y="20" width="285" height="102" rx="18" fill="#111722" stroke="#808b9b" stroke-width="3"/>
        <rect x="538" y="30" width="82" height="82" rx="25" fill="#b7a77e"/>
        <path d="M610 34L688 71L610 108Q584 71 610 34Z" fill="#f0dfb3" stroke="#b1833b" stroke-width="4"/>
        <path d="M624 71H674" stroke="#b1833b" stroke-width="3"/>
        <rect x="295" y="34" width="38" height="74" rx="12" fill="#d9ad5e" opacity="0.78"/>
        <path d="M44 151H684" stroke="#7c899d" stroke-width="3"/>
        <text x="362" y="190" text-anchor="middle" font-size="18" fill="#9da9bc">装饰性通用轮廓，不用于判断实物外观</text>
      </g>
    </g>

    <g transform="translate(948 277)">
      <g data-reader-fact="1">
        <rect width="562" height="104" rx="22" fill="#283247" stroke="#7a879b" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#d6a653"/><text x="80" y="47" class="fact-title">铝制笔身</text>
        <text x="80" y="77" class="fact-copy">黑色 PVD 表面处理</text>
      </g>
      <g transform="translate(0 124)" data-reader-fact="2">
        <rect width="562" height="104" rx="22" fill="#283247" stroke="#7a879b" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#d6a653"/><text x="80" y="47" class="fact-title">14K 笔尖</text>
        <text x="80" y="77" class="fact-copy">F、M、S、B、EF 五种标称尖幅</text>
      </g>
      <g transform="translate(0 248)" data-reader-fact="3">
        <rect width="562" height="104" rx="22" fill="#283247" stroke="#7a879b" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#d6a653"/><text x="80" y="47" class="fact-title">活塞上墨</text>
        <text x="80" y="77" class="fact-copy">墨水储存在笔杆内部</text>
      </g>
      <g transform="translate(0 372)" data-reader-fact="4">
        <rect width="562" height="104" rx="22" fill="#283247" stroke="#7a879b" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#d6a653"/><text x="80" y="47" class="fact-title">Twist Magnetic Lock</text>
        <text x="80" y="77" class="fact-copy">笔帽采用旋转磁吸闭合</text>
      </g>
    </g>

    <rect x="90" y="768" width="1420" height="76" rx="24" fill="#111722"/>
    <text x="800" y="800" text-anchor="middle" font-size="23" font-weight="700" fill="#fff4dc">本站原创事实示意图，非产品照片</text>
    <text x="800" y="829" text-anchor="middle" font-size="18" fill="#b8c2d2">未复制品牌 logo；轮廓、金属效果、配色与比例不代表实物</text>
  </g>
</svg>
