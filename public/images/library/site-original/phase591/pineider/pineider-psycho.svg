<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Psycho 钢笔事实示意图</title>
  <desc id="desc">本站原创事实示意图，非产品照片。用宽身通用钢笔轮廓和四项中文要点介绍三种饰面、925 银部件、14K 弹性笔尖与墨囊上墨器；图形、配色和比例不代表实物。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5eee8"/>
      <stop offset="1" stop-color="#eaded8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#573c51"/>
      <stop offset="0.5" stop-color="#8b6074"/>
      <stop offset="1" stop-color="#3c2b3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#593a46" flood-opacity="0.2"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .fact-title { font-size: 24px; font-weight: 750; fill: #4e2f43; }
      .fact-copy { font-size: 20px; fill: #725769; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 0H1600V185C1270 127 1060 230 760 165C430 94 215 205 0 147Z" fill="#3f2e40"/>
  <g class="text">
    <text x="90" y="78" font-size="24" letter-spacing="4" fill="#d6c2d1">宽身轮廓与日常使用</text>
    <text x="90" y="140" font-size="52" font-weight="790" fill="#fff9fc">Pineider Psycho</text>
    <text x="92" y="180" font-size="24" fill="#dfcdd8">PP4301／468 · 同一型号有多种饰面</text>

    <g transform="translate(90 270)" filter="url(#shadow)" aria-label="宽身通用钢笔轮廓">
      <rect width="780" height="380" rx="38" fill="#fffdfb"/>
      <text x="38" y="58" font-size="21" fill="#806d78">可辨认轮廓：宽笔帽、鼓形笔杆、握位与笔尖</text>
      <g transform="translate(46 126)">
        <path d="M18 22Q18 0 54 0H290Q327 0 344 31V121Q327 152 290 152H54Q18 152 18 130Z" fill="url(#body)"/>
        <path d="M332 19Q382 0 445 12L574 34Q612 41 627 76Q612 111 574 118L445 140Q382 152 332 133Z" fill="#6b4b60"/>
        <rect x="590" y="44" width="72" height="64" rx="24" fill="#c8b6a3"/>
        <path d="M652 46L704 76L652 106Q632 76 652 46Z" fill="#f1dfb8" stroke="#9c773f" stroke-width="4"/>
        <path d="M664 76H692" stroke="#9c773f" stroke-width="3"/>
        <rect x="303" y="15" width="34" height="122" rx="15" fill="#d4c8c2"/>
        <path d="M38 176H700" stroke="#c1aeb7" stroke-width="3"/>
        <text x="367" y="211" text-anchor="middle" font-size="18" fill="#846f7a">装饰性通用轮廓，不复刻商品造型</text>
      </g>
    </g>

    <g transform="translate(930 270)">
      <g data-reader-fact="1">
        <rect width="580" height="104" rx="22" fill="#fffdfb" stroke="#c6aab7" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#785268"/><text x="80" y="47" class="fact-title">三种饰面选择</text>
        <text x="80" y="77" class="fact-copy">Palladium、Yellow Gold、Rose Gold</text>
      </g>
      <g transform="translate(0 124)" data-reader-fact="2">
        <rect width="580" height="104" rx="22" fill="#fffdfb" stroke="#c6aab7" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#785268"/><text x="80" y="47" class="fact-title">925 银部件</text>
        <text x="80" y="77" class="fact-copy">饰面名称不代表整笔都是贵金属</text>
      </g>
      <g transform="translate(0 248)" data-reader-fact="3">
        <rect width="580" height="104" rx="22" fill="#fffdfb" stroke="#d4b276" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#b17d38"/><text x="80" y="47" class="fact-title">14K 弹性笔尖</text>
        <text x="80" y="77" class="fact-copy">书写时仍应避免过度重压</text>
      </g>
      <g transform="translate(0 372)" data-reader-fact="4">
        <rect width="580" height="104" rx="22" fill="#fffdfb" stroke="#d4b276" stroke-width="2"/>
        <circle cx="42" cy="52" r="20" fill="#b17d38"/><text x="80" y="47" class="fact-title">墨囊／上墨器</text>
        <text x="80" y="77" class="fact-copy">拆卸清洗前先确认接口松开</text>
      </g>
    </g>

    <rect x="90" y="768" width="1420" height="76" rx="24" fill="#3f2e40"/>
    <text x="800" y="800" text-anchor="middle" font-size="23" font-weight="700" fill="#fff6fb">本站原创事实示意图，非产品照片</text>
    <text x="800" y="829" text-anchor="middle" font-size="18" fill="#d9c8d2">未复制品牌 logo；轮廓、饰面色、材质效果与比例不代表实物</text>
  </g>
</svg>
