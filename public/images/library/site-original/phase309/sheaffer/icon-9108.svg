<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sheaffer ICON 9108 identity card</title>
  <desc id="desc">本站原创事实示意图，概括 Sheaffer ICON 9108 当前市场 SKU 的资料范围。non-photo; not-to-scale; non-colour-proof；不是颜色或 SKU 复刻。</desc>
  <rect width="1200" height="760" fill="#eef1f6"/>
  <rect x="44" y="44" width="1112" height="672" rx="28" fill="#fff" stroke="#283b61" stroke-width="4"/>
  <text x="86" y="118" fill="#283b61" font-family="Georgia, serif" font-size="50" font-weight="700">Sheaffer ICON 9108</text>
  <text x="88" y="160" fill="#526582" font-family="Arial, sans-serif" font-size="24">当前市场 SKU · Matte Black / Medium 范围</text>
  <g transform="translate(92 225)">
    <rect width="1016" height="154" rx="24" fill="#edf0f6" stroke="#a9b4c9" stroke-width="2"/>
    <path d="M88 78 C164 26 356 26 432 78 C356 130 164 130 88 78 Z" fill="#34373d" stroke="#283b61" stroke-width="4"/>
    <path d="M142 58 C208 28 314 28 378 58" fill="none" stroke="#d8b45b" stroke-width="10" stroke-linecap="round"/>
    <text x="536" y="72" fill="#283b61" font-family="Arial, sans-serif" font-size="25" font-weight="700">官方页面身份</text>
    <text x="536" y="110" fill="#435675" font-family="Arial, sans-serif" font-size="20">9108 · black finish · Medium nib</text>
  </g>
  <g transform="translate(92 430)">
    <text x="0" y="0" fill="#283b61" font-family="Arial, sans-serif" font-size="27" font-weight="700">阅读边界</text>
    <text x="0" y="48" fill="#403d38" font-family="Arial, sans-serif" font-size="23">• 官方产品页的 converter 与两支 Classic cartridges 是本 SKU 的供墨线索。</text>
    <text x="0" y="90" fill="#403d38" font-family="Arial, sans-serif" font-size="23">• Art Deco 夹和包裹式夹是设计描述，不推导 flex 等级或其他型号规格。</text>
    <text x="0" y="132" fill="#403d38" font-family="Arial, sans-serif" font-size="23">• 与 Connaisseur、Imperial 分开引用来源；这张图只服务 ICON 9108。</text>
  </g>
  <text x="92" y="676" fill="#6b665e" font-family="Arial, sans-serif" font-size="19">用途：准确指向 9108 当前 SKU 的证据范围；非产品照片、非颜色校样、非比例图。</text>
</svg>
