<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Egosphere 钢笔事实示意图</title>
  <desc id="desc">本站原创事实示意图，非产品照片。用通用钢笔轮廓、方圆变化图形和四项中文要点介绍 Luigi Trenti 的设计、1056 与 1058 两个版本；图形、配色和比例不代表实物。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ede2"/>
      <stop offset="1" stop-color="#e4ddd0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d464d"/>
      <stop offset="0.55" stop-color="#778087"/>
      <stop offset="1" stop-color="#30383e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4a4137" flood-opacity="0.2"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .fact-title { font-size: 24px; font-weight: 750; fill: #3f3932; }
      .fact-copy { font-size: 20px; fill: #6f665b; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M1260 0H1600V315Q1447 243 1332 158Q1282 118 1260 0Z" fill="#805d45" opacity="0.09"/>
  <g class="text">
    <text x="90" y="92" font-size="25" letter-spacing="4" fill="#786d60">方圆变化的笔帽概念</text>
    <text x="90" y="155" font-size="52" font-weight="780" fill="#36312c">Pineider Egosphere</text>
    <text x="92" y="198" font-size="24" fill="#756b60">1056 与 1058 属于同一设计家族</text>

    <g transform="translate(90 276)" filter="url(#shadow)" aria-label="带方圆变化笔帽的通用钢笔轮廓">
      <rect width="810" height="385" rx="38" fill="#fffdf8"/>
      <text x="38" y="58" font-size="21" fill="#756d63">轮廓提示：笔帽从棱角过渡到圆形</text>
      <g transform="translate(48 110)">
        <rect x="8" y="17" width="285" height="142" rx="30" fill="url(#body)"/>
        <rect x="282" y="31" width="300" height="114" rx="57" fill="#606a70"/>
        <rect x="555" y="44" width="76" height="88" rx="29" fill="#c3b79f"/>
        <path d="M620 48L702 88L620 128Q592 88 620 48Z" fill="#e8ddc3" stroke="#8f7651" stroke-width="4"/>
        <path d="M635 88H686" stroke="#8f7651" stroke-width="3"/>
        <rect x="28" y="45" width="70" height="70" rx="7" fill="none" stroke="#d8c69f" stroke-width="4"/>
        <path d="M112 80H150" stroke="#d8c69f" stroke-width="4"/><path d="M143 68L159 80L143 92" fill="none" stroke="#d8c69f" stroke-width="4"/>
        <rect x="166" y="48" width="64" height="64" rx="22" fill="none" stroke="#d8c69f" stroke-width="4"/>
        <path d="M241 80H270" stroke="#d8c69f" stroke-width="4"/>
        <circle cx="271" cy="80" r="30" fill="none" stroke="#f2e5c6" stroke-width="4"/>
        <path d="M10 188H700" stroke="#c2b6a4" stroke-width="3"/>
        <text x="355" y="224" text-anchor="middle" font-size="18" fill="#7a7167">概念化轮廓，不复刻商品外形或装饰</text>
      </g>
    </g>

    <g transform="translate(960 276)">
      <g data-reader-fact="1">
        <rect width="550" height="96" rx="22" fill="#fffdf8" stroke="#cbbda9" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#735845"/><text x="80" y="43" class="fact-title">Luigi Trenti 设计</text>
        <text x="80" y="73" class="fact-copy">1999 年提出 Egosphere 概念</text>
      </g>
      <g transform="translate(0 116)" data-reader-fact="2">
        <rect width="550" height="96" rx="22" fill="#fffdf8" stroke="#cbbda9" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#735845"/><text x="80" y="43" class="fact-title">方形到圆形</text>
        <text x="80" y="73" class="fact-copy">笔帽以渐变轮廓表达形态转换</text>
      </g>
      <g transform="translate(0 232)" data-reader-fact="3">
        <rect width="550" height="96" rx="22" fill="#fffdf8" stroke="#9da8aa" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#66747a"/><text x="80" y="43" class="fact-title">1056 版本</text>
        <text x="80" y="73" class="fact-copy">实心树脂与 925 银中环</text>
      </g>
      <g transform="translate(0 348)" data-reader-fact="4">
        <rect width="550" height="96" rx="22" fill="#fffdf8" stroke="#9da8aa" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#66747a"/><text x="80" y="43" class="fact-title">1058 版本</text>
        <text x="80" y="73" class="fact-copy">装饰叙事提到厄尔巴岛碧玉</text>
      </g>
    </g>

    <rect x="90" y="770" width="1420" height="76" rx="24" fill="#36312c"/>
    <text x="800" y="802" text-anchor="middle" font-size="23" font-weight="700" fill="#fff8eb">本站原创事实示意图，非产品照片</text>
    <text x="800" y="831" text-anchor="middle" font-size="18" fill="#d6cabb">未复制品牌 logo；轮廓、石材效果、颜色与比例不代表实物</text>
  </g>
</svg>
