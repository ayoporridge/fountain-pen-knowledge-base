<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Graphomatic factual diagram</title>
  <desc id="desc">Original editorial diagram showing Graph-O-Matic wartime ink-making context and Grieshaber/Sager source boundary. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#e8e3d9"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="#fffdf8" stroke="#403a35" stroke-width="4"/>
  <text x="130" y="170" fill="#282522" font-family="sans-serif" font-size="58" font-weight="700">GRAPH-O-MATIC</text>
  <text x="134" y="225" fill="#71675e" font-family="sans-serif" font-size="28">1942 wartime ink-making context · historical relationship diagram</text>
  <g font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle">
    <rect x="150" y="330" width="340" height="130" rx="24" fill="#c5a47b" stroke="#4a443e" stroke-width="6"/>
    <text x="320" y="405" fill="#403933">Grieshaber</text>
    <rect x="630" y="330" width="340" height="130" rx="24" fill="#5d7180" stroke="#4a443e" stroke-width="6"/>
    <text x="800" y="405" fill="#f4efe5">Graph-O-Matic</text>
    <rect x="1110" y="330" width="340" height="130" rx="24" fill="#8e4d40" stroke="#4a443e" stroke-width="6"/>
    <text x="1280" y="405" fill="#fff8ef">Sager</text>
  </g>
  <g stroke="#75634f" stroke-width="8" fill="none">
    <path d="M490 395 H630"/>
    <path d="M970 395 H1110"/>
    <path d="M600 375 l30 20 -30 20"/>
    <path d="M1080 375 l30 20 -30 20"/>
  </g>
  <g transform="translate(250 580)">
    <path d="M80 90 H940 C1000 90 1040 110 1080 145 L1160 200 L1080 255 C1040 290 1000 310 940 310 H80 Z" fill="#3f5866" stroke="#403a35" stroke-width="9"/>
    <path d="M80 90 H430 V310 H80 Z" fill="#496977" opacity=".85"/>
    <path d="M455 90 H770 V310 H455 Z" fill="#b8cfce" opacity=".42"/>
    <path d="M800 90 H940 C1000 90 1040 110 1080 145 L1160 200 L1080 255 C1040 290 1000 310 940 310 H800 Z" fill="#334a58"/>
    <circle cx="175" cy="200" r="28" fill="#c95d4c" stroke="#403a35" stroke-width="7"/>
    <path d="M490 120 V280 M575 120 V280 M660 120 V280" stroke="#e5f1e9" stroke-width="8" opacity=".65"/>
    <text x="490" y="220" fill="#fff8ef" font-family="sans-serif" font-size="34" font-weight="700">reservoir / feed 边界</text>
  </g>
  <g fill="#403b36" font-family="sans-serif" font-size="30">
    <text x="190" y="795">Inkmaker 与 Colonel 需独立核对</text>
    <text x="790" y="795">战时广告是语境，不等于化学配方证明</text>
    <text x="1240" y="795">示意图，非产品照片</text>
  </g>
</svg>
