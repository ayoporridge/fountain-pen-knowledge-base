  <path d="M1305 480 L1428 462 L1482 480 L1428 498 Z" fill="#d8ba78" stroke="#f5df9f" stroke-width="4"/>
  <path d="M399 476 L420 515 M414 474 L435 513 M452 484 L471 520 M467 482 L486 518" stroke="#d4ae69" stroke-width="8"/>
