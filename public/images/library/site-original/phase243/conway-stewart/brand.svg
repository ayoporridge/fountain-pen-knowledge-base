  <text x="145" y="720" fill="#c8d4da" font-family="Arial,sans-serif" font-size="23">历史公司、现代复兴、钢笔与其他书写工具按来源分开</text>
  <text x="145" y="775" fill="#abb9c3" font-family="Arial,sans-serif" font-size="21">non-photo · non-logo · not-to-scale · non-colour-proof</text>
