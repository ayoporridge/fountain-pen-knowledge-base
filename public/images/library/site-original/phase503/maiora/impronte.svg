<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-factual-svg="true" data-product-photo="false" data-logo="false" data-to-scale="false" data-colour-proof="false">
  <title id="title">Maiora Impronte standard factual diagram</title>
  <desc id="desc">Editorial diagram for the standard-size Maiora Impronte route: resin body, three-start cap thread, steel nib choices and captured converter filling. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#f3eee8"/>
  <rect x="90" y="76" width="1420" height="748" rx="34" fill="#fffdfa" stroke="#aa9c8e" stroke-width="4"/>
  <text x="140" y="170" font-family="Georgia,serif" font-size="56" fill="#292624">Maiora Impronte</text>
  <text x="140" y="220" font-family="Arial,sans-serif" font-size="25" fill="#6d6762">standard route · hand-turned resin · #6 steel / JoWo samples · captured converter</text>
  <g transform="translate(150 326)">
    <path d="M80 140 C215 75 440 72 730 104 L1010 124 L1110 150 L1010 176 L730 196 C440 228 215 220 80 160 L30 150Z" fill="#dc7a45" stroke="#4b3430" stroke-width="9"/>
    <path d="M605 98 L646 202 M646 100 L687 198 M687 103 L728 194" stroke="#d1a04f" stroke-width="10"/>
    <path d="M1110 150 L1240 150" stroke="#4b3430" stroke-width="13" stroke-linecap="round"/>
