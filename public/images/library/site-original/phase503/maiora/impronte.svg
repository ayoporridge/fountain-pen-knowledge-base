    <text x="600" y="292" font-family="Arial,sans-serif" font-size="27" fill="#4b3430">three-start cap thread</text>
    <text x="1010" y="292" font-family="Arial,sans-serif" font-size="27" fill="#4b3430">steel nib</text>
  </g>
  <rect x="1190" y="560" width="240" height="92" rx="20" fill="#e8ded1" stroke="#9a8773" stroke-width="3"/>
  <text x="1220" y="616" font-family="Arial,sans-serif" font-size="24" fill="#292624">captured converter</text>
  <text x="140" y="780" font-family="Arial,sans-serif" font-size="22" fill="#6d6762">标准尺寸路线；颜色／饰面与 EF、F、M、B 尖幅属于版本层，不表示真实比例或颜色证明。</text>
