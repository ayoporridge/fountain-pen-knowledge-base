<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-factual-svg="true" data-product-photo="false" data-logo="false" data-to-scale="false" data-colour-proof="false">
  <title id="title">Maiora Impronte Oversize factual diagram</title>
  <desc id="desc">Editorial diagram for the larger-size Maiora Impronte Oversize route: wider resin barrel, concave grip, steel nib and captured converter filling. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#f1eee9"/>
  <rect x="90" y="76" width="1420" height="748" rx="34" fill="#fffdfa" stroke="#9fa9aa" stroke-width="4"/>
  <text x="140" y="170" font-family="Georgia,serif" font-size="56" fill="#292624">Maiora Impronte Oversize</text>
  <text x="140" y="220" font-family="Arial,sans-serif" font-size="25" fill="#657276">larger route · wider resin barrel · concave grip · #6 steel / JoWo samples</text>
  <g transform="translate(150 326)">
    <path d="M70 148 C215 62 435 58 730 94 L1010 122 L1110 150 L1010 178 L730 206 C435 242 215 232 70 168 L25 150Z" fill="#5f8795" stroke="#30434b" stroke-width="9"/>
    <path d="M605 88 L647 208 M647 91 L689 204 M689 94 L731 200" stroke="#d7b56e" stroke-width="12"/>
    <path d="M1110 150 L1240 150" stroke="#30434b" stroke-width="13" stroke-linecap="round"/>
    <text x="120" y="292" font-family="Arial,sans-serif" font-size="27" fill="#30434b">wider resin barrel</text>
    <text x="620" y="292" font-family="Arial,sans-serif" font-size="27" fill="#30434b">concave grip</text>
    <text x="1010" y="292" font-family="Arial,sans-serif" font-size="27" fill="#30434b">steel nib</text>
  </g>
  <rect x="1190" y="560" width="240" height="92" rx="20" fill="#e6edf0" stroke="#7f9299" stroke-width="3"/>
  <text x="1220" y="616" font-family="Arial,sans-serif" font-size="24" fill="#292624">captured converter</text>
  <text x="140" y="780" font-family="Arial,sans-serif" font-size="22" fill="#657276">Oversize 是独立尺寸路线；Posillipo、Capri、Mirror Black 等颜色／树脂版本须按样本核对。</text>
</svg>
