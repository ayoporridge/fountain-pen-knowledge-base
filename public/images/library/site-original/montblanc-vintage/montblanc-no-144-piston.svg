<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Montblanc No. 144 代际边界事实图，非产品照片</title><desc id="desc">图区分 1949 后战活塞 144 与后期 144 Classique，提醒不要共用规格或图片。</desc>
  <rect width="1200" height="630" fill="#f4efe6"/><text x="600" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#49382b">Montblanc No. 144：先分代，再谈规格</text><text x="600" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#806d5c">本站原创事实示意图，非产品照片</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="95" y="185" width="420" height="260" rx="22" fill="#433128"/><text x="305" y="245" fill="#fff8ef" font-size="29">早期 No. 144</text><text x="305" y="283" fill="#fff8ef" font-size="22">1949 后战活塞款</text><text x="305" y="328" fill="#f3ddba" font-size="20">celluloid · 内置活塞 · 旋帽</text><text x="305" y="367" fill="#f3ddba" font-size="18">每支旧笔以实物为准</text><rect x="685" y="185" width="420" height="260" rx="22" fill="#c5a26d"/><text x="895" y="245" fill="#2f241d" font-size="29">后期 144 Classique</text><text x="895" y="283" fill="#2f241d" font-size="22">另一代历史型号</text><text x="895" y="328" fill="#49382b" font-size="20">树脂 · 墨囊/转换器 · 扣帽</text><text x="895" y="367" fill="#49382b" font-size="18">不可回填给早期活塞款</text></g>
