<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Montblanc No. 22 身份边界事实图，非产品照片</title><desc id="desc">图区分 1960 年代 No. 22 活塞款、22P 与早期 22 数字体系，提醒不要混用。</desc>
  <rect width="1200" height="630" fill="#f4efe6"/><text x="600" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#49382b">Montblanc No. 22：数字相同，不代表同一支笔</text><text x="600" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#806d5c">本站原创事实示意图，非产品照片</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="205" width="320" height="215" rx="20" fill="#433128"/><text x="225" y="268" fill="#fff8ef" font-size="28">No. 22</text><text x="225" y="307" fill="#f3ddba" font-size="20">1960–1970 活塞款</text><text x="225" y="344" fill="#f3ddba" font-size="17">本页的资料主语</text><rect x="440" y="205" width="320" height="215" rx="20" fill="#c5a26d"/><text x="600" y="268" fill="#2f241d" font-size="28">22P</text><text x="600" y="307" fill="#49382b" font-size="20">卡水近亲</text><text x="600" y="344" fill="#49382b" font-size="17">不能套用活塞流程</text><rect x="815" y="205" width="320" height="215" rx="20" fill="#dcc8a1"/><text x="975" y="268" fill="#35291f" font-size="28">22½ / 222 / 224</text><text x="975" y="307" fill="#35291f" font-size="20">早期数字体系</text><text x="975" y="344" fill="#35291f" font-size="17">不并入 1960s No. 22</text></g>
  <text x="600" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#806d5c">“学生龙”是中文二手市场检索名，不是足以认证具体年份、版本或原装性的官方型号名。</text>
</svg>
