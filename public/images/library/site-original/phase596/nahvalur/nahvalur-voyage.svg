      <stop offset=".58" stop-color="#0c4854"/>
      <stop offset="1" stop-color="#193a5a"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0b86e"/>
      <stop offset="1" stop-color="#f2ddad"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .small{font-size:23px;fill:#c5d7dc}.label{font-size:27px;fill:#f5f7f2}.metric{font-size:35px;font-weight:760;fill:#fff}.pill{font-size:21px;font-weight:700;fill:#16303a}
    </style>
  </defs>
