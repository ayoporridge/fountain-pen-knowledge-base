<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nahvalur Voyage Hawaii 身份、活塞与不可后插事实图</title>
  <desc id="desc">本站原创示意图，非产品照片。用旅行路线、连续墨窗、活塞和不可后插标记说明 Voyage 与 Nautilus 的身份区别，以及 Hawaii 五个当前可售和一个 unavailable 尖幅。</desc>
