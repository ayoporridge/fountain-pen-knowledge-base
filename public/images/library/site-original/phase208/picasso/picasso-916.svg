  <title id="title">Picasso PS-916 Malaga factual diagram</title>
  <desc id="desc">Original editorial diagram showing the Picasso 916 identity, painted metal body, steel or iridium nib and cartridge/converter boundary. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="#fffaf2" stroke="#463d36" stroke-width="4"/>
