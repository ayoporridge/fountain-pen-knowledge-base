<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Faber-Castell product-line boundary</title>
  <desc id="desc">Editorial factual diagram, not a product photograph.</desc>
  <rect width="1600" height="900" fill="#f2eee6"/><rect x="64" y="64" width="1472" height="772" rx="36" fill="#fffaf1" stroke="#2c413d" stroke-width="4"/>
  <text x="120" y="150" fill="#243a37" font-family="sans-serif" font-size="54" font-weight="700">Faber-Castell</text>
  <text x="120" y="208" fill="#8d4e37" font-family="sans-serif" font-size="28">Fine Writing 与 Graf von Faber-Castell：导航边界</text>
  <rect x="120" y="290" width="610" height="380" rx="28" fill="#e1ebe4"/><rect x="870" y="290" width="610" height="380" rx="28" fill="#eee1d2"/>
  <text x="170" y="365" fill="#243a37" font-family="sans-serif" font-size="34" font-weight="700">普通 Fine Writing</text>
  <text x="170" y="425" fill="#243a37" font-family="sans-serif" font-size="29">Ambition · e-motion</text><text x="170" y="472" fill="#243a37" font-family="sans-serif" font-size="29">Ondoro · NEO Slim · LOOM</text><text x="170" y="518" fill="#243a37" font-family="sans-serif" font-size="25">钢尖 / 材料与 finish variant</text><text x="170" y="580" fill="#5e726b" font-family="sans-serif" font-size="22">系列不同，不能共享规格与照片</text>
  <text x="920" y="365" fill="#513c2c" font-family="sans-serif" font-size="34" font-weight="700">Graf von Faber-Castell</text><text x="920" y="425" fill="#513c2c" font-family="sans-serif" font-size="30">Classic</text><text x="920" y="472" fill="#513c2c" font-family="sans-serif" font-size="28">贵重木材 · platinum · sterling silver</text><text x="920" y="518" fill="#513c2c" font-family="sans-serif" font-size="25">手工双色 18K 尖 / converter</text><text x="920" y="580" fill="#846c55" font-family="sans-serif" font-size="22">独立高端品牌线</text>
  <text x="120" y="770" fill="#6c655c" font-family="sans-serif" font-size="22">本站原创 factual SVG；示意图，非产品照片，不表现真实比例、颜色、Logo 或刻字。</text>
</svg>
