<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">BENU series map</title><desc id="desc">Editorial factual diagram distinguishing BENU Briolette, Talisman and Euphoria.</desc><rect width="1600" height="900" fill="#17151f"/><text x="90" y="130" fill="#f7f0dc" font-family="sans-serif" font-size="58" font-weight="700">BENU</text><text x="92" y="188" fill="#c9bca8" font-family="sans-serif" font-size="27">series navigation · site-original factual SVG</text><g font-family="sans-serif" text-anchor="middle"><rect x="100" y="330" width="390" height="220" rx="32" fill="#4b2f86"/><text x="295" y="410" fill="white" font-size="38" font-weight="700">Briolette</text><text x="295" y="462" fill="#e8dcff" font-size="24">small faceted resin</text><text x="295" y="500" fill="#e8dcff" font-size="22">#5 · international</text><rect x="605" y="330" width="390" height="220" rx="32" fill="#9b4c71"/><text x="800" y="410" fill="white" font-size="38" font-weight="700">Talisman</text><text x="800" y="462" fill="#ffe2ea" font-size="24">larger resin family</text><text x="800" y="500" fill="#ffe2ea" font-size="22">True Unicorn = exclusive</text><rect x="1110" y="330" width="390" height="220" rx="32" fill="#236b65"/><text x="1305" y="410" fill="white" font-size="38" font-weight="700">Euphoria</text><text x="1305" y="462" fill="#d9fffb" font-size="24">separate collection</text><text x="1305" y="500" fill="#d9fffb" font-size="22">not a color alias</text></g><text x="100" y="760" fill="#c9bca8" font-family="sans-serif" font-size="25">BENU collections are not interchangeable; color names remain variants.</text></svg>
