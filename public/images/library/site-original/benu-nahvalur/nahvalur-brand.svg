<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Nahvalur Narwhal brand alias</title><desc id="desc">Editorial timeline and model navigation for Narwhal to Nahvalur.</desc><rect width="1600" height="900" fill="#10222b"/><text x="90" y="120" fill="#e9f8ed" font-family="sans-serif" font-size="55" font-weight="700">Nahvalur</text><text x="92" y="177" fill="#9ec6be" font-family="sans-serif" font-size="27">former name: Narwhal · one brand, not two</text><line x1="250" y1="405" x2="1350" y2="405" stroke="#80c9bd" stroke-width="10"/><circle cx="430" cy="405" r="30" fill="#f5c866"/><circle cx="1160" cy="405" r="30" fill="#f5c866"/><text x="430" y="350" fill="#f3ead8" font-family="sans-serif" font-size="31" text-anchor="middle">2019</text><text x="430" y="490" fill="#bde3d8" font-family="sans-serif" font-size="24" text-anchor="middle">Narwhal public launch</text><text x="1160" y="350" fill="#f3ead8" font-family="sans-serif" font-size="31" text-anchor="middle">2022-08-03</text><text x="1160" y="490" fill="#bde3d8" font-family="sans-serif" font-size="24" text-anchor="middle">official rename to Nahvalur</text><text x="430" y="690" fill="#f3ead8" font-family="sans-serif" font-size="31" text-anchor="middle">Original Plus</text><text x="1160" y="690" fill="#f3ead8" font-family="sans-serif" font-size="31" text-anchor="middle">Schuylkill</text><text x="800" y="800" fill="#9ec6be" font-family="sans-serif" font-size="23" text-anchor="middle">aliases and collections remain linked to the canonical brand</text></svg>
