<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">BENU Briolette structure card</title><desc id="desc">Editorial diagram of faceted resin, number five steel nib and international filling.</desc><rect width="1600" height="900" fill="#20182b"/><text x="90" y="120" fill="#fff4df" font-family="sans-serif" font-size="56" font-weight="700">BENU Briolette</text><text x="92" y="175" fill="#d5c6e8" font-family="sans-serif" font-size="26">small faceted resin · dimensions are reference values</text><path d="M280 470 L470 405 L1150 405 L1320 470 L1150 535 L470 535 Z" fill="#7d4fba" stroke="#f9d67b" stroke-width="8"/><path d="M470 405 L560 470 L470 535 M1150 405 L1050 470 L1150 535" fill="none" stroke="#f9d67b" stroke-width="6"/><circle cx="390" cy="470" r="25" fill="#f9d67b"/><text x="800" y="650" fill="#fff4df" font-family="sans-serif" font-size="32" text-anchor="middle">#5 Schmidt steel · F/M/B · international cartridge/converter</text><text x="800" y="710" fill="#d5c6e8" font-family="sans-serif" font-size="24" text-anchor="middle">≈ 13.8 cm capped · ≈ 19–20 g · cap generally not postable</text><text x="90" y="820" fill="#a994ba" font-family="sans-serif" font-size="22">site-original factual SVG · not a product photograph or scale drawing</text></svg>
