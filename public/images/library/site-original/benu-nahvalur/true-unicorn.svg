<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">BENU Talisman True Unicorn</title><desc id="desc">Editorial diagram distinguishing Gourmet Pens Exclusive Talisman resin from Briolette.</desc><rect width="1600" height="900" fill="#24162e"/><text x="90" y="120" fill="#fff3dd" font-family="sans-serif" font-size="52" font-weight="700">BENU Talisman · True Unicorn</text><text x="92" y="176" fill="#e1c8de" font-family="sans-serif" font-size="25">Gourmet Pens Exclusive · limited resin configuration</text><path d="M245 470 L420 390 L1200 390 L1370 470 L1200 550 L420 550 Z" fill="#a34f86" stroke="#f8d36e" stroke-width="8"/><g fill="#ffd56a"><circle cx="480" cy="440" r="9"/><circle cx="600" cy="505" r="12"/><circle cx="770" cy="430" r="8"/><circle cx="980" cy="500" r="11"/><circle cx="1140" cy="430" r="10"/></g><text x="800" y="660" fill="#fff3dd" font-family="sans-serif" font-size="31" text-anchor="middle">≈ 13.8 cm · ≈ 21 g · cap postable · #6 Schmidt</text><text x="800" y="720" fill="#e1c8de" font-family="sans-serif" font-size="24" text-anchor="middle">True Unicorn is a collaboration identity, not a Briolette color</text><text x="90" y="820" fill="#aa8aa7" font-family="sans-serif" font-size="22">site-original factual SVG · product imagery must credit the collaboration partner</text></svg>
