    <path d="M410 570 L500 655 L1070 655 L1160 570 Z" fill="#6f69a6"/>
    <path d="M1160 330 L1300 450 L1160 570" fill="#4f4a7f"/>
    <path d="M300 450 L190 450 L90 410 L90 490 L190 450" fill="#d8dce6"/>
