  <title id="title">BENU Talisman structure factual diagram</title>
  <desc id="desc">Non-photo, non-logo, not-to-scale, non-colour-proof editorial diagram. It shows a faceted resin body, a number six steel nib and international cartridge or converter filling.</desc>
