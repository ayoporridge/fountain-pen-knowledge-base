<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-factual-svg="true" data-product-photo="false" data-logo="false" data-to-scale="false" data-colour-proof="false">
  <title id="title">Kanwrite Desire factual diagram</title>
  <desc id="desc">Editorial diagram of the Kanwrite Desire resin body, screw cap, #6 interchangeable nib and three documented filling paths. This is not a product photograph and is not to scale.</desc>
  <rect width="1600" height="900" fill="#f6f1e8"/>
  <rect x="80" y="80" width="1440" height="740" rx="34" fill="#fffdf8" stroke="#b8a78e" stroke-width="4"/>
  <text x="140" y="170" font-family="Georgia,serif" font-size="54" fill="#2d2924">Kanwrite Desire</text>
  <text x="140" y="220" font-family="Arial,sans-serif" font-size="25" fill="#6a5d4d">resin body · screw cap · #6 interchangeable nib · three filling routes</text>
  <g transform="translate(170 330)">
    <path d="M80 80 H830 L980 125 L830 170 H80 Q30 170 30 125 Q30 80 80 80Z" fill="#8b6f9c" stroke="#433751" stroke-width="8"/>
    <path d="M830 80 L1030 125 L830 170Z" fill="#d2b789" stroke="#433751" stroke-width="8"/>
    <path d="M1030 125 L1140 92 L1175 125 L1140 158Z" fill="#d8dde0" stroke="#433751" stroke-width="8"/>
    <path d="M1180 125 L1270 125" stroke="#433751" stroke-width="12" stroke-linecap="round"/>
    <text x="110" y="250" font-family="Arial,sans-serif" font-size="28" fill="#433751">resin barrel + grip</text>
    <text x="770" y="250" font-family="Arial,sans-serif" font-size="28" fill="#433751">#6 nib unit</text>
    <text x="1130" y="250" font-family="Arial,sans-serif" font-size="28" fill="#433751">feed / tip</text>
  </g>
  <g transform="translate(180 650)" font-family="Arial,sans-serif" font-size="28" fill="#2d2924">
    <rect x="0" y="0" width="350" height="78" rx="18" fill="#eadbbd" stroke="#a88b58" stroke-width="3"/>
    <rect x="390" y="0" width="350" height="78" rx="18" fill="#eadbbd" stroke="#a88b58" stroke-width="3"/>
    <rect x="780" y="0" width="350" height="78" rx="18" fill="#eadbbd" stroke="#a88b58" stroke-width="3"/>
    <text x="62" y="49">cartridge</text>
    <text x="478" y="49">converter</text>
    <text x="855" y="49">eyedropper*</text>
  </g>
  <text x="140" y="790" font-family="Arial,sans-serif" font-size="22" fill="#6a5d4d">*滴入前需确认螺纹清洁、密封与批次边界；示意图不表示真实比例或颜色。</text>
</svg>
