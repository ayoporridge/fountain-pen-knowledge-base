<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pilot Capless LS 事实卡</title>
  <desc id="desc">FCLS-35SR、knock and twist、18K 尖与 41.3 g；示意图，非产品照片。</desc>
  <rect width="1600" height="900" fill="#eef0f4"/><rect x="70" y="70" width="1460" height="760" rx="36" fill="#fff" stroke="#303a4d" stroke-width="4"/>
  <text x="120" y="170" font-family="Arial,sans-serif" font-size="56" font-weight="700" fill="#303a4d">CAPLESS LS</text>
  <text x="122" y="225" font-family="Arial,sans-serif" font-size="28" fill="#687287">Luxury &amp; Silent · FCLS-35SR</text>
  <rect x="180" y="350" width="880" height="66" rx="33" fill="#313a48"/><rect x="1010" y="341" width="62" height="84" rx="20" fill="#a7b1be"/><circle cx="1110" cy="383" r="17" fill="#c8a55d"/>
  <text x="180" y="500" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#303a4d">knock &amp; twist</text><text x="180" y="545" font-family="Arial,sans-serif" font-size="26" fill="#687287">按下出尖 · 尾部旋钮收尖 · 18K F/M</text><text x="180" y="590" font-family="Arial,sans-serif" font-size="26" fill="#687287">约 145 mm · 13.6 mm · 41.3 g</text>
