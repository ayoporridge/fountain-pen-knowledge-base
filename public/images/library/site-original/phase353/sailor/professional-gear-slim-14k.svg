  <text x="130" y="202" fill="#68727a" font-family="Arial, sans-serif" font-size="23">11-1221 Gold Trim · 11-1222 Rhodium Trim · factual editorial diagram</text>

  <g transform="translate(150 300)">
    <text x="0" y="-42" fill="#28323a" font-family="Arial, sans-serif" font-size="24" font-weight="700">共享平台（示意）</text>
    <path d="M70 0 H760 C790 0 810 18 810 45 V77 C810 104 790 122 760 122 H70 C40 122 20 104 20 77 V45 C20 18 40 0 70 0Z" fill="#9fa9af" stroke="#28323a" stroke-width="5"/>
    <path d="M760 0 H850 C878 0 900 20 900 45 V77 C900 102 878 122 850 122 H760Z" fill="#d1d6d9" stroke="#28323a" stroke-width="5"/>
    <path d="M20 45 H900" stroke="#e9edf0" stroke-width="5" opacity="0.8"/>
    <path d="M225 0 V122 M675 0 V122" stroke="#28323a" stroke-width="3" opacity="0.45"/>
