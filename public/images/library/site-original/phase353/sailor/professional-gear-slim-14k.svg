    <text x="35" y="94" fill="#75451e" font-family="Arial, sans-serif" font-size="23">Gold Trim</text>
    <text x="35" y="127" fill="#75451e" font-family="Arial, sans-serif" font-size="18">EF/F/MF/M/B/Z/MS</text>
    <rect x="0" y="190" width="290" height="150" rx="22" fill="#e5e7e8" stroke="#69747b" stroke-width="4"/>
    <text x="35" y="243" fill="#28323a" font-family="Arial, sans-serif" font-size="28" font-weight="700">11-1222</text>
    <text x="35" y="284" fill="#28323a" font-family="Arial, sans-serif" font-size="23">Rhodium Trim</text>
    <text x="35" y="317" fill="#28323a" font-family="Arial, sans-serif" font-size="18">EF/F/MF/M/B/Z/MS</text>
