    <line x1="20" y1="220" x2="900" y2="220" stroke="#a26b45" stroke-width="3"/>
    <line x1="20" y1="208" x2="20" y2="232" stroke="#a26b45" stroke-width="3"/>
    <line x1="900" y1="208" x2="900" y2="232" stroke="#a26b45" stroke-width="3"/>
    <text x="337" y="260" fill="#a26b45" font-family="Arial, sans-serif" font-size="26" font-weight="700">φ17 × 124 mm（含笔夹）</text>
  </g>

  <g transform="translate(1160 285)">
