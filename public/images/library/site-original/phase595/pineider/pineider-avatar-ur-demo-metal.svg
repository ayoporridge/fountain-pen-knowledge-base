<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Avatar UR Demo Metal 钢笔事实示意图</title>
  <desc id="desc">本站原创事实示意图，非产品照片。用带观察窗的通用钢笔轮廓和四项中文要点介绍两个饰件版本、透明 UltraResin、钢笔尖与墨囊上墨器；图形、配色和比例不代表实物。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f1f2"/>
      <stop offset="1" stop-color="#d5e5e7"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8790" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#386f79" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#275964" flood-opacity="0.2"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .fact-title { font-size: 24px; font-weight: 750; fill: #194957; }
      .fact-copy { font-size: 20px; fill: #55727b; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 0H1600V190C1260 135 1040 224 780 172C470 110 250 209 0 154Z" fill="#174c58"/>
  <g class="text">
    <text x="90" y="80" font-size="24" letter-spacing="4" fill="#b9d7dc">可观察墨量的钢笔</text>
    <text x="90" y="142" font-size="49" font-weight="780" fill="#f7feff">Avatar UR Demo Metal</text>
    <text x="92" y="182" font-size="23" fill="#c9e0e4">PP3401／608 与 PP3901／611</text>

    <g transform="translate(90 270)" filter="url(#shadow)" aria-label="带透明观察窗的通用钢笔轮廓">
      <rect width="820" height="380" rx="38" fill="#fbfefe"/>
      <text x="38" y="58" font-size="21" fill="#617f86">透明笔杆能看见上墨器与墨量</text>
      <g transform="translate(48 116)">
        <path d="M14 31Q14 8 48 8H292Q326 8 343 31V119Q326 142 292 142H48Q14 142 14 119Z" fill="#275b65"/>
        <rect x="330" y="27" width="310" height="96" rx="48" fill="url(#window)" stroke="#6d9da5" stroke-width="4"/>
        <rect x="382" y="48" width="185" height="54" rx="25" fill="#d9eaeb" stroke="#809fa4" stroke-width="3"/>
        <rect x="616" y="39" width="70" height="72" rx="26" fill="#bbc8ca"/>
        <path d="M678 40L744 75L678 110Q654 75 678 40Z" fill="#e4e9e9" stroke="#6e7b7d" stroke-width="4"/>
        <path d="M691 75H730" stroke="#6e7b7d" stroke-width="3"/>
        <path d="M14 166H740" stroke="#a4babd" stroke-width="3"/>
        <text x="377" y="202" text-anchor="middle" font-size="18" fill="#71888d">观察窗与上墨器仅为结构提示</text>
      </g>
    </g>

    <g transform="translate(970 270)">
      <g data-reader-fact="1">
        <rect width="540" height="96" rx="22" fill="#fbfefe" stroke="#a9c5ca" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#347785"/><text x="80" y="43" class="fact-title">两个饰件版本</text>
        <text x="80" y="73" class="fact-copy">608 为普通金属件，611 为 Black</text>
      </g>
      <g transform="translate(0 116)" data-reader-fact="2">
        <rect width="540" height="96" rx="22" fill="#fbfefe" stroke="#a9c5ca" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#347785"/><text x="80" y="43" class="fact-title">透明 UltraResin</text>
        <text x="80" y="73" class="fact-copy">可以观察内部机构与剩余墨量</text>
      </g>
      <g transform="translate(0 232)" data-reader-fact="3">
        <rect width="540" height="96" rx="22" fill="#fbfefe" stroke="#cdb699" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#a6774d"/><text x="80" y="43" class="fact-title">不锈钢笔尖</text>
        <text x="80" y="73" class="fact-copy">EF、F、M 三种标称尖幅</text>
      </g>
      <g transform="translate(0 348)" data-reader-fact="4">
        <rect width="540" height="96" rx="22" fill="#fbfefe" stroke="#cdb699" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#a6774d"/><text x="80" y="43" class="fact-title">墨囊／上墨器</text>
        <text x="80" y="73" class="fact-copy">搭配 Magnetic Lock 磁吸笔帽</text>
      </g>
    </g>

    <rect x="90" y="766" width="1420" height="80" rx="25" fill="#174c58"/>
    <text x="800" y="800" text-anchor="middle" font-size="23" font-weight="700" fill="#f2fcfd">本站原创事实示意图，非产品照片</text>
    <text x="800" y="829" text-anchor="middle" font-size="18" fill="#c2dce0">未复制品牌 logo；轮廓、颜色、透明度与比例不代表实物</text>
  </g>
</svg>
