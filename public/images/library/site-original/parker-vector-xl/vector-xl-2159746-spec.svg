<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Parker Vector XL Teal 2159746 规格卡</title>
  <desc id="desc">原创事实图，以文字卡呈现 2159746 的尖号、尺寸、重量和上墨边界，不绘制产品。</desc>
  <rect width="1600" height="900" fill="#eef5f2"/>
  <rect x="80" y="80" width="1440" height="740" rx="28" fill="#ffffff" stroke="#275c56" stroke-width="4"/>
  <text x="130" y="155" fill="#275c56" font-family="sans-serif" font-size="42" font-weight="700">Vector XL · Teal 2159746</text>
  <text x="130" y="202" fill="#586b68" font-family="sans-serif" font-size="24">Parker 2022 / 2024 catalogue window · factual SVG · 示意图，非产品照片</text>
  <g font-family="sans-serif" fill="#203b3a">
    <rect x="130" y="260" width="400" height="180" rx="18" fill="#dceee8"/>
    <text x="170" y="325" font-size="28">尖号</text>
    <text x="170" y="385" font-size="44" font-weight="700">M · stainless steel</text>
    <rect x="600" y="260" width="400" height="180" rx="18" fill="#eaf1f0"/>
    <text x="640" y="325" font-size="28">长度</text>
    <text x="640" y="380" font-size="40" font-weight="700">135 mm closed</text>
    <text x="640" y="420" font-size="40" font-weight="700">157 mm posted</text>
    <rect x="1070" y="260" width="370" height="180" rx="18" fill="#f3eadb"/>
    <text x="1110" y="325" font-size="28">尺寸 / 重量</text>
    <text x="1110" y="385" font-size="40" font-weight="700">Ø 11.5 mm</text>
    <text x="1110" y="425" font-size="40" font-weight="700">20 g</text>
    <rect x="130" y="510" width="1310" height="150" rx="18" fill="#f8f2e7" stroke="#b28d5a" stroke-width="3"/>
    <text x="175" y="570" font-size="30" font-weight="700">上墨</text>
    <text x="175" y="620" font-size="28">Parker 墨囊；可用 Parker converter，但 2159746 资料注明需另购。</text>
    <text x="130" y="735" font-size="24" fill="#586b68">所有尺寸与 20 g 仅绑定 SKU 2159746；其他 finish / F 尖另按 SKU 核对。</text>
    <text x="130" y="775" font-size="22" fill="#586b68">不复制官方摄影，不表现 Teal 色差、笔夹、刻字、比例或制造地。</text>
  </g>
</svg>
