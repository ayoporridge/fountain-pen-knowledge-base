  <g font-family="sans-serif" fill="#294354">
    <text x="180" y="670" font-size="28" font-weight="700">Transparent PMMA · φ18×141 mm · ≈21.6 g</text>
    <text x="180" y="710" font-size="23" fill="#657783">目录/经销商参考；图形不按比例</text>
    <text x="1010" y="320" font-size="28" font-weight="700">21K gold + rhodium plating</text>
    <text x="1010" y="360" font-size="23" fill="#657783">EF · F · MF · M · B · Z · MS</text>
    <text x="1010" y="520" font-size="28" font-weight="700">Sailor C/C filling</text>
    <text x="1010" y="560" font-size="23" fill="#657783">可观察墨水，不等于活塞系统</text>
    <text x="180" y="785" font-size="21" fill="#6c7b84">NON-PHOTO · NON-LOGO · NOT-TO-SCALE · NON-COLOUR-PROOF</text>
  </g>
  <g stroke="#8299a8" stroke-width="4" fill="none"><path d="M915 355 H1000"/><path d="M940 535 H1000"/></g>
