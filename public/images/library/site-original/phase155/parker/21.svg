<title id="title">Parker 21 Mark I 与 Mark II 示意图</title><desc id="desc">1948 大众型号、Mark I/II 尖座差异、合金尖和 Parker 上墨器；非产品照片。</desc>
<rect width="1600" height="900" fill="#f5f1e8"/><text x="100" y="105" font-family="sans-serif" font-size="50" font-weight="700" fill="#1e293b">PARKER “21” · MARK BOUNDARY</text><text x="100" y="155" font-family="sans-serif" font-size="24" fill="#475569">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text>
<g font-family="sans-serif"><rect x="110" y="245" width="360" height="280" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="150" y="320" font-size="40" font-weight="700" fill="#1e3a8a">1948</text><text x="150" y="375" font-size="30" fill="#1e293b">大众路线</text><text x="150" y="425" font-size="23" fill="#334155">51 设计语境</text><text x="150" y="470" font-size="23" fill="#334155">合金尖 · Parker 上墨器</text><rect x="600" y="205" width="390" height="200" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="640" y="275" font-size="32" font-weight="700" fill="#92400e">Mark I</text><text x="640" y="325" font-size="23" fill="#334155">尖／笔舌压配在连接件</text><text x="640" y="365" font-size="23" fill="#334155">外壳与尖有明显间隙</text><rect x="600" y="470" width="390" height="200" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="640" y="540" font-size="32" font-weight="700" fill="#166534">Mark II</text><text x="640" y="590" font-size="23" fill="#334155">重新设计尖座与外壳</text><text x="640" y="630" font-size="23" fill="#334155">不能只靠笔帽判定</text><rect x="1120" y="275" width="370" height="280" rx="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="1160" y="345" font-size="31" font-weight="700" fill="#3730a3">鉴定线索</text><text x="1160" y="400" font-size="23" fill="#334155">尖座 · 日期刻字</text><text x="1160" y="440" font-size="23" fill="#334155">夹子 · 帽内衬</text><text x="1160" y="480" font-size="23" fill="#334155">颜色不能单独定版</text><path d="M470 390h120M990 305h120M990 570h120" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
