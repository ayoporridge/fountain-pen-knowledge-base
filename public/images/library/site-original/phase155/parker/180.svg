<g font-family="sans-serif"><rect x="110" y="260" width="380" height="260" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="150" y="335" font-size="40" font-weight="700" fill="#1e3a8a">1970s</text><text x="150" y="390" font-size="30" fill="#1e293b">细长笔身</text><text x="150" y="440" font-size="23" fill="#334155">太空时代棱角设计</text><text x="150" y="480" font-size="23" fill="#334155">细内径，转换器需核对</text><rect x="610" y="210" width="400" height="190" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="650" y="280" font-size="31" font-weight="700" fill="#166534">扁平双面尖</text><text x="650" y="330" font-size="23" fill="#334155">正写细线 · 反写较宽</text><text x="650" y="370" font-size="23" fill="#334155">不是后配磨尖的证明</text><rect x="610" y="470" width="400" height="170" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="650" y="535" font-size="30" font-weight="700" fill="#92400e">Parker 上墨器</text><text x="650" y="585" font-size="23" fill="#334155">墨囊／转换器接口</text><text x="650" y="620" font-size="23" fill="#334155">早期细身转换器需确认</text><rect x="1140" y="290" width="350" height="270" rx="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="1180" y="360" font-size="31" font-weight="700" fill="#3730a3">边界</text><text x="1180" y="415" font-size="23" fill="#334155">finish ≠ 尖材</text><text x="1180" y="455" font-size="23" fill="#334155">转换器可装 ≠ 零件通用</text><text x="1180" y="495" font-size="23" fill="#334155">逐支看刻字与尖面</text><path d="M490 390h110M490 445h110M1010 300h120M1010 555h120" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
