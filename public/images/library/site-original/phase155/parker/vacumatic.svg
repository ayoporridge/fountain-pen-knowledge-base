<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Parker Vacumatic 机构与年代示意图</title><desc id="desc">Golden Arrow 到 Vacumatic 的命名演变、Lockdown/Speedline/塑料柱塞、日期编码和条纹版本；非产品照片。</desc>
<rect width="1600" height="900" fill="#f5f1e8"/><text x="100" y="105" font-family="sans-serif" font-size="50" font-weight="700" fill="#1e293b">PARKER VACUMATIC · FILLER MAP</text><text x="100" y="155" font-family="sans-serif" font-size="24" fill="#475569">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text>
<g font-family="sans-serif"><rect x="100" y="250" width="330" height="250" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="140" y="325" font-size="34" font-weight="700" fill="#1e3a8a">1932–33</text><text x="140" y="375" font-size="28" fill="#1e293b">Golden Arrow</text><text x="140" y="425" font-size="23" fill="#334155">Vacuum Filler</text><text x="140" y="465" font-size="23" fill="#334155">名称与机构过渡</text><rect x="520" y="205" width="340" height="180" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="560" y="275" font-size="30" font-weight="700" fill="#92400e">Lockdown</text><text x="560" y="325" font-size="23" fill="#334155">旋出盲帽 · 橡胶隔膜</text><text x="560" y="360" font-size="23" fill="#334155">早期条纹与尺寸线</text><rect x="520" y="450" width="340" height="180" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="560" y="520" font-size="30" font-weight="700" fill="#166534">Speedline / 塑料</text><text x="560" y="570" font-size="23" fill="#334155">1937 后重设计</text><text x="560" y="605" font-size="23" fill="#334155">1942 过渡机构</text><rect x="970" y="230" width="460" height="320" rx="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="1010" y="300" font-size="31" font-weight="700" fill="#3730a3">年代与版本</text><text x="1010" y="355" font-size="23" fill="#334155">日期码：季度＋年份末位</text><text x="1010" y="395" font-size="23" fill="#334155">1938 后圆点系统</text><text x="1010" y="435" font-size="23" fill="#334155">透明条纹／Shadow Wave</text><text x="1010" y="475" font-size="23" fill="#334155">尺寸与加拿大生产分支</text><path d="M430 370h80M430 430h80M860 300h100M860 540h100" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
</svg>
