    <rect x="470" y="470" width="294" height="112" rx="16" fill="#e9e1d7" stroke="#806853" stroke-width="3"/>
    <text x="496" y="514" font-size="22" font-weight="700">aluminum sample</text><text x="496" y="548" font-size="20">42.2 g capped</text><text x="496" y="574" font-size="20">24.7 g uncapped</text>
