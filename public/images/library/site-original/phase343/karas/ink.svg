    <text x="716" y="174" fill="#29343a" font-family="Arial, sans-serif" font-size="19">Sta-Fast o-ring</text>
    <text x="888" y="174" fill="#29343a" font-family="Arial, sans-serif" font-size="19">Bock nib</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#29343a">
