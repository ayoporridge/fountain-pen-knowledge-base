<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" factual-svg="true" product-photo="false" logo="false" to-scale="false" colour-proof="false">
  <title id="title">Karas Pen Co INK Fountain Pen facts</title>
  <desc id="desc">Editorial factual diagram showing triple-start cap, Bock nib, K5 converter, materials and official dimensions.</desc>
  <rect width="1200" height="720" fill="#edf1f3"/>
  <rect x="48" y="48" width="1104" height="624" rx="32" fill="#fffefa" stroke="#29343a" stroke-width="4"/>
  <text x="90" y="122" fill="#29343a" font-family="Arial, sans-serif" font-size="44" font-weight="700">INK FOUNTAIN PEN</text>
  <text x="92" y="164" fill="#6e7b82" font-family="Arial, sans-serif" font-size="21">2024 relaunch · Kustoms Line · made in Mesa, Arizona</text>
  <g transform="translate(112 242)">
    <rect x="30" y="48" width="690" height="78" rx="39" fill="#87959b" stroke="#29343a" stroke-width="4"/>
    <rect x="720" y="38" width="128" height="98" rx="20" fill="#526f80" stroke="#29343a" stroke-width="4"/>
