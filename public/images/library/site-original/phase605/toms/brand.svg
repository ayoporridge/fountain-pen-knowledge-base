<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Tom's Studio 品牌事实导航</title><desc id="desc">英国创意工具品牌从手工书法笔到可换尖钢笔系统的原创导航。</desc><rect width="1600" height="900" fill="#202825"/><rect x="970" y="90" width="470" height="680" rx="60" fill="#d3a85e" transform="rotate(8 1205 430)"/><rect x="1030" y="150" width="350" height="560" rx="45" fill="#efe5cc" transform="rotate(8 1205 430)"/>
  <text x="105" y="155" fill="#efc878" font-family="sans-serif" font-size="30">DORSET · CREATIVE TOOLS</text><text x="105" y="270" fill="#fff" font-family="serif" font-size="92" font-weight="700">Tom's Studio</text><text x="105" y="350" fill="#d6dfda" font-family="sans-serif" font-size="30">手工书法笔 → 钢笔 → 可换尖系统</text><g font-family="sans-serif"><rect x="105" y="440" width="730" height="90" rx="22" fill="#37433f"/><text x="145" y="497" fill="#fff" font-size="28">独立品牌，不是 Lamy Studio</text><rect x="105" y="560" width="730" height="90" rx="22" fill="#37433f"/><text x="145" y="617" fill="#fff" font-size="28">全尺寸 Studio 与 Pocket V2 分开</text></g><text x="105" y="815" fill="#9eb1a8" font-family="sans-serif" font-size="22">本站原创事实图 · 非产品照片、Logo 或比例图</text></svg>
