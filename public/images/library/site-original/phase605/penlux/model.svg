<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PENLUX Masterpiece Grande Deep Sea 规格事实图</title><desc id="desc">显示尺寸、重量、活塞墨量和笔尖边界的原创规格卡，不描绘产品外形。</desc><rect width="1600" height="900" fill="#071f38"/><path d="M0 690Q260 560 530 700t530 0t540-40v240H0z" fill="#0d4567"/><path d="M0 755Q290 650 555 755t520 0t525-35" fill="none" stroke="#46b4c8" stroke-width="7"/>
  <text x="105" y="145" fill="#72d9e8" font-family="sans-serif" font-size="30">MASTERPIECE GRANDE · DEEP SEA</text><text x="105" y="245" fill="#fff" font-family="serif" font-size="74" font-weight="700">全尺寸活塞笔的 exact scope</text>
  <g font-family="sans-serif" text-anchor="middle"><circle cx="270" cy="465" r="120" fill="#123a5b" stroke="#4fd5e7" stroke-width="5"/><text x="270" y="455" fill="#fff" font-size="54">149 mm</text><text x="270" y="505" fill="#a8e8ef" font-size="24">长度</text><circle cx="625" cy="465" r="120" fill="#123a5b" stroke="#4fd5e7" stroke-width="5"/><text x="625" y="455" fill="#fff" font-size="54">33 g</text><text x="625" y="505" fill="#a8e8ef" font-size="24">整笔标称</text><circle cx="980" cy="465" r="120" fill="#123a5b" stroke="#4fd5e7" stroke-width="5"/><text x="980" y="455" fill="#fff" font-size="54">1.5 ml</text><text x="980" y="505" fill="#a8e8ef" font-size="24">活塞墨量</text><circle cx="1335" cy="465" r="120" fill="#123a5b" stroke="#4fd5e7" stroke-width="5"/><text x="1335" y="455" fill="#fff" font-size="48">JoWo #6</text><text x="1335" y="505" fill="#a8e8ef" font-size="24">钢尖为标准配置</text></g><text x="105" y="825" fill="#83b4c6" font-family="sans-serif" font-size="22">金尖选项按订单确认 · 兄弟配色不继承 Deep Sea 规格</text>
