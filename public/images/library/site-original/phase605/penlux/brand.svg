  <g transform="translate(940 315)" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="555" height="100" rx="20" fill="#173f46" stroke="#3d7d77" stroke-width="2"/>
    <text x="30" y="40" fill="#ffffff" font-size="25" font-weight="700">01　台湾书写工具制造背景</text>
    <text x="30" y="74" fill="#b8d9d4" font-size="20">官网称主要生产环节在台湾进行</text>
    <rect y="120" width="555" height="100" rx="20" fill="#173f46" stroke="#3d7d77" stroke-width="2"/>
    <text x="30" y="160" fill="#ffffff" font-size="25" font-weight="700">02　两个阶段要分开看</text>
    <text x="30" y="194" fill="#b8d9d4" font-size="20">1999 制造业务 · 2015 起自有品牌产品</text>
    <rect y="240" width="555" height="100" rx="20" fill="#173f46" stroke="#3d7d77" stroke-width="2"/>
    <text x="30" y="280" fill="#ffffff" font-size="25" font-weight="700">03　自研活塞模组</text>
    <text x="30" y="314" fill="#b8d9d4" font-size="20">官网表述为用于“多数”PENLUX 钢笔</text>
    <rect y="360" width="555" height="100" rx="20" fill="#173f46" stroke="#3d7d77" stroke-width="2"/>
    <text x="30" y="400" fill="#ffffff" font-size="25" font-weight="700">04　具体配置回到型号页</text>
