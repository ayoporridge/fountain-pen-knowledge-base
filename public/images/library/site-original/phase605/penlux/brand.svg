<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-license="site-original" data-kind="factual-svg">
  <title id="title">PENLUX：台湾制造背景与活塞笔路线</title>
  <desc id="desc">用钢笔轮廓和四条中文事实介绍 PENLUX 的制造背景、自有品牌阶段与活塞系统。本站原创事实示意图，非产品照片；不还原商标、真实颜色或精确比例。</desc>
  <rect width="1600" height="900" fill="#0d2930"/>
  <circle cx="1390" cy="120" r="260" fill="#17454d"/>
  <circle cx="1440" cy="750" r="330" fill="#0f343b"/>
