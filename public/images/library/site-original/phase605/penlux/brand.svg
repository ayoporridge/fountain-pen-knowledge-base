    <path d="M675 52 H720 Q765 52 792 85 L760 151 Q744 178 700 178 H675Z" fill="#9acfc6"/>
    <path d="M128 42 V12 Q128 0 145 0 H520 Q540 0 540 18 V42" fill="none" stroke="#f2c97d" stroke-width="9" stroke-linecap="round"/>
    <path d="M545 116 H650" stroke="#0d2930" stroke-width="7" stroke-linecap="round"/>
    <circle cx="622" cy="116" r="18" fill="none" stroke="#0d2930" stroke-width="6"/>
