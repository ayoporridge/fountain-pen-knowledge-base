    <text x="100" y="190" fill="#ffffff" font-size="76" font-weight="750">PENLUX</text>
    <text x="100" y="238" fill="#c9e8e2" font-size="30">台湾制造背景与活塞笔路线</text>
    <text x="100" y="276" fill="#7fb3ad" font-size="20">品牌名称仅作文字标题，不还原商标</text>
  </g>
