<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Radius Settimo Matte Black 规格图</title><desc id="desc">Settimo哑光黑复兴款的钢尖、转换器、尺寸和版本边界。</desc><rect width="1600" height="900" fill="#141516"/><path d="M1050 0l550 0v900H720z" fill="#292c2d"/><text x="100" y="150" fill="#cbbf9e" font-family="sans-serif" font-size="28">SETTIMO · NERO OPACO</text><text x="100" y="260" fill="#fff" font-family="serif" font-size="76" font-weight="700">钢尖 C/C，不是 Superior</text>
  <g font-family="sans-serif"><rect x="100" y="380" width="330" height="210" rx="26" fill="#363a3b"/><text x="265" y="460" fill="#fff" text-anchor="middle" font-size="48">143 mm</text><text x="265" y="520" fill="#bbbda9" text-anchor="middle" font-size="23">收合</text><rect x="470" y="380" width="330" height="210" rx="26" fill="#363a3b"/><text x="635" y="460" fill="#fff" text-anchor="middle" font-size="48">27.5 g</text><text x="635" y="520" fill="#bbbda9" text-anchor="middle" font-size="23">整笔标称</text><rect x="840" y="380" width="330" height="210" rx="26" fill="#363a3b"/><text x="1005" y="460" fill="#fff" text-anchor="middle" font-size="44">STEEL</text><text x="1005" y="520" fill="#bbbda9" text-anchor="middle" font-size="23">EF–Stub / Flex选项</text><rect x="1210" y="380" width="300" height="210" rx="26" fill="#363a3b"/><text x="1360" y="460" fill="#fff" text-anchor="middle" font-size="37">cartridge</text><text x="1360" y="505" fill="#fff" text-anchor="middle" font-size="37">converter</text></g><text x="100" y="805" fill="#979a8c" font-family="sans-serif" font-size="22">1930年代视觉引用 ≠ 1930年代制造 · Matte / Glossy 为表面兄弟版本</text></svg>
