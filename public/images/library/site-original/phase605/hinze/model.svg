<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hinze Elementar 型号边界图</title><desc id="desc">Elementar基础形制的近似尺寸、帽螺纹和逐单配置边界。</desc><rect width="1600" height="900" fill="#1e2525"/><path d="M0 700l350-280 260 160 330-350 660 510v160H0z" fill="#3b5350"/><text x="100" y="140" fill="#9fd1be" font-family="sans-serif" font-size="28">ELEMENTAR · BASE CUSTOM FORM</text><text x="100" y="255" fill="#fff" font-family="serif" font-size="80" font-weight="700">基础轮廓，不是固定配色 SKU</text>
  <g font-family="sans-serif" text-anchor="middle"><circle cx="300" cy="485" r="130" fill="#e6eee8"/><text x="300" y="470" fill="#263d39" font-size="48">&gt; 5.5 in</text><text x="300" y="520" fill="#536e68" font-size="23">收合，官网近似</text><circle cx="680" cy="485" r="130" fill="#e6eee8"/><text x="680" y="470" fill="#263d39" font-size="48">0.582 in</text><text x="680" y="520" fill="#536e68" font-size="23">最宽约值</text><circle cx="1060" cy="485" r="130" fill="#e6eee8"/><text x="1060" y="470" fill="#263d39" font-size="48">13 mm</text><text x="1060" y="520" fill="#536e68" font-size="23">帽螺纹</text><circle cx="1410" cy="485" r="130" fill="#e6eee8"/><text x="1410" y="460" fill="#263d39" font-size="38">per order</text><text x="1410" y="510" fill="#536e68" font-size="23">尖／供墨／材料</text></g><text x="100" y="815" fill="#91aaa3" font-family="sans-serif" font-size="22">样本 #6 JoWo 或转换器配置不扩展到所有定制订单</text></svg>
