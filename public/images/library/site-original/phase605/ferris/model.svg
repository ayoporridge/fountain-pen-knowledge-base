<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Carousel Feathered Flight 规格事实图</title><desc id="desc">普通改良 acrylic Carousel 的笔帽、笔尖、尺寸和供墨边界。</desc><rect width="1600" height="900" fill="#163447"/><path d="M0 0h1600v220L0 500z" fill="#285a72"/><text x="100" y="140" fill="#b9edf3" font-family="sans-serif" font-size="28">CAROUSEL · FEATHERED FLIGHT</text><text x="100" y="280" fill="#fff" font-family="serif" font-size="76" font-weight="700">轻量 acrylic，不是 Aluminum Carousel</text>
  <g font-family="sans-serif"><rect x="100" y="390" width="320" height="220" rx="30" fill="#e9f4ef"/><text x="260" y="470" fill="#17394a" text-anchor="middle" font-size="44">128 mm</text><text x="260" y="525" fill="#466878" text-anchor="middle" font-size="24">收合尺寸</text><rect x="460" y="390" width="320" height="220" rx="30" fill="#e9f4ef"/><text x="620" y="470" fill="#17394a" text-anchor="middle" font-size="42">0.7 / 1.0</text><text x="620" y="525" fill="#466878" text-anchor="middle" font-size="24">F／M 钢尖 mm 标称</text><rect x="820" y="390" width="320" height="220" rx="30" fill="#e9f4ef"/><text x="980" y="470" fill="#17394a" text-anchor="middle" font-size="38">click-lock</text><text x="980" y="525" fill="#466878" text-anchor="middle" font-size="24">air-sealed 笔帽</text><rect x="1180" y="390" width="320" height="220" rx="30" fill="#e9f4ef"/><text x="1340" y="470" fill="#17394a" text-anchor="middle" font-size="35">international</text><text x="1340" y="525" fill="#466878" text-anchor="middle" font-size="24">墨囊／转换器</text></g><text x="100" y="790" fill="#9cc7d2" font-family="sans-serif" font-size="23">官网 posted length 数字存疑，本站不据此制造后插尺寸</text></svg>
