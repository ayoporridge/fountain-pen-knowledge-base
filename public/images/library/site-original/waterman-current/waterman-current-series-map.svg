<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Waterman 当前钢笔系列导航事实图</title><desc id="desc">示意图，非产品照片。Carène、Expert、Hémisphère、Allure 四个当前钢笔系列的边界。</desc><rect width="1600" height="900" fill="#f5f0e8"/><text x="100" y="118" font-family="serif" font-size="62" fill="#1e3444">Waterman：四个当前钢笔系列</text><text x="100" y="166" font-family="sans-serif" font-size="26" fill="#52606a">示意图，非产品照片｜以具体 SKU、市场与包装为准</text><g font-family="sans-serif"><g transform="translate(100 250)"><rect width="320" height="330" rx="24" fill="#163d59"/><text x="34" y="76" font-size="42" fill="#fff">Carène</text><text x="34" y="130" font-size="25" fill="#dce9ee">1997</text><text x="34" y="182" font-size="25" fill="#dce9ee">18K inset nib</text><text x="34" y="234" font-size="22" fill="#dce9ee">颜色/礼盒 ≠ 新笔型</text></g><g transform="translate(460 250)"><rect width="320" height="330" rx="24" fill="#5b4535"/><text x="34" y="76" font-size="42" fill="#fff">Expert</text><text x="34" y="130" font-size="25" fill="#f3e7dc">1990–92</text><text x="34" y="182" font-size="25" fill="#f3e7dc">当前钢尖 SKU</text><text x="34" y="234" font-size="22" fill="#f3e7dc">I/II/III 是旧款线索</text></g><g transform="translate(820 250)"><rect width="320" height="330" rx="24" fill="#40534a"/><text x="34" y="76" font-size="42" fill="#fff">Hémisphère</text><text x="34" y="130" font-size="25" fill="#e4eee6">1994</text><text x="34" y="182" font-size="25" fill="#e4eee6">细身钢尖路线</text><text x="34" y="234" font-size="22" fill="#e4eee6">特别版需单独核对</text></g><g transform="translate(1180 250)"><rect width="320" height="330" rx="24" fill="#8b5c3c"/><text x="34" y="76" font-size="42" fill="#fff">Allure</text><text x="34" y="130" font-size="25" fill="#fff0e5">当前目录</text><text x="34" y="182" font-size="25" fill="#fff0e5">钢尖日写路线</text><text x="34" y="234" font-size="22" fill="#fff0e5">不编造首发年份</text></g></g><text x="100" y="730" font-family="sans-serif" font-size="30" fill="#334155">共同点：Waterman cartridge/converter；不同点：笔尖、体量、年代、SKU 与图片都不能互借。</text></svg>
