<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Grande Bellezza Forged Carbon 钢笔事实示意图</title>
  <desc id="desc">本站原创事实示意图，非产品照片。用通用钢笔轮廓和四项中文要点介绍锻造碳笔杆、14K 笔尖、活塞上墨与磁吸闭合；图形、配色和比例不代表实物。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eee3"/>
      <stop offset="1" stop-color="#dfe9e6"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33464b"/>
      <stop offset="0.52" stop-color="#65777a"/>
      <stop offset="1" stop-color="#293b40"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2b342f" flood-opacity="0.2"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .fact-title { font-size: 24px; font-weight: 750; fill: #183b3b; }
      .fact-copy { font-size: 20px; fill: #526565; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="110" r="260" fill="#2b7269" opacity="0.06"/>
  <circle cx="110" cy="830" r="230" fill="#bd7d42" opacity="0.07"/>

  <g class="text">
    <text x="90" y="92" font-size="25" letter-spacing="4" fill="#58716d">钢笔结构与使用要点</text>
    <text x="90" y="155" font-size="47" font-weight="780" fill="#173535">Grande Bellezza Forged Carbon</text>
    <text x="92" y="198" font-size="24" fill="#60716f">PP2401／206 · Pineider 钢笔</text>

    <g transform="translate(90 292)" filter="url(#shadow)" aria-label="通用钢笔轮廓">
      <rect x="0" y="0" width="710" height="310" rx="34" fill="#fffdf8"/>
      <text x="36" y="54" font-size="20" fill="#687a77">可辨认轮廓：笔帽、笔杆、握位与笔尖</text>
      <g transform="translate(52 112)">
        <path d="M18 31Q18 8 43 8H272Q300 8 313 31V111Q300 134 272 134H43Q18 134 18 111Z" fill="#273a3f"/>
        <rect x="290" y="20" width="240" height="102" rx="51" fill="url(#barrel)"/>
        <rect x="514" y="35" width="84" height="72" rx="29" fill="#d7c49d"/>
        <path d="M590 42L650 71L590 100Q570 71 590 42Z" fill="#f4e7c5" stroke="#94774c" stroke-width="4"/>
        <path d="M601 71H636" stroke="#94774c" stroke-width="3"/>
        <path d="M92 18V124M124 18V124M156 18V124M188 18V124" stroke="#8fa1a0" stroke-width="3" opacity="0.42"/>
        <path d="M40 151H642" stroke="#89a09c" stroke-width="3" stroke-linecap="round"/>
        <text x="341" y="187" text-anchor="middle" font-size="18" fill="#6b7a77">装饰性通用轮廓，不复刻商品外形</text>
      </g>
    </g>

    <g transform="translate(850 278)">
      <g data-reader-fact="1">
        <rect width="300" height="152" rx="24" fill="#fffdfa" stroke="#abc0bb" stroke-width="2"/>
        <circle cx="36" cy="37" r="16" fill="#2b7269"/><text x="65" y="44" class="fact-title">锻造碳笔杆</text>
        <text x="30" y="91" class="fact-copy">材料名称来自商品资料</text>
        <text x="30" y="122" class="fact-copy">示意纹理不对应实物</text>
      </g>
      <g transform="translate(330 0)" data-reader-fact="2">
        <rect width="300" height="152" rx="24" fill="#fffdfa" stroke="#d7bc8b" stroke-width="2"/>
        <circle cx="36" cy="37" r="16" fill="#b48443"/><text x="65" y="44" class="fact-title">14K 笔尖</text>
        <text x="30" y="91" class="fact-copy">提供 B、EF、F、M、S</text>
        <text x="30" y="122" class="fact-copy">尖幅以标称选项为准</text>
      </g>
      <g transform="translate(0 182)" data-reader-fact="3">
        <rect width="300" height="152" rx="24" fill="#fffdfa" stroke="#abc0bb" stroke-width="2"/>
        <circle cx="36" cy="37" r="16" fill="#2b7269"/><text x="65" y="44" class="fact-title">活塞上墨</text>
        <path d="M31 79H104M92 68L106 79L92 90" fill="none" stroke="#2b7269" stroke-width="4"/>
        <text x="30" y="122" class="fact-copy">尾端旋转驱动上墨机构</text>
      </g>
      <g transform="translate(330 182)" data-reader-fact="4">
        <rect width="300" height="152" rx="24" fill="#fffdfa" stroke="#d7bc8b" stroke-width="2"/>
        <circle cx="36" cy="37" r="16" fill="#b48443"/><text x="65" y="44" class="fact-title">磁吸闭合</text>
        <path d="M36 77v25q0 18 18 18t18-18V77M36 77h14M58 77h14" fill="none" stroke="#b48443" stroke-width="4"/>
        <text x="95" y="105" class="fact-copy">笔帽沿轴线开合</text>
      </g>
    </g>

    <rect x="90" y="748" width="1420" height="92" rx="26" fill="#173535"/>
    <text x="800" y="786" text-anchor="middle" font-size="23" font-weight="700" fill="#f7f3e9">本站原创事实示意图，非产品照片</text>
    <text x="800" y="818" text-anchor="middle" font-size="19" fill="#cbd9d5">未复制品牌 logo；图形、配色、纹理与比例仅用于讲解，不代表实物</text>
  </g>
