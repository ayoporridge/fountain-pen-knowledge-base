<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">John Hancock Cartridge Pen 结构示意</title>
  <desc id="desc">原创编辑示意图，画出硬橡胶笔身、薄铜管墨囊与穿刺 section 的概念关系，不是产品照片或专利图复刻。</desc>
  <rect width="960" height="540" rx="28" fill="#eee8dc"/>
  <rect x="62" y="68" width="836" height="402" rx="22" fill="#fffaf0" stroke="#29241e" stroke-width="4"/>
  <text x="92" y="122" font-family="serif" font-size="34" font-weight="700" fill="#29241e">John Hancock Cartridge Pen</text>
  <text x="92" y="154" font-family="sans-serif" font-size="18" fill="#6b6056">Pollock Pen Co. · 早期铜管墨囊概念图</text>
  <path d="M150 270 C250 220 340 220 440 270 L690 270" fill="none" stroke="#191817" stroke-width="38" stroke-linecap="round"/>
