    <rect x="290" y="48" width="670" height="86" rx="34" fill="url(#momiji)" stroke="#4a1c20" stroke-width="6"/>
    <path d="M960 48h130l44 43-44 43H960z" fill="#b49369" stroke="#4a1c20" stroke-width="6"/>
    <circle cx="1148" cy="91" r="18" fill="#d6b16b" stroke="#4a1c20" stroke-width="5"/>
    <path d="M306 60c112 28 160 54 270 42 132-14 178-53 310-15" fill="none" stroke="#ffcf73" stroke-width="18" stroke-linecap="round" opacity=".58"/>
    <path d="M132 102c40-44 64-44 91-3-29 30-54 36-91 3zM420 118c46-54 72-47 94 3-32 26-64 31-94-3zM744 72c38-42 69-35 87 9-31 22-59 25-87-9zM842 122c38-39 62-28 77 10-27 19-51 18-77-10z" fill="#f3bd62" opacity=".86"/>
    <path d="M168 87c22 8 36 21 50 43M465 88c22 13 34 25 44 50M784 89c20 9 32 21 45 40M878 89c15 10 24 18 34 31" fill="none" stroke="#8b292f" stroke-width="7" stroke-linecap="round"/>
