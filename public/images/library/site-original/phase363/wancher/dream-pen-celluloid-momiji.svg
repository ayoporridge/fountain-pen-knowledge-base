<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wancher Dream Pen Celluloid MOMIJI factual diagram</title>
  <desc id="desc">A site-original, not-to-scale diagram for the modern cellulose acetate MOMIJI colourway.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff5ed"/>
      <stop offset="1" stop-color="#ecd5c3"/>
    </linearGradient>
    <linearGradient id="momiji" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3b45b"/>
      <stop offset="0.42" stop-color="#c9443b"/>
      <stop offset="0.75" stop-color="#8b2026"/>
      <stop offset="1" stop-color="#4e1b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5b2725" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect x="72" y="64" width="1456" height="772" rx="42" fill="#fffaf7" stroke="#542a2d" stroke-width="4"/>
