    <rect x="590" y="590" width="410" height="158" rx="22" fill="#f2e0d1" stroke="#9d6d59" stroke-width="3"/>
    <text x="620" y="635" font-size="28" font-weight="700">现代材料</text>
    <text x="620" y="676" font-size="23">cellulose acetate · titanium</text>
    <text x="620" y="711" font-size="23">925 ring · 尖材按订单核对</text>

    <rect x="1048" y="590" width="390" height="158" rx="22" fill="#f5e8df" stroke="#a66b61" stroke-width="3"/>
