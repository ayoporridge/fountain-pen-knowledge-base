    <rect x="800" y="485" width="300" height="105" rx="16" fill="#fff0dd" stroke="#c99756" stroke-width="2"/>
    <text x="825" y="520">not Heritage 18K</text>
    <text x="825" y="555">not PFM Snorkel</text>
