<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Alba Classic PP7701／1120 身份与规格边界事实图</title>
  <desc id="desc">本站原创示意图，以资料卡和三个子 SKU 模块说明 Alba Classic 的当前身份、规格和与 Alba Mini 的边界；非产品照片，不代表真实外形、颜色、纹理或比例。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eadb"/>
      <stop offset="1" stop-color="#d8e5df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17352d" flood-opacity="0.15"/>
    </filter>
    <style>
      .sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",sans-serif}
      .serif{font-family:"Songti SC","Noto Serif CJK SC",serif}
      .label{font-size:20px;letter-spacing:3px;fill:#537067}
      .small{font-size:22px;fill:#4f625c}
      .chip{font-size:23px;font-weight:650;fill:#183d34}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="110" r="230" fill="#f4bd75" opacity="0.22"/>
  <circle cx="104" cy="790" r="260" fill="#5f8d80" opacity="0.12"/>

  <g class="sans">
    <text x="92" y="92" class="label">IDENTITY MAP · 2026 COLLECTION</text>
    <text x="92" y="157" font-size="54" font-weight="720" fill="#173d33">Alba Classic</text>
    <text x="92" y="199" font-size="25" fill="#45645c">PP7701／1120 · current fountain-pen scope</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="246" width="1416" height="508" rx="34" fill="#fffdf8"/>
  </g>

  <g class="sans">
    <rect x="134" y="288" width="478" height="424" rx="26" fill="#173d33"/>
    <text x="176" y="343" font-size="18" letter-spacing="3" fill="#b9d4cb">EXACT PRODUCT ANCHOR</text>
    <text x="176" y="410" font-size="42" font-weight="700" fill="#fffaf0">PP7701／1120</text>
    <line x1="176" y1="443" x2="565" y2="443" stroke="#72978b"/>
    <text x="176" y="496" font-size="25" fill="#ecf2ee">MILK · code 010</text>
    <text x="176" y="542" font-size="25" fill="#ecf2ee">144 mm · Ø15.5 mm</text>
    <text x="176" y="588" font-size="25" fill="#ecf2ee">No.6 stainless steel</text>
    <text x="176" y="634" font-size="25" fill="#ecf2ee">converter or cartridge</text>
    <text x="176" y="680" font-size="20" fill="#b9d4cb">palladium trims · Twist Magnetic Lock</text>

    <text x="662" y="319" class="label">THREE CURRENT CHILD SKUS</text>
    <g>
      <rect x="662" y="349" width="250" height="92" rx="20" fill="#e2eee8" stroke="#9ab8ad"/>
      <text x="688" y="387" class="small">Extra Fine</text>
      <text x="688" y="420" class="chip">SPP7701E010</text>
      <rect x="930" y="349" width="250" height="92" rx="20" fill="#e2eee8" stroke="#9ab8ad"/>
      <text x="956" y="387" class="small">Fine</text>
      <text x="956" y="420" class="chip">SPP7701F010</text>
      <rect x="1198" y="349" width="250" height="92" rx="20" fill="#e2eee8" stroke="#9ab8ad"/>
      <text x="1224" y="387" class="small">Medium</text>
      <text x="1224" y="420" class="chip">SPP7701M010</text>
    </g>

    <text x="662" y="504" class="label">BOUNDARY · DO NOT INHERIT FROM MINI</text>
    <rect x="662" y="536" width="786" height="136" rx="22" fill="#f8e9d4" stroke="#e0b77f"/>
    <text x="696" y="578" font-size="24" font-weight="650" fill="#654520">Classic：No.6 · EF／F／M · converter or cartridge</text>
    <text x="696" y="619" font-size="23" fill="#765b38">Mini sibling：No.5 · F／M · cartridge only · 120 mm</text>
    <text x="696" y="652" font-size="19" fill="#8d7252">共享 galalith，不共享上墨、尖号、尺寸、饰件或帽盖机构</text>
  </g>

  <g class="sans">
    <line x1="92" y1="813" x2="1508" y2="813" stroke="#769187" opacity="0.7"/>
    <text x="92" y="855" font-size="20" fill="#4e665e">本站原创示意图／非产品照片 · 不表示真实外形、颜色、纹理、笔夹、机构或比例</text>
    <text x="1508" y="855" text-anchor="end" font-size="20" fill="#4e665e">SOURCE-BOUND FACT DIAGRAM</text>
  </g>
</svg>
