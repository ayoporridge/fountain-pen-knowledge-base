<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Alba Classic 钢笔事实示意图</title>
  <desc id="desc">本站原创事实示意图，非产品照片。用经典通用钢笔轮廓和四项中文要点介绍 galalith 笔身、六号钢尖、墨囊上墨器与旋转磁吸笔帽；图形、配色和比例不代表实物。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5e9"/>
      <stop offset="1" stop-color="#eee4cf"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98552"/>
      <stop offset="0.5" stop-color="#e0b97d"/>
      <stop offset="1" stop-color="#9b683d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6c5138" flood-opacity="0.19"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .fact-title { font-size: 24px; font-weight: 750; fill: #4a3927; }
      .fact-copy { font-size: 20px; fill: #725d43; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1438" cy="110" r="260" fill="#9b6a3e" opacity="0.07"/>
  <path d="M0 730C260 640 470 810 776 718C1075 629 1295 688 1600 610V900H0Z" fill="#9b6a3e" opacity="0.05"/>
  <g class="text">
    <text x="90" y="92" font-size="25" letter-spacing="4" fill="#8c6d4a">经典尺寸钢笔</text>
    <text x="90" y="155" font-size="51" font-weight="780" fill="#463423">Pineider Alba Classic</text>
    <text x="92" y="198" font-size="24" fill="#796247">PP7701／1120 · 与 Alba Mini 分开辨认</text>

    <g transform="translate(90 286)" filter="url(#shadow)" aria-label="经典通用钢笔轮廓">
      <rect width="800" height="360" rx="38" fill="#fffdf7"/>
      <text x="38" y="58" font-size="21" fill="#826d53">可辨认轮廓：长笔帽、笔杆、握位与六号笔尖</text>
      <g transform="translate(48 116)">
        <path d="M15 36Q15 7 52 7H300Q337 7 355 36V114Q337 143 300 143H52Q15 143 15 114Z" fill="url(#body)"/>
        <path d="M344 28Q385 8 431 18L596 38Q630 44 645 75Q630 106 596 112L431 132Q385 142 344 122Z" fill="#c8965b"/>
        <rect x="611" y="43" width="62" height="64" rx="22" fill="#cbd0cd"/>
        <path d="M664 39L736 75L664 111Q638 75 664 39Z" fill="#e8ecea" stroke="#737d7b" stroke-width="4"/>
        <path d="M678 75H720" stroke="#737d7b" stroke-width="3"/>
        <path d="M25 165H730" stroke="#c6b395" stroke-width="3"/>
        <text x="375" y="201" text-anchor="middle" font-size="18" fill="#8a7457">通用结构示意，不表示真实色泽与尺寸比例</text>
      </g>
    </g>

    <g transform="translate(950 286)">
      <g data-reader-fact="1">
        <rect width="560" height="96" rx="22" fill="#fffdf7" stroke="#d4bb97" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#a87443"/><text x="80" y="43" class="fact-title">Galalith 笔身</text>
        <text x="80" y="73" class="fact-copy">避免酒精与刺激性清洁剂</text>
      </g>
      <g transform="translate(0 116)" data-reader-fact="2">
        <rect width="560" height="96" rx="22" fill="#fffdf7" stroke="#b8c5c2" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#738783"/><text x="80" y="43" class="fact-title">六号不锈钢笔尖</text>
        <text x="80" y="73" class="fact-copy">EF、F、M 三种标称尖幅</text>
      </g>
      <g transform="translate(0 232)" data-reader-fact="3">
        <rect width="560" height="96" rx="22" fill="#fffdf7" stroke="#d4bb97" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#a87443"/><text x="80" y="43" class="fact-title">墨囊／上墨器</text>
        <text x="80" y="73" class="fact-copy">换墨时拆下后以清水冲洗</text>
      </g>
      <g transform="translate(0 348)" data-reader-fact="4">
        <rect width="560" height="96" rx="22" fill="#fffdf7" stroke="#b8c5c2" stroke-width="2"/>
        <circle cx="41" cy="48" r="20" fill="#738783"/><text x="80" y="43" class="fact-title">Twist Magnetic Lock</text>
        <text x="80" y="73" class="fact-copy">笔帽沿笔身轴线旋转开合</text>
      </g>
    </g>

    <rect x="90" y="762" width="1420" height="82" rx="25" fill="#4a3927"/>
    <text x="800" y="797" text-anchor="middle" font-size="23" font-weight="700" fill="#fff8e9">本站原创事实示意图，非产品照片</text>
    <text x="800" y="826" text-anchor="middle" font-size="18" fill="#ddcfb9">未复制品牌 logo；轮廓、颜色、材质效果与比例不代表实物</text>
  </g>
</svg>
