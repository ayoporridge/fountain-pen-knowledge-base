<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pineider Alba Mini PP7601／1122 紧凑型号边界事实图</title>
  <desc id="desc">本站原创示意图，用紧凑卡片、尺寸轴和两枚子 SKU 说明 Alba Mini 的 cartridge-only、No.5 与 sibling 排除边界；非产品照片。</desc>
  <defs>
    <radialGradient id="bg" cx="28%" cy="20%" r="95%">
      <stop offset="0" stop-color="#fff4d7"/>
      <stop offset="0.58" stop-color="#e7d4aa"/>
      <stop offset="1" stop-color="#b8c8c2"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#243a36" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",sans-serif}
      .tag{font-size:19px;letter-spacing:3px;fill:#6c5d37}
      .body{font-size:23px;fill:#314a44}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 700 C310 600 455 800 760 690 C1050 585 1260 735 1600 600 L1600 900 L0 900Z" fill="#355a50" opacity="0.13"/>
  <path d="M1120 0 L1600 0 L1600 395Z" fill="#ffffff" opacity="0.25"/>

  <g class="sans">
    <text x="92" y="92" class="tag">COMPACT IDENTITY · NOT A GENERIC “MINI”</text>
    <text x="92" y="161" font-size="56" font-weight="740" fill="#263f39">Alba Mini</text>
    <text x="92" y="204" font-size="25" fill="#54655f">PP7601／1122 · 2026 current fountain pen</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="252" width="562" height="500" rx="42" fill="#fffdf7"/>
  </g>
  <g class="sans">
    <text x="138" y="310" class="tag">EXACT PRODUCT ANCHOR</text>
    <text x="138" y="375" font-size="45" font-weight="720" fill="#2c4b43">PP7601／1122</text>
    <rect x="138" y="411" width="470" height="3" fill="#d7b86d"/>

    <text x="138" y="464" class="body">120 mm</text>
    <line x1="282" y1="456" x2="558" y2="456" stroke="#789188" stroke-width="6" stroke-linecap="round"/>
    <circle cx="282" cy="456" r="10" fill="#d3a94d"/>
    <circle cx="558" cy="456" r="10" fill="#d3a94d"/>
    <text x="138" y="512" class="body">Ø13.4 mm · MILK／010</text>
    <text x="138" y="560" class="body">No.5 stainless steel · F／M</text>
    <text x="138" y="608" class="body" font-weight="700">cartridge only</text>
    <text x="138" y="656" class="body">gold plating · Magnetic Lock</text>
    <text x="138" y="706" font-size="19" fill="#687970">官方未公布重量，不从 sibling 补入</text>

    <text x="714" y="285" class="tag">TWO CURRENT CHILD SKUS</text>
    <g filter="url(#shadow)">
      <rect x="714" y="320" width="366" height="144" rx="30" fill="#31584d"/>
      <rect x="1104" y="320" width="366" height="144" rx="30" fill="#31584d"/>
    </g>
    <text x="754" y="371" font-size="23" fill="#dce9e4">Fine</text>
    <text x="754" y="420" font-size="31" font-weight="700" fill="#fff8e8">SPP7601F010</text>
    <text x="1144" y="371" font-size="23" fill="#dce9e4">Medium</text>
    <text x="1144" y="420" font-size="31" font-weight="700" fill="#fff8e8">SPP7601M010</text>

    <text x="714" y="528" class="tag">THREE EXCLUSIONS</text>
    <g>
      <rect x="714" y="558" width="756" height="58" rx="18" fill="#fff4dc" stroke="#c4a660"/>
      <text x="744" y="596" font-size="21" fill="#5f5133">≠ Alba Classic：No.6／converter／144 mm／Twist lock</text>
      <rect x="714" y="630" width="756" height="58" rx="18" fill="#fff4dc" stroke="#c4a660"/>
      <text x="744" y="668" font-size="21" fill="#5f5133">≠ Fountain Pen Mini SPP7201／1063：UltraResin／palladium</text>
      <rect x="714" y="702" width="756" height="58" rx="18" fill="#fff4dc" stroke="#c4a660"/>
      <text x="744" y="740" font-size="21" fill="#5f5133">≠ rollerball／ballpoint：不同书写机构，不是钢笔 variant</text>
    </g>
  </g>

  <g class="sans">
    <line x1="92" y1="818" x2="1470" y2="818" stroke="#5f756e" opacity="0.75"/>
    <text x="92" y="858" font-size="20" fill="#425b54">本站原创示意图／非产品照片 · 不表示真实颜色、外形、galalith 纹理、饰件、笔夹或比例</text>
    <text x="1470" y="858" text-anchor="end" font-size="20" fill="#425b54">FACTUAL SCOPE MAP</text>
  </g>
</svg>
