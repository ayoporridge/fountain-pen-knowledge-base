<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Montegrappa Extra 1930 身份与规格边界示意图</title><desc id="desc">本站原创事实图，说明 Extra 1930 的赛璐珞、925 银、18K 金尖、活塞和尺寸；不是产品照片。</desc><rect width="1200" height="630" fill="#26242b"/><text x="72" y="94" fill="#f0e6cf" font-family="Georgia,serif" font-size="50">Montegrappa Extra 1930</text><text x="72" y="137" fill="#c9c4cf" font-family="Arial,sans-serif" font-size="22">当代赛璐珞活塞款；不是历史老 Extra，也不是八角形 Extra Otto</text><rect x="92" y="258" width="570" height="72" rx="32" fill="#826a4c"/><polygon points="662,258 804,294 662,330" fill="#dad9d2"/><rect x="276" y="266" width="65" height="56" rx="12" fill="#c7c4ba"/><text x="380" y="385" text-anchor="middle" fill="#c9c4cf" font-family="Arial,sans-serif" font-size="20">轮廓仅提示分类，不代表真实比例或赛璐珞纹理</text><g fill="#f0e6cf" font-family="Arial,sans-serif" font-size="26"><text x="805" y="255">官方当前指定商品</text><text x="805" y="312">赛璐珞・925 银装饰・18K 金尖</text><text x="805" y="369">硬橡胶 feed・一体活塞・附 50 ml 墨水</text><text x="805" y="426">138 mm・16.6 mm・44 g</text><text x="805" y="483">EF / F / M / B / BB / ST1 按 SKU</text></g><rect x="72" y="540" width="1056" height="52" rx="12" fill="#48434d"/><text x="600" y="573" text-anchor="middle" fill="#c9c4cf" font-family="Arial,sans-serif" font-size="19">示意图，非产品照片；不代表颜色、纹理、笔尖刻字、库存、重量分布或具体 SKU。</text></svg>
