<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">IKKAKU Rhinoceros Skin Lacquer 事实图</title><desc id="desc">本站原创非产品照片，以抽象层纹展示浅滩和深海，并标出深海数量冲突。</desc><rect width="1600" height="900" fill="#16191a"/><g fill="none" stroke-linecap="round"><path d="M870 230Q1120 120 1470 260" stroke="#b39057" stroke-width="80"/><path d="M850 400Q1120 280 1460 430" stroke="#47778c" stroke-width="95"/><path d="M880 590Q1140 460 1450 625" stroke="#987049" stroke-width="75"/></g><g fill="#f1eee5" font-family="system-ui,sans-serif"><text x="105" y="145" font-size="60">Rhinoceros Skin Lacquer</text><text x="105" y="215" font-size="34">浅滩 Qian-Tan · 深海 Shen-Hai</text><text x="105" y="710" font-size="31">No.6 14K F/M · Cartridge/Converter</text><text x="105" y="765" font-size="27">浅滩 18 · 深海 4 vs 18 数量冲突</text><text x="1490" y="845" text-anchor="end" font-size="24" fill="#7da8b9">名称指漆纹 · 非犀牛皮 · 原创非产品照片</text></g></svg>
