<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parker VP 旋转尖与 Clean Filler 示意图</title><desc id="desc">1962、三角握位、旋转笔尖、Clean Filler 与 Parker 75 血缘；非产品照片。</desc><rect width="1600" height="900" fill="#f5f1e8"/><text x="100" y="105" font-family="sans-serif" font-size="50" font-weight="700" fill="#1e293b">PARKER VP · VERY PERSONAL</text><text x="100" y="155" font-family="sans-serif" font-size="24" fill="#475569">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text><g font-family="sans-serif"><rect x="110" y="255" width="350" height="250" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="150" y="330" font-size="40" font-weight="700" fill="#1e3a8a">1962</text><text x="150" y="385" font-size="30" fill="#1e293b">Very Personal</text><text x="150" y="435" font-size="23" fill="#334155">三角握位 · 左手角度</text><rect x="580" y="210" width="400" height="190" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="620" y="280" font-size="31" font-weight="700" fill="#166534">旋转尖／笔舌</text><text x="620" y="330" font-size="23" fill="#334155">刻度微调书写面</text><text x="620" y="370" font-size="23" fill="#334155">尖码按 VP 资料解释</text><rect x="580" y="470" width="400" height="190" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="620" y="540" font-size="31" font-weight="700" fill="#92400e">Clean Filler</text><text x="620" y="590" font-size="23" fill="#334155">可拆卸长颈挤压转换器</text><text x="620" y="630" font-size="23" fill="#334155">细颈，禁止硬拧</text><rect x="1120" y="275" width="370" height="270" rx="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="1160" y="345" font-size="31" font-weight="700" fill="#3730a3">家族边界</text><text x="1160" y="400" font-size="23" fill="#334155">VP ≠ Parker 75</text><text x="1160" y="440" font-size="23" fill="#334155">尖码／转换器分开</text><text x="1160" y="480" font-size="23" fill="#334155">设计血缘不等于通用零件</text><path d="M460 380h120M460 440h120M980 300h140M980 560h140" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs></svg>
