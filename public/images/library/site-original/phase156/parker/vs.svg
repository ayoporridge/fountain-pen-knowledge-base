<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parker VS 版本与填充器示意图</title><desc id="desc">1946、明尖、按钮与后期气压填充器、美国与欧洲版本；非产品照片。</desc><rect width="1600" height="900" fill="#f5f1e8"/><text x="100" y="105" font-family="sans-serif" font-size="50" font-weight="700" fill="#1e293b">PARKER VS · VERSION MAP</text><text x="100" y="155" font-family="sans-serif" font-size="24" fill="#475569">factual diagram · non-photo · non-logo · not-to-scale · non-colour-proof</text><g font-family="sans-serif"><rect x="100" y="255" width="340" height="250" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="140" y="330" font-size="40" font-weight="700" fill="#1e3a8a">1946</text><text x="140" y="385" font-size="30" fill="#1e293b">Parker VS</text><text x="140" y="435" font-size="23" fill="#334155">明尖 · 流线外形</text><rect x="540" y="205" width="360" height="190" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="580" y="275" font-size="31" font-weight="700" fill="#92400e">Mark I / II</text><text x="580" y="325" font-size="23" fill="#334155">铝制按钮填充器</text><text x="580" y="365" font-size="23" fill="#334155">颜色与帽盖变化</text><rect x="540" y="465" width="360" height="190" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="580" y="535" font-size="31" font-weight="700" fill="#166534">后期过渡</text><text x="580" y="585" font-size="23" fill="#334155">气压式填充器</text><text x="580" y="625" font-size="23" fill="#334155">旧库存可能粘接盲帽</text><rect x="1030" y="270" width="460" height="300" rx="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="1070" y="340" font-size="31" font-weight="700" fill="#3730a3">识别边界</text><text x="1070" y="395" font-size="23" fill="#334155">Vis-O-Feed 笔舌</text><text x="1070" y="435" font-size="23" fill="#334155">美国／丹麦生产</text><text x="1070" y="475" font-size="23" fill="#334155">VS ≠ Vacumatic / 51</text><text x="1070" y="515" font-size="23" fill="#334155">填充器决定维护方式</text><path d="M440 380h100M440 440h100M900 300h120M900 560h120" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs></svg>
