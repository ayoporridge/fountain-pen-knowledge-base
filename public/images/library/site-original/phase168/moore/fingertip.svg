<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moore Fingertip facts</title>
  <desc id="desc">Editorial diagram showing a flush inlaid nib, steel section, lever filler and historical dates.</desc>
  <rect width="1600" height="900" fill="#fff7ed"/>
  <text x="110" y="145" fill="#7c2d12" font-family="sans-serif" font-size="64" font-weight="700">MOORE FINGERTIP</text>
  <text x="114" y="198" fill="#9a3412" font-family="sans-serif" font-size="28">1946–1950 · historical model · verify each specimen</text>
  <g>
    <path d="M180 430h980q90 0 160 55l-160 55H180q-50 0-50-55t50-55z" fill="#9f1239"/>
    <path d="M1140 485l210-48 120 48-120 48z" fill="#d4d4d8" stroke="#52525b" stroke-width="5"/>
    <path d="M1395 485l70-15 60 15-60 15z" fill="#facc15"/>
    <rect x="430" y="390" width="22" height="190" rx="11" fill="#facc15"/>
    <text x="300" y="350" fill="#7c2d12" font-family="sans-serif" font-size="27" font-weight="700">celluloid / colour varies</text>
    <text x="1220" y="370" fill="#7c2d12" font-family="sans-serif" font-size="27" font-weight="700">flush inlaid tip</text>
    <text x="1280" y="635" fill="#52525b" font-family="sans-serif" font-size="26" text-anchor="middle">steel section</text>
    <text x="440" y="645" fill="#7c2d12" font-family="sans-serif" font-size="26" text-anchor="middle">lever filler</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="170" y="720" width="330" height="75" rx="16" fill="#7f1d1d"/>
    <text x="335" y="768" fill="#fff7ed" font-size="25">14K mark: verify specimen</text>
    <rect x="635" y="720" width="330" height="75" rx="16" fill="#166534"/>
    <text x="800" y="768" fill="#dcfce7" font-size="25">F/M/B ranges: archive</text>
    <rect x="1100" y="720" width="330" height="75" rx="16" fill="#1e3a8a"/>
    <text x="1265" y="768" fill="#dbeafe" font-size="25">not a safety pen</text>
  </g>
  <text x="110" y="850" fill="#9a3412" font-family="sans-serif" font-size="22">原创 factual SVG · 非产品照片 · 不证明金含量、颜色、尺寸、修复状态或库存</text>
</svg>
