<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Esterbrook Dollar Pen B A H identity guide</title><desc id="desc">本站原创事实示意图，说明 Dollar Pen 是约 1934 至 1942 年的 B、A、H 历史家族，非产品照片或比例图。</desc><rect width="1200" height="630" fill="#102d3b"/><text x="74" y="96" fill="#f7f0dc" font-family="serif" font-size="48">Esterbrook Dollar Pen</text><text x="76" y="140" fill="#b9d4d5" font-family="sans-serif" font-size="24">B / A / H · approximately 1934–1942</text><line x1="76" y1="180" x2="1124" y2="180" stroke="#d6ad5c" stroke-width="3"/><g fill="none" stroke="#f7f0dc" stroke-width="10" stroke-linecap="round"><path d="M130 430h210l28-38-28-38H130z"/><path d="M470 430h170l26-38-26-38H470z"/><path d="M790 430h125l22-38-22-38H790z"/></g><g fill="#d6ad5c" font-family="sans-serif" font-size="30"><text x="192" y="490">B · full size</text><text x="505" y="490">A · slender</text><text x="792" y="490">H · demi</text></g><text x="76" y="564" fill="#b9d4d5" font-family="sans-serif" font-size="22">Two-hole clip · flat top / barrel · lever filler · Renew-Point unit</text><text x="76" y="600" fill="#b9d4d5" font-family="sans-serif" font-size="17">Fountain Pen Graph original factual SVG · not a product photograph, colour proof, or scale drawing</text></svg>
