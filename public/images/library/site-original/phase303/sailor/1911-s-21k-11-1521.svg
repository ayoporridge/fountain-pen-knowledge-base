<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sailor 1911 S 21K 11-1521 factual diagram</title>
  <desc id="desc">Editorial non-photo diagram showing the 11-1521 21K gold-plated nib, PMMA resin body, screw cap and cartridge-converter filling.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#15253a"/><stop offset="0.5" stop-color="#355578"/><stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9a6b19"/><stop offset="0.45" stop-color="#f0cf6a"/><stop offset="1" stop-color="#8e5b13"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#f4f0e7"/>
  <rect x="60" y="60" width="1480" height="780" rx="34" fill="#fffdf8" stroke="#d5c7ad" stroke-width="4"/>
  <text x="120" y="145" fill="#20354d" font-family="Georgia, serif" font-size="48" font-weight="700">Sailor 1911 S 21K · 11-1521</text>
  <text x="122" y="190" fill="#6d604f" font-family="sans-serif" font-size="25">事实示意图 · 21K gold-plated nib · PMMA resin · converter &amp; cartridge</text>
  <g transform="translate(170 360) rotate(-7)">
    <path d="M0 90 C20 20 110 0 190 0 H865 C932 0 975 25 1000 90 C975 155 932 180 865 180 H190 C110 180 20 160 0 90Z" fill="url(#body)" stroke="#0a1320" stroke-width="8"/>
    <path d="M850 18 H1015 C1065 18 1095 50 1095 90 C1095 130 1065 162 1015 162 H850Z" fill="#e9e3d8" stroke="#887b68" stroke-width="7"/>
    <path d="M850 28 H1015 C1050 28 1070 48 1070 90 C1070 132 1050 152 1015 152 H850" fill="none" stroke="#b7a98e" stroke-width="8" stroke-dasharray="22 15"/>
    <path d="M1088 77 L1235 90 L1088 103 Z" fill="url(#gold)" stroke="#6d4912" stroke-width="5"/>
    <path d="M1150 90 C1180 67 1210 65 1235 90 C1210 115 1180 113 1150 90Z" fill="#f6e7a3" stroke="#6d4912" stroke-width="4"/>
    <circle cx="1205" cy="90" r="9" fill="#5f4217"/>
    <rect x="190" y="-18" width="18" height="216" rx="9" fill="#d7b75b"/>
    <rect x="210" y="-18" width="12" height="216" rx="6" fill="#795716" opacity=".75"/>
    <path d="M80 42 H160 M70 68 H165 M64 94 H165 M70 120 H165 M80 146 H160" stroke="#d8c18d" stroke-width="6" opacity=".75"/>
  </g>
  <g font-family="sans-serif" fill="#20354d">
    <text x="180" y="670" font-size="28" font-weight="700">PMMA resin body · φ17×135 mm · 17.2 g</text>
    <text x="180" y="710" font-size="23" fill="#6d604f">官方目录尺寸含笔夹；图形不按比例</text>
    <text x="1010" y="320" font-size="28" font-weight="700">21K gold + gold plating</text>
    <text x="1010" y="360" font-size="23" fill="#6d604f">EF · F · MF · M · B · Z · MS</text>
    <text x="1010" y="520" font-size="28" font-weight="700">Sailor C/C filling</text>
    <text x="1010" y="560" font-size="23" fill="#6d604f">原厂墨囊或对应 converter</text>
    <text x="180" y="785" font-size="21" fill="#7a6b58">NON-PHOTO · NON-LOGO · NOT-TO-SCALE · NON-COLOUR-PROOF</text>
  </g>
  <g stroke="#bf9d55" stroke-width="4" fill="none">
    <path d="M915 355 H1000"/><path d="M940 535 H1000"/>
  </g>
</svg>
