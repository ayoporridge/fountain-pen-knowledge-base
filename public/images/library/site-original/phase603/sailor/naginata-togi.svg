<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sailor Naginata-Togi 长刀研笔尖事实图</title>
  <desc id="desc">本站原创事实示意图，对比高书写角度的较细线条与低书写角度的较粗线条，并标明这是笔尖类型而非固定笔身或产品照片。</desc>
  <rect width="1600" height="900" fill="#10202b"/>
  <text x="90" y="105" fill="#f5efe2" font-family="Arial, sans-serif" font-size="54" font-weight="700">SAILOR NAGINATA-TOGI</text>
  <text x="92" y="154" fill="#9fc8d5" font-family="Arial, sans-serif" font-size="24">special nib · factual diagram · not a product photo · not to scale</text>
  <g transform="translate(120 245)">
    <text x="0" y="0" fill="#f5efe2" font-family="Arial, sans-serif" font-size="34" font-weight="700">Higher writing angle</text>
    <path d="M245 65 L365 235 L310 285 L185 115 Z" fill="#c8b071" stroke="#f4d792" stroke-width="8"/>
    <path d="M307 281 L350 342 L277 322 Z" fill="#f5efe2"/>
    <line x1="30" y1="370" x2="570" y2="370" stroke="#d7eaf0" stroke-width="13" stroke-linecap="round"/>
    <text x="30" y="425" fill="#9fc8d5" font-family="Arial, sans-serif" font-size="27">more upright → relatively thinner line</text>
  </g>
  <line x1="790" y1="220" x2="790" y2="735" stroke="#36515e" stroke-width="3"/>
  <g transform="translate(880 245)">
    <text x="0" y="0" fill="#f5efe2" font-family="Arial, sans-serif" font-size="34" font-weight="700">Lower writing angle</text>
    <path d="M95 160 L390 245 L370 315 L70 225 Z" fill="#c8b071" stroke="#f4d792" stroke-width="8"/>
    <path d="M365 312 L440 333 L376 360 Z" fill="#f5efe2"/>
    <line x1="30" y1="370" x2="570" y2="370" stroke="#d7eaf0" stroke-width="34" stroke-linecap="round"/>
    <text x="30" y="425" fill="#9fc8d5" font-family="Arial, sans-serif" font-size="27">laid down → relatively broader line</text>
  </g>
  <rect x="120" y="735" width="1360" height="90" rx="18" fill="#172f3b" stroke="#527686" stroke-width="2"/>
  <text x="160" y="775" fill="#f5efe2" font-family="Arial, sans-serif" font-size="27" font-weight="700">Nib identity, not one pen model</text>
  <text x="160" y="810" fill="#9fc8d5" font-family="Arial, sans-serif" font-size="22">10-7121, Bespoke and KOP products keep their own body, filling, material and SKU facts. Do not press or self-grind.</text>
</svg>
