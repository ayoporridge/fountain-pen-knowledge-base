  <text x="800" y="628" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#fff">Tuscany fountain pen</text><text x="800" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#e0e0e0">钢尖 / 18K 金尖 · 黑漆 · 线纹 guilloché</text>
  <text x="132" y="770" font-family="Arial,sans-serif" font-size="19" fill="#546e7a">本站原创 factual SVG；非产品照片、非 logo、not-to-scale、non-colour-proof。</text>
