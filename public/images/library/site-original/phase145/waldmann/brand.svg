<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Waldmann brand navigation factual diagram</title>
  <desc id="desc">Editorial diagram of Waldmann Pforzheim history and Tuscany navigation; non-photo, non-logo, not-to-scale, non-colour-proof.</desc>
  <rect width="1600" height="900" fill="#f5f2ed"/><rect x="82" y="82" width="1436" height="736" rx="34" fill="#fff" stroke="#455a64" stroke-width="4"/>
  <text x="132" y="170" font-family="Georgia,serif" font-size="60" fill="#263238">WALDMANN</text>
  <text x="132" y="222" font-family="Arial,sans-serif" font-size="26" fill="#546e7a">Pforzheim · 德国制造 · Sterling Silver 925 传统</text>
  <line x1="170" y1="375" x2="1425" y2="375" stroke="#b0bec5" stroke-width="6"/>
  <circle cx="250" cy="375" r="44" fill="#607d8b"/><circle cx="650" cy="375" r="44" fill="#78909c"/><circle cx="1050" cy="375" r="44" fill="#90a4ae"/><circle cx="1360" cy="375" r="44" fill="#b0bec5"/>
  <text x="250" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">1918</text><text x="650" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">925</text><text x="1050" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">DE</text><text x="1360" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#263238">T</text>
  <text x="250" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#263238">公司起点</text><text x="650" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#263238">银制传统</text><text x="1050" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#263238">德国制造</text><text x="1360" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#263238">Tuscany</text>
