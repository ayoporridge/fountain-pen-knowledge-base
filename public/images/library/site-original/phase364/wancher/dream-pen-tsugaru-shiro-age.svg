    <path d="M1030 110 L1130 110 L1170 150 L1130 190 L1030 190 Z" fill="#b5a89b" stroke="#262d2a" stroke-width="8"/>
    <path d="M1170 150 L1285 150" stroke="#262d2a" stroke-width="22" stroke-linecap="round"/>
    <path d="M1285 150 L1370 118 L1370 182 Z" fill="#d0a765" stroke="#262d2a" stroke-width="6"/>
  </g>
  <g font-family="sans-serif" fill="#26302c">
    <text x="170" y="620" font-size="29" font-weight="700">ebonite + urushi · white-base</text>
