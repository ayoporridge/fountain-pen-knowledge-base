<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Charles H. Ingersoll Dollar Pen factual diagram</title>
  <desc id="desc">Original editorial diagram showing the Dollar Pen material generations and stem-winder filling boundary. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#eee9df"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="#fffdf8" stroke="#3a3733" stroke-width="4"/>
  <text x="130" y="170" fill="#282522" font-family="sans-serif" font-size="60" font-weight="700">CHARLES H. INGERSOLL · DOLLAR PEN</text>
  <text x="134" y="225" fill="#71675e" font-family="sans-serif" font-size="28">1920s–约 1931 · stem-winder twist filler · 历史结构示意</text>
  <g transform="translate(160 320)">
    <path d="M80 170 H1080 C1145 170 1192 188 1230 220 L1300 280 L1230 340 C1192 372 1145 390 1080 390 H80 Z" fill="#b9bec0" stroke="#45413d" stroke-width="10"/>
    <path d="M80 170 H340 V390 H80 Z" fill="#cbcfd0"/>
    <path d="M360 170 H670 V390 H360 Z" fill="#b56f4e" opacity=".96"/>
    <path d="M690 170 H1080 C1145 170 1192 188 1230 220 L1300 280 L1230 340 C1192 372 1145 390 1080 390 H690 Z" fill="#3f4c45" opacity=".92"/>
    <path d="M1230 245 L1375 280 L1230 315 L1190 280 Z" fill="#caa55a" stroke="#45413d" stroke-width="8"/>
    <circle cx="125" cy="280" r="24" fill="#caa55a" stroke="#45413d" stroke-width="7"/>
    <path d="M125 250 L125 310 M95 280 L155 280" stroke="#45413d" stroke-width="6"/>
    <path d="M450 170 V390 M500 170 V390 M550 170 V390" stroke="#7e4134" stroke-width="7" opacity=".55"/>
    <path d="M790 170 V390 M850 170 V390 M910 170 V390" stroke="#d1d9cf" stroke-width="7" opacity=".35"/>
    <text x="180" y="290" fill="#4a4641" font-family="sans-serif" font-size="34" font-weight="700">镍镀黄铜</text>
    <text x="430" y="290" fill="#fff0e5" font-family="sans-serif" font-size="34" font-weight="700">赛璐珞</text>
    <text x="780" y="290" fill="#f1eee8" font-family="sans-serif" font-size="34" font-weight="700">Bakelite</text>
  </g>
  <g fill="#403b36" font-family="sans-serif" font-size="30">
    <text x="190" y="760">尾端旋转 stem-winder 扭压墨囊</text>
    <text x="785" y="760">14K 金尖／钢尖按单支刻字</text>
    <text x="1200" y="760">示意图，非产品照片</text>
  </g>
</svg>
