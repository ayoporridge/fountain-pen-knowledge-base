<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Jacques Herbin 品牌事实示意图</title>
  <desc id="desc">以墨瓶、钢笔轮廓和时间线解释 Jacques Herbin 的品牌历史与书写用品范围。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0e4"/><stop offset="1" stop-color="#e8d6bd"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7d1f32"/><stop offset="1" stop-color="#b94555"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="105" font-family="Arial,'PingFang SC',sans-serif" font-size="58" font-weight="700" fill="#3d2924">Jacques Herbin</text>
  <text x="92" y="155" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#70574c">从封蜡与墨水传统，走到可日用的透明钢笔</text>
  <rect x="110" y="265" width="250" height="300" rx="30" fill="#faf7f0" stroke="#76594c" stroke-width="9"/>
  <path d="M155 265v-70h160v70" fill="none" stroke="#76594c" stroke-width="18"/>
  <rect x="145" y="350" width="180" height="170" rx="12" fill="url(#ink)" opacity=".92"/>
  <path d="M500 330h700l160 65-160 65H500c-52 0-52-130 0-130z" fill="#f8fbfb" stroke="#594f49" stroke-width="10"/>
  <path d="M1200 330l160 65-160 65z" fill="#d3b376" stroke="#594f49" stroke-width="8"/>
  <path d="M500 330v130" stroke="#b94555" stroke-width="18"/>
  <text x="500" y="285" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#5d4a41">透明钢笔轮廓：书写工具只是品牌版图的一部分</text>
  <line x1="160" y1="650" x2="1360" y2="650" stroke="#a88d73" stroke-width="6"/>
  <circle cx="280" cy="650" r="18" fill="#7d1f32"/><circle cx="700" cy="650" r="18" fill="#7d1f32"/><circle cx="1120" cy="650" r="18" fill="#7d1f32"/>
  <text x="210" y="710" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#3d2924">1670</text><text x="170" y="747" font-family="Arial,'PingFang SC',sans-serif" font-size="22" fill="#70574c">Maison Herbin 起点</text>
  <text x="635" y="710" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#3d2924">1798</text><text x="590" y="747" font-family="Arial,'PingFang SC',sans-serif" font-size="22" fill="#70574c">开始生产书写墨水</text>
  <text x="1055" y="710" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#3d2924">22000T</text><text x="1000" y="747" font-family="Arial,'PingFang SC',sans-serif" font-size="22" fill="#70574c">透明 pump 钢笔</text>
  <rect x="72" y="810" width="1456" height="55" rx="16" fill="#3d2924"/>
  <text x="800" y="847" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#fff8eb">本站原创事实示意图；非产品照片，不表示真实颜色、纹理、比例、商标或包装。</text>
</svg>
