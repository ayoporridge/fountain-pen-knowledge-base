<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kakimori Aluminium Fountain Pen 事实示意图</title>
  <desc id="desc">细长磨砂铝钢笔轮廓，标示尺寸、重量、笔尖和不套帽边界。</desc>
  <defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#626b6a"/><stop offset=".5" stop-color="#1f2525"/><stop offset="1" stop-color="#4c5554"/></linearGradient></defs>
  <rect width="1600" height="900" fill="#e7ece9"/>
  <text x="90" y="105" font-family="Arial,'PingFang SC',sans-serif" font-size="52" font-weight="700" fill="#1f2927">Kakimori Aluminium Fountain Pen</text>
  <text x="92" y="153" font-family="Arial,'PingFang SC',sans-serif" font-size="24" fill="#5d6b67">细长、轻量、磨砂铝；按设计取帽书写</text>
  <rect x="125" y="300" width="990" height="116" rx="58" fill="url(#metal)"/>
  <path d="M1115 300h150l210 58-210 58h-150z" fill="#d7dbd2" stroke="#28322f" stroke-width="8"/>
  <path d="M1265 300l210 58-210 58 55-58z" fill="#b5a26d"/>
  <path d="M210 285v-54h540" fill="none" stroke="#9aaba5" stroke-width="9"/>
  <text x="215" y="215" font-family="Arial,'PingFang SC',sans-serif" font-size="23" fill="#43514d">实心金属笔夹 · 笔帽不能套尾</text>
  <line x1="125" y1="490" x2="1475" y2="490" stroke="#70817c" stroke-width="4"/>
  <line x1="125" y1="470" x2="125" y2="510" stroke="#70817c" stroke-width="4"/><line x1="1475" y1="470" x2="1475" y2="510" stroke="#70817c" stroke-width="4"/>
  <text x="800" y="540" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#1f2927">长 133 mm · 直径 10 mm · 16 g</text>
  <rect x="130" y="615" width="300" height="95" rx="18" fill="#fff"/><text x="280" y="655" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#1f2927">F / M 不锈钢尖</text><text x="280" y="688" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#5d6b67">德国制造</text>
  <rect x="500" y="615" width="300" height="95" rx="18" fill="#fff"/><text x="650" y="655" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#1f2927">铝制笔身</text><text x="650" y="688" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#5d6b67">日本制造</text>
  <rect x="870" y="615" width="300" height="95" rx="18" fill="#fff"/><text x="1020" y="655" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#1f2927">随附转换器</text><text x="1020" y="688" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#5d6b67">备用耗材按实物确认</text>
  <rect x="1240" y="615" width="230" height="95" rx="18" fill="#fff"/><text x="1355" y="655" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#1f2927">磨砂表面</text><text x="1355" y="688" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#5d6b67">减少指纹</text>
  <rect x="72" y="810" width="1456" height="55" rx="16" fill="#1f2927"/>
  <text x="800" y="847" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#fff">本站原创事实示意图；非产品照片，不表示真实颜色、纹理、比例、商标或包装。</text>
</svg>
