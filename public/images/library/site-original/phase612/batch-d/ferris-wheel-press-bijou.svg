    <linearGradient id="pen" x2="1"><stop stop-color="#9d174d"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <style>.s{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.h{font-size:50px;font-weight:760;fill:#831843}.k{font-size:27px;fill:#be185d}.v{font-size:35px;font-weight:700;fill:#831843}.n{font-size:23px;fill:#755062}.o{stroke:#831843;stroke-width:8;stroke-linejoin:round}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="68" y="58" width="1464" height="784" rx="34" fill="#fffdfb" stroke="#f9a8d4" stroke-width="3"/>
