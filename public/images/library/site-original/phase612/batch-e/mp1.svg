<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monteverde MP1 活塞钢笔结构事实示意图</title>
  <desc id="desc">以透明钢笔剖面说明 MP1 的内置活塞、Lock-It 尾钮、瓶装墨供墨、六号钢尖，并强调 MP1 不是 MVP。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c38"/><stop offset="1" stop-color="#157b73"/></linearGradient><linearGradient id="ink"><stop stop-color="#36ddd0" stop-opacity=".82"/><stop offset="1" stop-color="#177e9c" stop-opacity=".85"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="104" fill="#8ee2d7" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">透明墨仓 · Lock-It 活塞</text>
  <text x="88" y="180" fill="#fff" font-size="74" font-family="Arial, PingFang SC, sans-serif" font-weight="800">Monteverde MP1</text>
  <text x="90" y="230" fill="#cef0eb" font-size="28" font-family="Arial, PingFang SC, sans-serif">品牌首支内置活塞钢笔，只从瓶装墨吸墨</text>
  <g transform="translate(80 324)">
    <rect x="0" y="80" width="254" height="118" rx="48" fill="#a8b9bd" stroke="#eaf7f5" stroke-width="5"/>
    <rect x="254" y="86" width="666" height="106" rx="44" fill="#e8fbf8" fill-opacity=".28" stroke="#efffff" stroke-width="5"/>
    <rect x="334" y="102" width="474" height="74" rx="35" fill="url(#ink)"/>
    <rect x="806" y="94" width="36" height="90" rx="12" fill="#d9e9e7"/>
    <path d="M842 110 H920" stroke="#e9f7f4" stroke-width="12"/>
    <path d="M920 96 L1080 139 L920 182 Z" fill="#d9bd78" stroke="#fff" stroke-width="5"/>
    <path d="M966 112 V166" stroke="#6d5830" stroke-width="5"/>
    <rect x="18" y="54" width="84" height="170" rx="26" fill="none" stroke="#ffd28c" stroke-width="6"/>
    <text x="60" y="270" text-anchor="middle" fill="#ffdda5" font-size="24" font-family="Arial, PingFang SC, sans-serif">锁定尾钮</text>
    <text x="562" y="250" text-anchor="middle" fill="#d6f5f0" font-size="24" font-family="Arial, PingFang SC, sans-serif">可视墨仓 / 内置活塞</text>
  </g>
  <g transform="translate(1184 320)" font-family="Arial, PingFang SC, sans-serif">
    <rect width="326" height="382" rx="28" fill="#061d25" fill-opacity=".5" stroke="#9ce1d8" stroke-width="3"/>
    <text x="28" y="58" fill="#fff" font-size="29" font-weight="800">使用边界</text>
    <text x="28" y="112" fill="#d9f4ef" font-size="24">JoWo #6 钢尖</text>
    <text x="28" y="154" fill="#d9f4ef" font-size="23">EF / F / M / B / Stub / Flex</text>
    <text x="28" y="206" fill="#ffe0a9" font-size="23" font-weight="700">不装墨囊或转换器</text>
    <text x="28" y="252" fill="#ffe0a9" font-size="23">不要旋下前段</text>
    <path d="M28 286 H296" stroke="#76cfc4" stroke-width="3"/>
    <text x="28" y="332" fill="#fff" font-size="24" font-weight="700">MP1 ≠ MVP</text>
    <text x="28" y="364" fill="#d9f4ef" font-size="21">活塞款不是口袋滴入式</text>
  </g>
  <rect x="82" y="786" width="620" height="72" rx="22" fill="#eefaf8"/>
  <text x="392" y="832" text-anchor="middle" fill="#10333a" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创结构示意 · 非产品照片</text>
  <text x="1512" y="832" text-anchor="end" fill="#cdf0ea" font-size="23" font-family="Arial, PingFang SC, sans-serif">墨量与重量按具体版本核对</text>
</svg>
