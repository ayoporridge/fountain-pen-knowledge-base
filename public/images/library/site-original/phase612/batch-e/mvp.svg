<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monteverde MVP 口袋钢笔双供墨结构示意图</title>
  <desc id="desc">以短钢笔轮廓和两条供墨路径说明 MVP 可使用短国际墨囊或约 2.5 ml 滴入式笔杆，并强调它不是活塞 MP1。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#281d35"/><stop offset="1" stop-color="#4d6cb2"/></linearGradient><linearGradient id="resin"><stop stop-color="#e7d4ff"/><stop offset=".45" stop-color="#86aaf2"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="104" fill="#c9c5f2" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">Monte Verde Pocket · 双供墨</text>
  <text x="88" y="180" fill="#fff" font-size="74" font-family="Arial, PingFang SC, sans-serif" font-weight="800">Monteverde MVP</text>
  <text x="90" y="230" fill="#deddf5" font-size="28" font-family="Arial, PingFang SC, sans-serif">合帽约 102 mm，后插约 137 mm</text>
  <g transform="translate(86 320)">
    <rect x="0" y="82" width="336" height="116" rx="54" fill="url(#resin)" stroke="#fff" stroke-width="5"/>
    <rect x="408" y="88" width="438" height="104" rx="46" fill="url(#resin)" stroke="#fff" stroke-width="5"/>
    <path d="M846 100 L1004 140 L846 180 Z" fill="#d9c38c" stroke="#fff" stroke-width="5"/>
    <path d="M892 112 V168" stroke="#6d5b35" stroke-width="5"/>
    <path d="M86 104 C140 80 194 210 262 112" fill="none" stroke="#7c5daa" stroke-width="12" stroke-opacity=".55"/>
    <text x="168" y="258" text-anchor="middle" fill="#e6e4fa" font-size="24" font-family="Arial, PingFang SC, sans-serif">短帽可后插</text>
  </g>
  <g transform="translate(1100 308)" font-family="Arial, PingFang SC, sans-serif">
    <rect width="410" height="400" rx="28" fill="#171127" fill-opacity=".5" stroke="#cbc8ef" stroke-width="3"/>
    <text x="32" y="58" fill="#fff" font-size="30" font-weight="800">两种供墨，二选一</text>
    <rect x="34" y="92" width="342" height="92" rx="20" fill="#fff" fill-opacity=".1"/>
    <text x="56" y="132" fill="#fff" font-size="25" font-weight="700">A · 短国际墨囊</text>
    <text x="56" y="164" fill="#dddaf4" font-size="21">方便换色与出行</text>
    <rect x="34" y="204" width="342" height="110" rx="20" fill="#7393dd" fill-opacity=".25"/>
    <text x="56" y="246" fill="#fff" font-size="25" font-weight="700">B · 滴入式笔杆</text>
    <text x="56" y="280" fill="#dddaf4" font-size="22">约 2.5 ml，先检查密封</text>
    <text x="34" y="358" fill="#ffd2a0" font-size="24" font-weight="800">MVP ≠ MP1 活塞钢笔</text>
  </g>
  <rect x="82" y="786" width="620" height="72" rx="22" fill="#f5f2ff"/>
  <text x="392" y="832" text-anchor="middle" fill="#2b2140" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创结构示意 · 非产品照片</text>
  <text x="1512" y="832" text-anchor="end" fill="#e4e2f7" font-size="23" font-family="Arial, PingFang SC, sans-serif">不表示真实树脂花纹或比例</text>
</svg>
