<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monteverde Innova Ombre Fusion 钢笔版本事实示意图</title>
  <desc id="desc">用渐变钢笔轮廓说明 Ombre Fusion 的金属漆面、碳纤维中环、六号钢尖、墨囊转换器及三种配色名称。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27213f"/><stop offset=".55" stop-color="#6a4073"/><stop offset="1" stop-color="#b86f83"/></linearGradient><linearGradient id="ombre"><stop stop-color="#f2cc82"/><stop offset=".45" stop-color="#9a7fe5"/><stop offset="1" stop-color="#e7f0ff"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="104" fill="#f2c6db" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">渐变漆面 · 碳纤维中环</text>
  <text x="88" y="178" fill="#fff" font-size="60" font-family="Arial, PingFang SC, sans-serif" font-weight="800">Monteverde Innova Ombre Fusion</text>
  <text x="90" y="230" fill="#f1dbe8" font-size="28" font-family="Arial, PingFang SC, sans-serif">Bliss、Charm、Harmony 是配色版本，不是三个型号</text>
  <g transform="translate(86 326)">
    <rect x="0" y="78" width="346" height="120" rx="56" fill="url(#ombre)" stroke="#fff" stroke-width="5"/>
    <rect x="334" y="76" width="54" height="124" fill="#23232b" stroke="#dad8de" stroke-width="4"/>
    <path d="M344 82 l40 40 m-40 0 l40 40 m-40 0 l30 30" stroke="#777785" stroke-width="5"/>
    <rect x="388" y="82" width="516" height="112" rx="48" fill="url(#ombre)" stroke="#fff" stroke-width="5"/>
    <path d="M904 92 L1060 138 L904 184 Z" fill="#e6cc8a" stroke="#fff" stroke-width="5"/>
    <path d="M950 108 V168" stroke="#745e35" stroke-width="5"/>
    <text x="364" y="254" text-anchor="middle" fill="#fff" font-size="24" font-family="Arial, PingFang SC, sans-serif">碳纤维环</text>
  </g>
  <g transform="translate(1170 322)" font-family="Arial, PingFang SC, sans-serif">
    <rect width="340" height="374" rx="28" fill="#251e35" fill-opacity=".55" stroke="#f1c8dc" stroke-width="3"/>
    <text x="30" y="58" fill="#fff" font-size="29" font-weight="800">当前钢笔事实</text>
    <text x="30" y="110" fill="#f7e4ee" font-size="24">JoWo #6 钢尖</text>
    <text x="30" y="150" fill="#f7e4ee" font-size="23">EF 至 Flex 六种尖幅</text>
    <text x="30" y="198" fill="#f7e4ee" font-size="23">国际墨囊 / 转换器</text>
    <text x="30" y="246" fill="#f7e4ee" font-size="23">Bliss 样本约 44.7 g</text>
    <path d="M30 280 H308" stroke="#f3aece" stroke-width="3"/>
    <text x="30" y="326" fill="#ffd6a8" font-size="22">颜色效果以实物为准</text>
  </g>
  <rect x="82" y="786" width="620" height="72" rx="22" fill="#fff" fill-opacity=".91"/>
  <text x="392" y="832" text-anchor="middle" fill="#39223d" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创事实示意 · 非产品照片</text>
  <text x="1512" y="832" text-anchor="end" fill="#f6dce9" font-size="23" font-family="Arial, PingFang SC, sans-serif">图中渐变不是颜色校样</text>
</svg>
