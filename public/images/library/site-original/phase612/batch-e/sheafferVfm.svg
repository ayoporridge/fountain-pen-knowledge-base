<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sheaffer VFM 细身钢笔供墨边界事实示意图</title>
  <desc id="desc">以细身钢笔轮廓说明 Sheaffer VFM 使用短国际墨囊、不支持常规转换器，并与 100、300 及同名圆珠笔分开。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14252c"/><stop offset="1" stop-color="#397b79"/></linearGradient><linearGradient id="mint"><stop stop-color="#d8f4ee"/><stop offset=".5" stop-color="#6ebeb6"/><stop offset="1" stop-color="#eefbf8"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="104" fill="#a7ddd6" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">细身入门钢笔 · 墨囊专用</text>
  <text x="88" y="180" fill="#fff" font-size="76" font-family="Georgia, PingFang SC, serif" font-weight="700">Sheaffer VFM</text>
  <text x="90" y="230" fill="#d4efeb" font-size="28" font-family="Arial, PingFang SC, sans-serif">“Universal ink cartridges only” 是供墨边界，不要套用 100/300 转换器</text>
  <g transform="translate(82 332)">
    <rect x="0" y="90" width="386" height="92" rx="42" fill="url(#mint)" stroke="#fff" stroke-width="5"/>
    <path d="M96 92 V54 Q96 38 114 38 H312" fill="none" stroke="#e8f4f2" stroke-width="7"/>
    <circle cx="118" cy="82" r="9" fill="#fff"/>
    <rect x="386" y="96" width="450" height="80" rx="38" fill="#e6f8f4" fill-opacity=".48" stroke="#fff" stroke-width="5"/>
    <path d="M836 101 L990 136 L836 171 Z" fill="#d9bf80" stroke="#fff" stroke-width="5"/>
    <path d="M880 112 V160" stroke="#6c5832" stroke-width="5"/>
    <path d="M522 116 H682" stroke="#235f62" stroke-width="24" stroke-linecap="round"/>
    <text x="602" y="232" text-anchor="middle" fill="#d7f0ed" font-size="24" font-family="Arial, PingFang SC, sans-serif">短国际墨囊</text>
  </g>
  <g transform="translate(1116 318)" font-family="Arial, PingFang SC, sans-serif">
    <rect width="394" height="386" rx="28" fill="#07191e" fill-opacity=".46" stroke="#a9ddd6" stroke-width="3"/>
    <text x="32" y="58" fill="#fff" font-size="30" font-weight="800">VFM 的关键区别</text>
    <text x="32" y="112" fill="#ddf3f0" font-size="24">钢尖：Fine / Medium</text>
    <text x="32" y="156" fill="#ddf3f0" font-size="24">样本约 20 g</text>
    <rect x="30" y="190" width="334" height="72" rx="18" fill="#d36f5c" fill-opacity=".28" stroke="#ffc7b8" stroke-width="2"/>
    <text x="52" y="236" fill="#ffd9d0" font-size="24" font-weight="800">不支持常规转换器</text>
    <text x="32" y="310" fill="#fff" font-size="23" font-weight="700">VFM ≠ 100 ≠ 300</text>
    <text x="32" y="350" fill="#d9f0ed" font-size="21">圆珠笔 / rollerball 也另算</text>
  </g>
  <rect x="82" y="786" width="620" height="72" rx="22" fill="#eff9f7"/>
  <text x="392" y="832" text-anchor="middle" fill="#18343a" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创事实示意 · 非产品照片</text>
  <text x="1512" y="832" text-anchor="end" fill="#d6efeb" font-size="23" font-family="Arial, PingFang SC, sans-serif">饰面颜色以具体 SKU 为准</text>
</svg>
