<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monteverde Dakota 钢笔身份与结构事实示意图</title>
  <desc id="desc">以金属钢笔轮廓说明 Dakota 的 Slip-In 笔帽、五号钢尖、墨囊转换器和钢笔与 gel pen 的边界。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20291f"/><stop offset="1" stop-color="#667449"/></linearGradient><linearGradient id="steel"><stop stop-color="#f1f2e8"/><stop offset=".45" stop-color="#adb6a5"/><stop offset="1" stop-color="#f6f4df"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="104" fill="#d5dcaa" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">C-47 主题 · 金属钢笔</text>
  <text x="88" y="180" fill="#fff" font-size="72" font-family="Georgia, PingFang SC, serif" font-weight="700">Monteverde Dakota</text>
  <text x="90" y="230" fill="#e4e8cb" font-size="28" font-family="Arial, PingFang SC, sans-serif">Slip-In Cap 是插拔帽结构，不是旋帽</text>
  <g transform="translate(84 332)">
    <rect x="0" y="74" width="386" height="116" rx="48" fill="url(#steel)" stroke="#fff" stroke-width="5"/>
    <path d="M56 77 V40 Q56 20 78 20 H326 Q348 20 348 40 V77" fill="none" stroke="#cdd6b1" stroke-width="8"/>
    <rect x="458" y="82" width="410" height="100" rx="42" fill="#364932" stroke="#eef2dd" stroke-width="5"/>
    <path d="M868 92 L1022 132 L868 172 Z" fill="#d7c88d" stroke="#fff" stroke-width="5"/>
    <path d="M912 106 V158" stroke="#716540" stroke-width="5"/>
    <path d="M423 45 V220" stroke="#e3e8c9" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="330" y="262" fill="#f5f4dc" font-size="25" font-family="Arial, PingFang SC, sans-serif">插拔帽接合区</text>
  </g>
  <g transform="translate(1116 328)" font-family="Arial, PingFang SC, sans-serif">
    <rect width="394" height="356" rx="28" fill="#12180f" fill-opacity=".43" stroke="#dce5bb" stroke-width="3"/>
    <text x="32" y="58" fill="#fff" font-size="31" font-weight="800">钢笔版</text>
    <text x="32" y="110" fill="#edf0d7" font-size="25">JoWo #5：EF / F / M</text>
    <text x="32" y="156" fill="#edf0d7" font-size="25">国际墨囊 / 转换器</text>
    <text x="32" y="202" fill="#edf0d7" font-size="25">样本：121 → 156 mm</text>
    <path d="M32 236 H360" stroke="#d6a66e" stroke-width="3"/>
    <text x="32" y="282" fill="#ffd6a1" font-size="25" font-weight="700">Liquid Ink Gel Pen</text>
    <text x="32" y="322" fill="#ffd6a1" font-size="23">是同名兄弟，不继承钢笔规格</text>
  </g>
  <rect x="82" y="786" width="620" height="72" rx="22" fill="#f7f7e8"/>
  <text x="392" y="832" text-anchor="middle" fill="#253022" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创事实示意 · 非产品照片</text>
  <text x="1512" y="832" text-anchor="end" fill="#e7ebd3" font-size="23" font-family="Arial, PingFang SC, sans-serif">表面版本需按 SKU 核对</text>
</svg>
