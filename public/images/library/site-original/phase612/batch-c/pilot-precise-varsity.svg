    <linearGradient id="ink" x1="0" x2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.label{font-size:28px;fill:#35515a}.value{font-size:38px;font-weight:700;fill:#102f3a}.small{font-size:24px;fill:#567079}.line{stroke:#163d4a;stroke-width:9;stroke-linejoin:round}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="62" width="1460" height="776" rx="34" fill="#fbfdfc" stroke="#b5cbc7" stroke-width="3"/>
