<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pilot Explorer 型号事实卡</title>
  <desc id="desc">原创事实示意图，以通用钢笔、墨囊和转换器图标说明 Explorer 的轻量、F/M 钢尖及包装时间差；不是产品照片。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf2ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient><style>.s{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.h{font-size:52px;font-weight:750;fill:#172554}.k{font-size:28px;fill:#415a8a}.v{font-size:37px;font-weight:700;fill:#172554}.n{font-size:24px;fill:#526a93}.ol{stroke:#1e3a8a;stroke-width:8;stroke-linejoin:round}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="70" y="62" width="1460" height="776" rx="34" fill="#fbfdff" stroke="#b8c8e8" stroke-width="3"/>
  <text x="125" y="145" class="s h">PILOT EXPLORER</text><text x="125" y="190" class="s k">轻量 cartridge／converter 钢笔 · 型号事实卡</text>
  <g transform="translate(120 250)"><rect width="930" height="176" rx="82" fill="#dbeafe" class="ol"/><path d="M930 0 L1090 88 L930 176 Z" fill="#f2c66d" class="ol"/><path d="M1090 88 l52 -20 l-31 34 l31 29 z" fill="#1e3a8a"/><rect x="60" y="42" width="510" height="92" rx="45" fill="#93c5fd"/><path d="M720 27 v122" stroke="#1e3a8a" stroke-width="7"/><text x="210" y="102" class="s v">轻量流线笔身</text></g>
  <g transform="translate(1150 250)"><rect width="88" height="176" rx="34" fill="#bfdbfe" class="ol"/><rect x="24" y="-24" width="40" height="35" rx="6" fill="#1e3a8a"/><text x="44" y="218" text-anchor="middle" class="s n">墨囊</text><path d="M160 0 h88 v176 h-88 z" fill="#e0e7ff" class="ol"/><path d="M178 28 h52 v105 h-52 z" fill="#60a5fa"/><text x="204" y="218" text-anchor="middle" class="s n">converter</text></g>
  <rect x="125" y="520" width="390" height="165" rx="25" fill="#e0e7ff"/><text x="165" y="570" class="s k">笔尖</text><text x="165" y="625" class="s v">F ／ M 钢尖</text><text x="165" y="660" class="s n">当前美国官网配置</text>
  <rect x="550" y="520" width="390" height="165" rx="25" fill="#dbeafe"/><text x="590" y="570" class="s k">重量参考</text><text x="590" y="625" class="s v">样本约 11.9 g</text><text x="590" y="660" class="s n">独立评测样本，不冒充公差</text>
  <rect x="975" y="520" width="430" height="165" rx="25" fill="#fef3c7"/><text x="1015" y="570" class="s k">包装边界</text><text x="1015" y="625" class="s v">converter 会随年份变化</text><text x="1015" y="660" class="s n">以 exact 盒装清单为准</text>
  <rect x="125" y="731" width="1280" height="59" rx="14" fill="#1e3a8a"/><text x="165" y="770" class="s" font-size="25" fill="#fff">不并入 Metropolitan／MR、Lightive、Prera、Kakuno；也不作 eyedropper</text>
  <text x="1405" y="805" text-anchor="end" class="s n">本站原创事实示意 · 非产品照片 · 不按比例</text>
