<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tom Hessin 钢笔品牌事实示意图</title>
  <desc id="desc">说明 Tom Hessin 钢笔品牌的 Birmingham 1870 年家族故事与当代复兴，并明确它不是 Tom's Studio。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b22"/><stop offset="1" stop-color="#414a56"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="92" y="112" fill="#d6bb7c" font-size="30" font-family="Arial, PingFang SC, sans-serif" font-weight="700">品牌身份卡</text>
  <text x="92" y="190" fill="#fff" font-size="76" font-family="Georgia, PingFang SC, serif" font-weight="700">Tom Hessin</text>
  <text x="94" y="244" fill="#dce1e7" font-size="30" font-family="Arial, PingFang SC, sans-serif">Birmingham 1870 家族故事 · 当代品牌复兴</text>
  <g transform="translate(90 330)">
    <rect x="0" y="8" width="830" height="160" rx="80" fill="#c8cdd2"/>
    <path d="M830 28 L1035 88 L830 148 Z" fill="#f2f3f4"/>
    <path d="M980 71 L1074 88 L980 105 Z" fill="#d6bb7c"/>
    <g fill="#303844" stroke="#d6bb7c" stroke-width="4">
      <path d="M110 52 l24 36 -24 36 -24-36z"/><path d="M168 52 l24 36 -24 36 -24-36z"/><path d="M226 52 l24 36 -24 36 -24-36z"/><path d="M284 52 l24 36 -24 36 -24-36z"/><path d="M342 52 l24 36 -24 36 -24-36z"/>
    </g>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="1030" y="306" width="470" height="82" rx="20" fill="#fff" opacity=".10"/>
    <text x="1060" y="358" fill="#fff" font-size="30" font-weight="700">五枚菱形：家族五代符号</text>
    <rect x="1030" y="414" width="470" height="82" rx="20" fill="#fff" opacity=".10"/>
    <text x="1060" y="466" fill="#fff" font-size="30" font-weight="700">代表系列：Charles</text>
    <rect x="1030" y="522" width="470" height="82" rx="20" fill="#7c3434"/>
    <text x="1060" y="574" fill="#fff" font-size="30" font-weight="800">不是 Tom's Studio</text>
  </g>
  <line x1="92" y1="694" x2="1508" y2="694" stroke="#d6bb7c" stroke-width="2" opacity=".6"/>
  <text x="92" y="754" fill="#fff" font-size="29" font-family="Arial, PingFang SC, sans-serif">读图重点：品牌相似词不代表同一家公司，网址与完整名称要一起核对。</text>
  <rect x="92" y="797" width="520" height="58" rx="29" fill="#d6bb7c"/>
  <text x="352" y="835" text-anchor="middle" fill="#171b22" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创事实示意 · 非产品照片</text>
</svg>
