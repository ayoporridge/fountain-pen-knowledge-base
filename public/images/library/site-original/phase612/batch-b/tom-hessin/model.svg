<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tom Hessin Charles 钢笔型号事实示意图</title>
  <desc id="desc">说明 Charles 钢笔的欧洲树脂、六号不锈钢尖、标准国际墨囊转换器与五菱形家族符号，并注明不是 Tom's Studio。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b23"/><stop offset="1" stop-color="#4e2930"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="106" fill="#d9bf81" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">现代树脂钢笔 · 身份事实</text>
  <text x="88" y="178" fill="#fff" font-size="68" font-family="Georgia, PingFang SC, serif" font-weight="700">Tom Hessin Charles</text>
  <text x="90" y="230" fill="#e1e2e6" font-size="28" font-family="Arial, PingFang SC, sans-serif">五枚菱形象征五代家族；1870 是品牌故事起点，不是本款首发年</text>
