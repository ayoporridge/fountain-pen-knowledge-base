  <text x="92" y="770" fill="#fff" font-size="27" font-family="Arial, PingFang SC, sans-serif">特殊磨尖是另购配置；颜色、众筹赠品和软木盒不构成新型号。</text>
  <rect x="92" y="808" width="520" height="58" rx="29" fill="#f0c65e"/>
  <text x="352" y="846" text-anchor="middle" fill="#0c2731" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创结构示意 · 非产品照片</text>
