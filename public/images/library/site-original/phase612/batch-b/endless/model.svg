<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Endless Phantom Retractable 钢笔结构事实示意图</title>
  <desc id="desc">用清楚的按键、滑动笔尖和密封门示意 Phantom 可伸缩钢笔结构，并列出 EF F M 和墨囊转换器事实。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2731"/><stop offset="1" stop-color="#18556a"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="106" fill="#9de2ee" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">按动式钢笔 · 结构事实</text>
  <text x="88" y="178" fill="#fff" font-size="66" font-family="Arial, PingFang SC, sans-serif" font-weight="800">Endless Phantom Retractable</text>
  <text x="90" y="230" fill="#c9eaf0" font-size="28" font-family="Arial, PingFang SC, sans-serif">按一下出尖，再按一下收回；前端密封状态需要到手检查</text>
  <g transform="translate(85 304)">
