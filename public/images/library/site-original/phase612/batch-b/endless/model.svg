    <rect x="52" y="54" width="840" height="148" rx="74" fill="#b9d7dc" stroke="#e8fafc" stroke-width="5"/>
    <rect x="720" y="54" width="172" height="148" rx="74" fill="#6aabb6"/>
    <path d="M892 76 L1100 128 L892 180 Z" fill="#eef9fa"/>
    <path d="M1030 111 L1125 128 L1030 145 Z" fill="#e3b64a"/>
    <path d="M1110 75 Q1166 128 1110 181" fill="none" stroke="#f58a72" stroke-width="16" stroke-linecap="round"/>
    <text x="18" y="36" fill="#f0c65e" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="700">按键</text>
    <text x="944" y="42" fill="#fff" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="700">伸缩笔尖</text>
    <text x="1118" y="221" fill="#f6b3a5" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="700">密封门示意</text>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="92" y="604" width="338" height="104" rx="22" fill="#fff" opacity=".12"/>
    <text x="120" y="647" fill="#9de2ee" font-size="24" font-weight="700">标准笔尖</text><text x="120" y="688" fill="#fff" font-size="32" font-weight="800">EF · F · M</text>
    <rect x="458" y="604" width="440" height="104" rx="22" fill="#fff" opacity=".12"/>
    <text x="486" y="647" fill="#9de2ee" font-size="24" font-weight="700">供墨</text><text x="486" y="688" fill="#fff" font-size="30" font-weight="800">墨囊 / 随附转换器</text>
    <rect x="926" y="604" width="582" height="104" rx="22" fill="#fff" opacity=".12"/>
