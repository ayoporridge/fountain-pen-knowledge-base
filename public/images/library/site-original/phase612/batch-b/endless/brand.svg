<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Endless Stationery 品牌事实示意图</title>
  <desc id="desc">说明 Endless 是印度 Chennai 文具品牌，产品包括纸品、墨水、钢笔与配件；图中钢笔仅为示意轮廓。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10273f"/><stop offset="1" stop-color="#1f5361"/></linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9eff2"/><stop offset="1" stop-color="#7fc7d1"/></linearGradient>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="92" y="112" fill="#9edce4" font-size="30" font-family="Arial, PingFang SC, sans-serif" font-weight="700">品牌事实卡</text>
  <text x="92" y="190" fill="#fff" font-size="72" font-family="Arial, PingFang SC, sans-serif" font-weight="800">Endless Stationery</text>
  <text x="94" y="244" fill="#c4e4e8" font-size="30" font-family="Arial, PingFang SC, sans-serif">印度 Chennai 的综合文具品牌</text>
  <g transform="translate(90 330)">
    <rect x="0" y="0" width="850" height="170" rx="85" fill="url(#pen)" opacity=".94"/>
    <path d="M850 22 L1060 85 L850 148 Z" fill="#eef9fa"/>
    <path d="M1005 67 L1098 85 L1005 103 Z" fill="#f5c565"/>
    <rect x="126" y="18" width="18" height="134" rx="9" fill="#2d6d78" opacity=".7"/>
    <path d="M44 38 H310" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".45"/>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="1030" y="316" width="470" height="76" rx="20" fill="#fff" opacity=".12"/>
    <text x="1060" y="365" fill="#fff" font-size="30" font-weight="700">纸品 · 墨水 · 钢笔 · 配件</text>
    <rect x="1030" y="416" width="470" height="76" rx="20" fill="#fff" opacity=".12"/>
    <text x="1060" y="465" fill="#fff" font-size="30" font-weight="700">代表型号：Phantom Retractable</text>
    <rect x="1030" y="516" width="470" height="76" rx="20" fill="#fff" opacity=".12"/>
    <text x="1060" y="565" fill="#fff" font-size="30" font-weight="700">Creator、Captiva 不是 Phantom 版本</text>
  </g>
  <line x1="92" y1="692" x2="1508" y2="692" stroke="#8bd1db" stroke-width="2" opacity=".55"/>
  <text x="92" y="754" fill="#fff" font-size="29" font-family="Arial, PingFang SC, sans-serif">读图重点：这是品牌导航，不把不同产品线混成一个型号。</text>
  <rect x="92" y="797" width="520" height="58" rx="29" fill="#f5c565"/>
  <text x="352" y="835" text-anchor="middle" fill="#10273f" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创事实示意 · 非产品照片</text>
</svg>
