<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Marlen 钢笔品牌事实示意图</title>
  <desc id="desc">说明 Marlen 钢笔品牌于 1982 年创立于意大利 Campania，并以材料和主题系列构成产品线。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10322d"/><stop offset="1" stop-color="#2d6957"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="92" y="112" fill="#a7dbc4" font-size="30" font-family="Arial, PingFang SC, sans-serif" font-weight="700">品牌事实卡</text>
  <text x="92" y="190" fill="#f5fff8" font-size="78" font-family="Georgia, PingFang SC, serif" font-weight="700">Marlen</text>
  <text x="94" y="244" fill="#c9eadb" font-size="30" font-family="Arial, PingFang SC, sans-serif">1982 · Campania · Made in Italy</text>
  <g transform="translate(90 326)">
    <rect x="0" y="12" width="830" height="164" rx="82" fill="#dfe9df"/>
    <rect x="150" y="12" width="46" height="164" fill="#b4403b"/>
    <path d="M830 34 L1034 94 L830 154 Z" fill="#f3f0df"/>
    <path d="M974 78 L1072 94 L974 110 Z" fill="#caa34e"/>
    <circle cx="76" cy="94" r="45" fill="#1d5548"/>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="1030" y="306" width="470" height="82" rx="20" fill="#fff" opacity=".12"/>
    <text x="1060" y="358" fill="#fff" font-size="30" font-weight="700">家族企业 · 第二代经营</text>
    <rect x="1030" y="414" width="470" height="82" rx="20" fill="#fff" opacity=".12"/>
    <text x="1060" y="466" fill="#fff" font-size="30" font-weight="700">树脂、金属等用料按型号核对</text>
    <rect x="1030" y="522" width="470" height="82" rx="20" fill="#fff" opacity=".12"/>
    <text x="1060" y="574" fill="#fff" font-size="30" font-weight="700">代表型号：M20</text>
  </g>
  <line x1="92" y1="694" x2="1508" y2="694" stroke="#a7dbc4" stroke-width="2" opacity=".6"/>
  <text x="92" y="754" fill="#f5fff8" font-size="29" font-family="Arial, PingFang SC, sans-serif">读图重点：品牌会使用多种材料，不能让每个型号自动继承全部用料。</text>
  <rect x="92" y="797" width="520" height="58" rx="29" fill="#d8b85b"/>
  <text x="352" y="835" text-anchor="middle" fill="#10322d" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创事实示意 · 非产品照片</text>
</svg>
