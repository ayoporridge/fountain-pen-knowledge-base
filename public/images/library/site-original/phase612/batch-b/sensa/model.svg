<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sensa Sensagraph 型号事实示意图</title>
  <desc id="desc">说明 Sensagraph 钢笔的六边形铝身、Plasmium 缓冲握位、不锈钢 EF F M B 和墨囊转换器结构。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171d3b"/><stop offset="1" stop-color="#514b7c"/></linearGradient></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="88" y="106" fill="#c5c1f1" font-size="29" font-family="Arial, PingFang SC, sans-serif" font-weight="700">几何笔身 · 缓冲握位</text>
  <text x="88" y="178" fill="#fff" font-size="70" font-family="Arial, PingFang SC, sans-serif" font-weight="800">Sensa Sensagraph</text>
  <text x="90" y="230" fill="#dedcf6" font-size="28" font-family="Arial, PingFang SC, sans-serif">六边形铝制帽身，减少滚动；握位手感需要亲自试写</text>
  <g transform="translate(86 308)">
    <path d="M64 44 H760 L826 126 L760 208 H64 L0 126 Z" fill="#c5c8d8" stroke="#f1f2fb" stroke-width="5"/>
    <rect x="520" y="55" width="244" height="142" rx="70" fill="#7772a9"/>
    <path d="M826 66 L1032 126 L826 186 Z" fill="#f1f2f9"/>
    <path d="M975 109 L1070 126 L975 143 Z" fill="#d5b853"/>
    <text x="642" y="136" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial, PingFang SC, sans-serif" font-weight="800">Plasmium</text>
    <g transform="translate(1138 62)" fill="#7b77ad" stroke="#d9d7f3" stroke-width="4"><path d="M60 0 H170 L220 64 L170 128 H60 L10 64 Z"/></g>
    <text x="1253" y="232" text-anchor="middle" fill="#d9d7f3" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">六边形截面</text>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="92" y="604" width="390" height="104" rx="22" fill="#fff" opacity=".12"/>
    <text x="120" y="647" fill="#c5c1f1" font-size="24" font-weight="700">笔尖</text><text x="120" y="688" fill="#fff" font-size="30" font-weight="800">不锈钢 · EF / F / M / B</text>
    <rect x="510" y="604" width="390" height="104" rx="22" fill="#fff" opacity=".12"/>
    <text x="538" y="647" fill="#c5c1f1" font-size="24" font-weight="700">供墨</text><text x="538" y="688" fill="#fff" font-size="30" font-weight="800">墨囊 / 转换器</text>
    <rect x="928" y="604" width="580" height="104" rx="22" fill="#fff" opacity=".12"/>
    <text x="956" y="647" fill="#c5c1f1" font-size="24" font-weight="700">版本边界</text><text x="956" y="688" fill="#fff" font-size="30" font-weight="800">Fountain Pen ≠ Ballpoint</text>
  </g>
  <text x="92" y="770" fill="#fff" font-size="27" font-family="Arial, PingFang SC, sans-serif">Antique Brass 是外观色名，官方钢笔基础材料仍为 aluminum。</text>
  <rect x="92" y="808" width="520" height="58" rx="29" fill="#d7c15e"/>
  <text x="352" y="846" text-anchor="middle" fill="#171d3b" font-size="26" font-family="Arial, PingFang SC, sans-serif" font-weight="800">本站原创结构示意 · 非产品照片</text>
</svg>
