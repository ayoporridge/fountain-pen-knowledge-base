<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Esterbrook 当代型号导航示意图</title>
  <desc id="desc">本站原创 factual SVG。以文字和简化线条区分现代 Estie、Model J、JR，非产品照片。</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="100" y="100" width="1400" height="700" rx="40" fill="#fffaf2" stroke="#513c2f" stroke-width="6"/>
  <text x="180" y="210" font-family="Georgia, serif" font-size="76" fill="#513c2f">Esterbrook 当代型号导航</text>
  <text x="180" y="274" font-family="Arial, sans-serif" font-size="32" fill="#6d5848">把现代 Estie、Model J 与 JR 分开阅读</text>
  <g fill="none" stroke="#513c2f" stroke-width="18" stroke-linecap="round">
    <path d="M210 440h310l42 42-42 42H210z"/>
    <path d="M665 410h380l54 72-54 72H665z"/>
    <path d="M1190 452h160l30 30-30 30h-160z"/>
