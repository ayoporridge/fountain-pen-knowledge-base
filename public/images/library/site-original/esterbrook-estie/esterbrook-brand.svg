    <text x="770" y="620" font-size="42">Estie</text><text x="698" y="670" font-size="28">标准 / Oversized</text>
    <text x="1175" y="620" font-size="42">Model J</text><text x="1158" y="670" font-size="28">现代再设计</text>
  </g>
  <text x="180" y="748" font-family="Arial, sans-serif" font-size="26" fill="#6d5848">示意图，非产品照片；不表示实物比例、颜色、笔尖、刻字、库存或具体版本。</text>
