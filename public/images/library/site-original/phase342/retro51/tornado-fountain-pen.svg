<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" factual-svg="true" product-photo="false" logo="false" to-scale="false" colour-proof="false">
  <title id="title">Retro 51 Tornado Fountain Pen family boundary</title>
  <desc id="desc">Editorial factual diagram showing metal barrel, knurl twist top, international cartridge or converter and German steel nib with family collection branches.</desc>
  <rect width="1200" height="720" fill="#eef1f0"/>
  <rect x="50" y="50" width="1100" height="620" rx="32" fill="#fbfcfa" stroke="#27333a" stroke-width="4"/>
  <text x="92" y="126" fill="#27333a" font-family="Arial, sans-serif" font-size="42" font-weight="700">TORNADO FOUNTAIN PEN</text>
  <text x="94" y="166" fill="#65736e" font-family="Arial, sans-serif" font-size="21">family navigation · shared frame, SKU-specific finish and nib</text>
  <g transform="translate(120 252)">
    <rect x="20" y="38" width="700" height="70" rx="35" fill="#8e9898" stroke="#27333a" stroke-width="4"/>
    <rect x="700" y="28" width="105" height="90" rx="16" fill="#59676b" stroke="#27333a" stroke-width="4"/>
    <path d="M805 35h80v76h-80" fill="#b6babb" stroke="#27333a" stroke-width="4"/>
    <path d="M885 35l108 38-108 38z" fill="#d8b477" stroke="#27333a" stroke-width="4"/>
    <path d="M735 23v100M750 23v100M765 23v100M780 23v100" stroke="#e7e9e7" stroke-width="5"/>
    <text x="230" y="28" fill="#27333a" font-family="Arial, sans-serif" font-size="20">cylindrical metal barrel</text>
    <text x="692" y="154" fill="#27333a" font-family="Arial, sans-serif" font-size="20">knurl twist-cap</text>
    <text x="870" y="154" fill="#27333a" font-family="Arial, sans-serif" font-size="20">German steel nib</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#27333a">
    <rect x="116" y="470" width="382" height="108" rx="16" fill="#dbe8eb" stroke="#496d83" stroke-width="3"/>
    <text x="142" y="512" font-weight="700">fill frame</text>
    <text x="142" y="546">two international cartridges</text>
    <text x="142" y="572">or one converter; both listed by official collection</text>
    <rect x="532" y="470" width="250" height="108" rx="16" fill="#f1e4d9" stroke="#a26e4f" stroke-width="3"/>
    <text x="558" y="512" font-weight="700">nib widths</text>
    <text x="558" y="546">EF · F · M · 1.1 · 1.5 mm</text>
    <rect x="816" y="470" width="270" height="108" rx="16" fill="#e5e9df" stroke="#6f8061" stroke-width="3"/>
    <text x="842" y="512" font-weight="700">collection branches</text>
    <text x="842" y="546">Classic · Stealth · Literary</text>
    <text x="842" y="572">and other theme/material routes</text>
  </g>
  <text x="116" y="632" fill="#65736e" font-family="Arial, sans-serif" font-size="18">2018+ JoWo No.6 replacement compatibility is version evidence, not a universal historical claim.</text>
