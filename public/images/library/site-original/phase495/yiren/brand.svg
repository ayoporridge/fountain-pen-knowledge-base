<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">依人 Yiren 品牌与型号边界事实图</title>
  <desc id="desc">本站原创 factual SVG，区分 Yiren 878 与相邻三位数型号；示意图，非产品照片。</desc>
  <rect width="1440" height="900" fill="#eceff0"/><rect x="72" y="68" width="1296" height="764" rx="30" fill="#fffdf8" stroke="#3f5359" stroke-width="4"/>
  <text x="128" y="156" font-family="Georgia,serif" font-size="64" fill="#233a40">依人 Yiren</text>
  <text x="130" y="208" font-family="Arial,sans-serif" font-size="27" fill="#637276">品牌入口不等于所有相似编号的统一规格</text>
  <circle cx="720" cy="390" r="104" fill="#3f5359"/><text x="720" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#fff">Yiren</text><text x="720" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#dbe4e4">品牌层</text>
