  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="160" y="600" width="360" height="128" rx="18" fill="#43565b"/><text x="340" y="655" font-size="34" fill="#fff">878</text><text x="340" y="696" font-size="21" fill="#dce7e6">已完成代表入口</text><rect x="540" y="600" width="360" height="128" rx="18" fill="#d8c19d"/><text x="720" y="655" font-size="31" fill="#26383c">868 / 886</text><text x="720" y="696" font-size="21" fill="#4e5b5e">相邻编号，另行核验</text><rect x="920" y="600" width="360" height="128" rx="18" fill="#d9e2e3"/><text x="1100" y="655" font-size="29" fill="#26383c">无型号礼品笔</text><text x="1100" y="696" font-size="21" fill="#4e5b5e">不能反推品牌关系</text></g>
