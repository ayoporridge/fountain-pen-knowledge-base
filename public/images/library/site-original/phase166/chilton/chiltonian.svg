<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chiltonian factual diagram</title>
  <desc id="desc">Editorial non-photo diagram of Long Island Chiltonian migration window, colour and size families, ringtop and pneumatic filling checkpoints.</desc>
  <rect width="1600" height="900" fill="#f1ece4"/>
  <rect x="70" y="70" width="1460" height="760" rx="32" fill="#fffaf3" stroke="#7b6147" stroke-width="4"/>
  <text x="120" y="150" font-family="sans-serif" font-size="46" font-weight="700" fill="#3a2b20">The Chilton Chiltonian</text>
  <text x="120" y="200" font-family="sans-serif" font-size="25" fill="#6d5b49">Long Island City · 1929 改制 · factual SVG，非产品照片</text>
  <g transform="translate(160 320)">
    <path d="M0 80h610" stroke="#8b5f3c" stroke-width="28" stroke-linecap="round"/>
    <path d="M520 45q75-70 115 0" fill="none" stroke="#c39b67" stroke-width="12"/>
    <circle cx="575" cy="3" r="20" fill="#c39b67" stroke="#3a2b20" stroke-width="5"/>
    <text x="90" y="180" font-family="sans-serif" font-size="28" fill="#3a2b20">ringtop / vest pocket 版本线索</text>
  </g>
  <g transform="translate(940 280)">
    <circle cx="150" cy="130" r="85" fill="#d7a95d" stroke="#3a2b20" stroke-width="6"/>
    <path d="M150 40v180M60 130h180" stroke="#fffaf3" stroke-width="10"/>
    <text x="0" y="285" font-family="sans-serif" font-size="25" fill="#3a2b20">约 15 色 · 8 尺寸</text>
    <path d="M60 400h180" stroke="#3a2b20" stroke-width="14"/>
    <path d="M150 400v-80M150 480v80" stroke="#3a2b20" stroke-width="8"/>
    <path d="M150 320l-15 25h30zM150 560l-15-25h30z" fill="#3a2b20"/>
    <text x="0" y="625" font-family="sans-serif" font-size="25" fill="#3a2b20">pneumatic filler / seal</text>
  </g>
  <g font-family="sans-serif" font-size="24" fill="#3a2b20">
    <text x="135" y="710">识别：Long Island City 刻字 · 帽口 · 尾端 · 笔夹专利线索 · 颜色与尺寸仅按实物核对</text>
    <text x="135" y="760" fill="#8b4b36">原创示意，不表示真实颜色、比例、刻字、专利形状或库存。</text>
  </g>
</svg>
