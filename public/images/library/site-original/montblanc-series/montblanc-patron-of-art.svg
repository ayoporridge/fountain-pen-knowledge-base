<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Montblanc Patron of Art 系列导航示意图，非产品照片</title><desc id="desc">从 Patron of Art 系列到人物或机构、年份和具体限量版本的资料路径，并说明 888 只是限量层级。</desc>
  <rect width="1200" height="630" fill="#f4efe6"/><g fill="none" stroke="#8f7558" stroke-width="4"><path d="M278 315H430M630 315H775M975 315H1040"/><path d="M630 315L775 185M630 315L775 445"/></g>
  <g font-family="Georgia, serif" text-anchor="middle"><text x="600" y="84" fill="#49382b" font-size="38">Patron of Art：888 不是型号</text><text x="600" y="118" fill="#806d5c" font-size="20">本站原创事实示意图，非产品照片</text></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="52" y="245" width="226" height="140" rx="18" fill="#433128"/><text x="165" y="302" fill="#fff8ef" font-size="25">Patron of Art</text><text x="165" y="336" fill="#fff8ef" font-size="18">系列导航</text><rect x="430" y="245" width="200" height="140" rx="18" fill="#c5a26d"/><text x="530" y="306" fill="#2f241d" font-size="22">人物／机构＋年份</text><rect x="775" y="115" width="200" height="140" rx="18" fill="#dcc8a1"/><text x="875" y="174" fill="#35291f" font-size="24">Limitation 4810</text><text x="875" y="205" fill="#35291f" font-size="17">具体版本才成立</text><rect x="775" y="375" width="200" height="140" rx="18" fill="#dcc8a1"/><text x="875" y="434" fill="#35291f" font-size="24">Limitation 888</text><text x="875" y="465" fill="#35291f" font-size="17">不是单独型号</text><rect x="1040" y="245" width="125" height="140" rx="18" fill="#8f7558"/><text x="1103" y="305" fill="#fff8ef" font-size="19">独立页</text><text x="1103" y="337" fill="#fff8ef" font-size="16">来源核对</text></g>
  <text x="600" y="586" text-anchor="middle" font-family="Arial, sans-serif" fill="#806d5c" font-size="17">主题、年份、编号、笔尖与盒证要一起核对；不要用相邻版本的图片或参数补空。</text>
</svg>
