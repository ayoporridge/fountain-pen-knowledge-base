<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Paili 002 demonstrator diagram</title>
  <desc id="desc">Factual editorial diagram of the Paili 002 transparent body, EF nib, gold clip and trim and converter type filling. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#eef2f1"/>
  <rect x="90" y="90" width="1420" height="720" rx="36" fill="#fffefa" stroke="#5c6c72" stroke-width="6"/>
  <text x="150" y="180" fill="#2f3e43" font-family="sans-serif" font-size="58" font-weight="700">派利 Paili 002</text>
  <text x="154" y="232" fill="#718087" font-family="sans-serif" font-size="28">透明示范笔 · EF · converter type</text>
  <g transform="translate(170 355)">
    <rect x="0" y="92" width="730" height="110" rx="55" fill="#b8d7d5" fill-opacity=".75" stroke="#4f7376" stroke-width="8"/>
    <path d="M80 100v94M150 100v94M220 100v94M290 100v94M360 100v94M430 100v94M500 100v94M570 100v94M640 100v94" stroke="#78a9a8" stroke-width="7" opacity=".7"/>
    <rect x="675" y="82" width="150" height="130" rx="32" fill="#d1a65c" fill-opacity=".55" stroke="#836833" stroke-width="8"/>
    <path d="M825 147h110" stroke="#4f7376" stroke-width="12"/>
    <path d="M935 147l72-37v74z" fill="#c8d0d2" stroke="#4d5960" stroke-width="8"/>
    <text x="60" y="278" fill="#2f3e43" font-family="sans-serif" font-size="28">透明笔身（示意）</text>
    <text x="680" y="278" fill="#2f3e43" font-family="sans-serif" font-size="27">金色夹／饰件</text>
    <text x="900" y="278" fill="#2f3e43" font-family="sans-serif" font-size="27">EF 尖</text>
  </g>
  <g transform="translate(1060 515)">
    <rect x="0" y="0" width="300" height="75" rx="37" fill="#d7e8e6" stroke="#5b7b79" stroke-width="6"/>
    <rect x="26" y="18" width="174" height="39" rx="19" fill="#a4cfca"/>
    <circle cx="251" cy="38" r="23" fill="#5b7b79"/>
    <text x="0" y="126" fill="#2f3e43" font-family="sans-serif" font-size="26">converter type（是否随附按 SKU 确认）</text>
  </g>
  <text x="150" y="745" fill="#718087" font-family="sans-serif" font-size="24">本站原创 factual SVG；非产品照片／非比例图／不证明树脂牌号、重量、容量或具体批次</text>
</svg>
