    <rect x="880" y="58" width="210" height="160" rx="38" fill="#c4a66a" stroke="#25332e" stroke-width="6"/>
    <rect x="1070" y="85" width="90" height="106" rx="30" fill="#596862" stroke="#25332e" stroke-width="6"/>
