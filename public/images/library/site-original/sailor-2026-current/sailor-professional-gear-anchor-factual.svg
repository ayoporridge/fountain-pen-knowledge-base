<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sailor Professional Gear Anchor 规格事实卡</title>
  <desc id="desc">本站原创资料卡，列出 11-5080、11-5081、11-5082 三种饰件配置、新笔身、黄铜大先、132.7 毫米长度与 30 克重量。示意图，不是产品照片。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#123d60"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c6b35"/>
      <stop offset="0.5" stop-color="#d5b36d"/>
      <stop offset="1" stop-color="#80602f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M1200-30l430 0v440z" fill="#4d85a9" opacity="0.14"/>
  <path d="M0 900V620l460 280z" fill="#b9934f" opacity="0.10"/>
