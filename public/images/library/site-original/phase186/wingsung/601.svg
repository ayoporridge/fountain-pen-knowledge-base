  <text x="96" y="118" font-family="Noto Sans CJK SC, sans-serif" font-size="36" fill="#343c40">WingSung 601</text>
  <text x="96" y="158" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#6d6961">暗尖、墨窗与真空／活塞路线｜原创事实示意，不代表比例、颜色或批次</text>
  <g transform="translate(112 238)">
    <rect x="0" y="38" width="750" height="76" rx="38" fill="#345862"/>
