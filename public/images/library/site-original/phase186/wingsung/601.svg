    <text x="120" y="165" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#345862">复古笔身</text>
    <text x="300" y="22" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#3d726b">墨窗</text>
