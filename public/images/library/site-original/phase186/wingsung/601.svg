  <text x="96" y="422" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#6d6961">版本边界：隔膜样本与弹簧活塞样本并存；尺寸和重量来自独立样本测量，购买时按实物核对。</text>
