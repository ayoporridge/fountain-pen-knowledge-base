<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">永生 WingSung 品牌导航示意</title>
  <desc id="desc">本站原创事实示意图，表示品牌名称、年代和型号页面的分层关系，不是品牌标志或产品照片。</desc>
  <rect width="1200" height="520" fill="#eef3f2"/>
  <rect x="54" y="54" width="1092" height="412" rx="28" fill="#fffdf8" stroke="#2e474b" stroke-width="4"/>
  <text x="96" y="118" font-family="Noto Sans CJK SC, sans-serif" font-size="36" fill="#2e474b">永生 WingSung</text>
  <text x="96" y="158" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#667477">品牌名称与具体型号分层｜原创事实示意，不代表商标或工厂标志</text>
  <g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <rect x="125" y="225" width="250" height="108" rx="18" fill="#dcebe8" stroke="#2e474b" stroke-width="3"/>
    <text x="250" y="269" font-size="26" fill="#2e474b">品牌名称</text>
    <text x="250" y="305" font-size="20" fill="#5e6e70">永生 / WingSung</text>
    <rect x="475" y="225" width="250" height="108" rx="18" fill="#f0e4d1" stroke="#8a6337" stroke-width="3"/>
    <text x="600" y="269" font-size="26" fill="#634b2f">资料语境</text>
    <text x="600" y="305" font-size="20" fill="#6e5b46">Hero、授权、年代边界</text>
    <rect x="825" y="225" width="250" height="108" rx="18" fill="#e6e0ef" stroke="#625379" stroke-width="3"/>
    <text x="950" y="269" font-size="26" fill="#514267">型号页面</text>
    <text x="950" y="305" font-size="20" fill="#645a73">601、601A、699…</text>
    <path d="M375 279 H475 M725 279 H825" stroke="#2e474b" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e474b"/></marker></defs>
  <text x="96" y="414" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#667477">品牌页只导航已完成来源化的型号；生产归属、材料和上墨不在品牌层统一回填。</text>
</svg>
