<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pilot 88G and MR family product-line guide</title>
  <desc id="desc">site-original factual SVG; non-photo; non-logo; not-to-scale; not-colour-proof; not-finish-proof. China 88G navigation separates FP-MR1 Classic, FP-MR2 Animal and FP-MR3 Retro Pop; region-specific cartridge systems require separate checks.</desc>
  <rect width="1600" height="900" fill="#e8edf1"/>
  <rect x="80" y="70" width="1440" height="760" rx="36" fill="#fffdf9" stroke="#24364a" stroke-width="6"/>
