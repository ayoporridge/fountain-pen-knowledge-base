  <text x="130" y="215" font-family="sans-serif" font-size="24" fill="#53677c">ONE REGIONAL FAMILY · THREE EXACT PRODUCT NUMBERS</text>
  <g font-family="sans-serif" fill="#17283c">
    <rect x="130" y="315" width="400" height="300" rx="30" fill="#d9dde1"/><text x="175" y="400" font-size="44">FP-MR1</text><text x="175" y="465" font-size="31">Classic</text><text x="175" y="525" font-size="24">5 listed codes</text>
    <rect x="600" y="315" width="400" height="300" rx="30" fill="#d8c9b1"/><text x="645" y="400" font-size="44">FP-MR2</text><text x="645" y="465" font-size="31">Animal</text><text x="645" y="525" font-size="24">5 listed codes</text>
    <rect x="1070" y="315" width="400" height="300" rx="30" fill="#d4c6dd"/><text x="1115" y="400" font-size="44">FP-MR3</text><text x="1115" y="465" font-size="31">Retro Pop</text><text x="1115" y="525" font-size="24">6 listed codes</text>
