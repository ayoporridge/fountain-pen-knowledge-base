  <path d="M530 465h70M1000 465h70" stroke="#6b7d91" stroke-width="6" stroke-dasharray="14 14"/>
  <text x="130" y="700" font-family="sans-serif" font-size="27" fill="#435970">China pages: metal body · F/M · Pilot cartridges / CON-40</text>
  <text x="130" y="752" font-family="sans-serif" font-size="24" fill="#7b4f42">European DIN compatibility is region-scoped; verify the package before buying a converter.</text>
