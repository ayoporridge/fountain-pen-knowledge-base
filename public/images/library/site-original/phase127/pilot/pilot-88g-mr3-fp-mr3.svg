<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pilot 88G MR3 FP-MR3 Retro Pop variant map</title>
  <desc id="desc">site-original factual SVG; non-photo; non-logo; not-to-scale; not-colour-proof; not-finish-proof. FP-MR3 has DT WV FL MB EP HT coded Retro Pop variants, metal body, F M nibs and China CON-40 compatibility.</desc>
