<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pilot 88G MR1 FP-MR1 variant map</title>
  <desc id="desc">site-original factual SVG; non-photo; non-logo; not-to-scale; not-colour-proof; not-finish-proof. FP-MR1 China page lists five coded combinations despite saying three patterns.</desc>
  <rect width="1600" height="900" fill="#e9ecef"/>
  <rect x="75" y="65" width="1450" height="770" rx="36" fill="#fbfbf8" stroke="#253243" stroke-width="6"/>
  <text x="125" y="150" font-family="serif" font-size="54" fill="#172234">Pilot 88G MR1 Classic · FP-MR1</text>
  <text x="125" y="205" font-family="sans-serif" font-size="24" fill="#536176">METAL BODY · F / M · PILOT CARTRIDGES / CON-40 (CHINA)</text>
  <g font-family="sans-serif" font-size="29" fill="#172234">
    <rect x="130" y="295" width="250" height="210" rx="24" fill="#d8dde1"/><text x="165" y="365">SIP</text><text x="165" y="420">silver plain</text>
    <rect x="405" y="295" width="250" height="210" rx="24" fill="#cfd9df"/><text x="440" y="365">SID</text><text x="440" y="420">silver dots</text>
    <rect x="680" y="295" width="250" height="210" rx="24" fill="#dfd2ae"/><text x="715" y="365">GDP</text><text x="715" y="420">gold plain</text>
    <rect x="955" y="295" width="250" height="210" rx="24" fill="#d8c58f"/><text x="990" y="365">GDZ</text><text x="990" y="420">gold grid</text>
    <rect x="1230" y="295" width="250" height="210" rx="24" fill="#30343a"/><text x="1265" y="365" fill="#fff">BP</text><text x="1265" y="420" fill="#fff">black plain</text>
  </g>
  <rect x="130" y="570" width="1350" height="135" rx="22" fill="#f2dfd9" stroke="#a65b4e" stroke-width="3"/>
  <text x="175" y="630" font-family="sans-serif" font-size="27" fill="#6f342b">OFFICIAL PAGE CONFLICT</text>
  <text x="175" y="675" font-family="sans-serif" font-size="25" fill="#6f342b">copy says “3 patterns”; coded list contains 5 combinations — preserve all five, do not guess.</text>
  <text x="130" y="785" font-family="sans-serif" font-size="22" fill="#687589">Diagram maps codes only; it is not a colour or finish proof.</text>
</svg>
