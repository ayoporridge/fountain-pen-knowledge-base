<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">铱粒点尖术语边界事实示意图</title><desc id="d">弹片材料与前端耐磨 tipping 不是同一字段。</desc><rect width="1600" height="900" fill="#f1edf4"/><path d="M300 190h900l-140 400H440z" fill="#a9a4b5" stroke="#322e3c" stroke-width="14"/><ellipse cx="1060" cy="590" rx="130" ry="55" fill="#665f72" stroke="#322e3c" stroke-width="14"/><text x="410" y="340" font-size="68" fill="#322e3c" font-family="sans-serif">tipping ≠ 整片尖</text><text x="410" y="460" font-size="42" fill="#322e3c" font-family="sans-serif">“铱尖”常是历史俗称</text><text x="410" y="550" font-size="38" fill="#322e3c" font-family="sans-serif">现代合金成分需查来源</text><text x="170" y="840" font-size="28" fill="#696273" font-family="sans-serif">本站原创 factual SVG；非产品照片；not-to-scale；non-colour-proof；non-logo</text></svg>
