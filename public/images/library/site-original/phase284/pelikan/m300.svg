  <rect x="260" y="360" width="760" height="88" rx="44" fill="#234332"/>
  <rect x="930" y="345" width="185" height="118" rx="26" fill="#c3a45b" stroke="#8c6d2f" stroke-width="8"/>
  <path d="M1115 404 L1300 350 L1300 458 Z" fill="#c3a45b" stroke="#8c6d2f" stroke-width="8"/>
  <circle cx="980" cy="404" r="14" fill="#f0d98b"/>
  <line x1="560" y1="330" x2="560" y2="260" stroke="#555" stroke-width="4"/>
