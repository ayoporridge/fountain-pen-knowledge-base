<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-factual-svg="true" data-product-photo="false" data-logo="false" data-to-scale="false" data-colour-proof="false">
  <title id="title">Tibaldi Bononia factual diagram</title>
  <desc id="desc">Editorial diagram of a Tibaldi Bononia resin fountain pen with three cap bands, steel nib and international cartridge/converter filling. Not a product photograph and not to scale.</desc>
  <rect width="1600" height="900" fill="#f1eee9"/>
  <rect x="82" y="78" width="1436" height="744" rx="34" fill="#fffdfa" stroke="#a69b91" stroke-width="4"/>
  <text x="142" y="166" font-family="Georgia,serif" font-size="56" fill="#2a2928">Tibaldi Bononia</text>
  <text x="142" y="216" font-family="Arial,sans-serif" font-size="25" fill="#6b6663">resin body · three cap bands · #6 steel sample · standard international fill</text>
  <g transform="translate(150 300)">
    <path d="M80 118 C170 55 390 43 690 64 L1000 84 L1135 95 L1238 127 L1328 154 L1238 181 L1135 213 L1000 204 L690 224 C400 246 170 232 80 175 C35 147 35 146 80 118Z" fill="#75a7a2" stroke="#3b3837" stroke-width="8"/>
    <path d="M75 118 C44 129 44 163 80 175" fill="#d8c4a4" stroke="#3b3837" stroke-width="8"/>
    <path d="M665 64 L695 224 M700 65 L730 221 M735 67 L765 218" stroke="#d7b575" stroke-width="12"/>
    <path d="M1132 96 L1238 127 L1328 154 L1238 181 L1132 212" fill="#d1d4d2" stroke="#3b3837" stroke-width="8"/>
    <path d="M1328 154 L1414 154" stroke="#3b3837" stroke-width="12" stroke-linecap="round"/>
    <text x="170" y="322" font-family="Arial,sans-serif" font-size="28" fill="#3b3837">resin / acrylic body</text>
    <text x="662" y="322" font-family="Arial,sans-serif" font-size="28" fill="#3b3837">three decorative cap bands</text>
    <text x="1135" y="322" font-family="Arial,sans-serif" font-size="28" fill="#3b3837">#6 steel nib sample</text>
  </g>
  <g transform="translate(200 660)" font-family="Arial,sans-serif" font-size="28" fill="#2a2928">
    <rect x="0" y="0" width="430" height="78" rx="18" fill="#e6ded1" stroke="#9c8b76" stroke-width="3"/>
    <rect x="480" y="0" width="430" height="78" rx="18" fill="#e6ded1" stroke="#9c8b76" stroke-width="3"/>
    <text x="58" y="50">international cartridge</text>
    <text x="575" y="50">converter option</text>
