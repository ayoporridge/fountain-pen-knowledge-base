<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">LAMY studio identity and nib variants</title><desc id="desc">Site-original factual diagram for LAMY studio, Hannes Wettstein, propeller clip, black steel nib and palladium gold nib variants.</desc><rect width="1600" height="900" fill="#ecebea"/><rect x="70" y="70" width="1460" height="760" rx="38" fill="#fbfbf9" stroke="#25282b" stroke-width="5"/><text x="125" y="170" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#25282b">LAMY studio</text><text x="128" y="220" font-family="Arial,sans-serif" font-size="25" fill="#6e7072">FACTUAL DIAGRAM · NON-PHOTO · NOT TO SCALE</text><g transform="translate(120 300)"><rect x="0" y="35" width="850" height="115" rx="55" fill="#34383c"/><path d="M250 18c130-18 260-18 390 0l-50 32c-92-12-198-12-290 0z" fill="#c4c7c9" stroke="#25282b" stroke-width="5"/><rect x="850" y="55" width="270" height="75" rx="36" fill="#70757a"/><path d="M1120 55l95 37-95 38z" fill="#d9dcde"/></g><line x1="125" y1="535" x2="1475" y2="535" stroke="#bab6ae" stroke-width="4"/><g font-family="Arial,sans-serif"><text x="135" y="610" font-size="36" font-weight="700" fill="#25282b">BLACK · STEEL F ANCHOR</text><text x="135" y="660" font-size="30" fill="#333">13 × 13 × 140 mm · 24 g · T 10 / Z 27</text><text x="135" y="715" font-size="30" fill="#333">Hannes Wettstein · propeller-shaped clip</text><text x="910" y="610" font-size="36" font-weight="700" fill="#805d34">VARIANT BOUNDARY</text><text x="910" y="660" font-size="30" fill="#333">palladium / pianoblack: 14K options</text><text x="910" y="710" font-size="30" fill="#333">Do not merge nib, finish or packaging</text></g><text x="125" y="790" font-family="Arial,sans-serif" font-size="23" fill="#6e7072">Site-original · non-logo · not-colour-proof · not-finish-proof · 2026-07-22</text></svg>
