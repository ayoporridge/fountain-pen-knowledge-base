  <text x="120" y="198" font-family="sans-serif" font-size="28" fill="#6c5b50">Tamenuri 溜塗 · factual identity map</text>
  <line x1="120" y1="238" x2="1480" y2="238" stroke="#b8a79a" stroke-width="3"/>
  <rect x="120" y="286" width="540" height="260" rx="22" fill="#eadfce" stroke="#6f5a4c" stroke-width="3"/>
  <text x="160" y="344" font-family="sans-serif" font-size="32" font-weight="700" fill="#382d27">同一型号</text>
