  <text x="160" y="450" font-family="sans-serif" font-size="28" fill="#382d27">大型 18K · F / M / B</text>
  <text x="160" y="500" font-family="sans-serif" font-size="26" fill="#382d27">154 mm · 18 mm · 约 34.5 g</text>
  <rect x="760" y="286" width="680" height="260" rx="22" fill="#f4e7db" stroke="#8a6755" stroke-width="3"/>
