  <desc id="desc">A factual, non-photo, non-logo, not-to-scale, non-colour-proof diagram of the PIZ-55000 model and its #27, #28 and #30 lacquer variants.</desc>
  <rect width="1600" height="900" fill="#f7f2ea"/>
