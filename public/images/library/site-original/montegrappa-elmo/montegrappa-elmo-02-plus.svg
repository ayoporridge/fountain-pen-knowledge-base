<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Montegrappa Elmo 02 Plus 身份与规格边界示意图</title>
  <desc id="desc">本站原创事实图，说明 Elmo 02 Plus 的活塞、37 克和笔尖选项；不是产品照片。</desc>
  <rect width="1200" height="630" fill="#20283b"/>
  <text x="72" y="92" fill="#f4ead4" font-family="Georgia, serif" font-size="50">Montegrappa Elmo 02 Plus</text>
  <text x="72" y="135" fill="#c9d0e6" font-family="Arial, sans-serif" font-size="22">活塞支系；“Plus”不是普通 Elmo 02 的颜色或装饰尾缀</text>
  <rect x="88" y="252" width="620" height="66" rx="33" fill="#b99d65"/>
  <polygon points="708,252 838,285 708,318" fill="#dedbd1"/>
  <rect x="545" y="262" width="82" height="46" rx="10" fill="#483a53"/>
  <line x1="173" y1="263" x2="173" y2="307" stroke="#483a53" stroke-width="10"/>
  <text x="398" y="374" text-anchor="middle" fill="#c9d0e6" font-family="Arial, sans-serif" font-size="20">轮廓仅提示分类，不代表真实比例或商品外观</text>
  <g fill="#f4ead4" font-family="Arial, sans-serif" font-size="26">
    <text x="800" y="255">官方当前商品页（指定 SKU）</text>
