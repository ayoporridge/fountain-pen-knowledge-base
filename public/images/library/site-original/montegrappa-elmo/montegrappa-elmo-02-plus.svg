  </g>
  <rect x="72" y="538" width="1056" height="54" rx="12" fill="#38435f"/>
  <text x="600" y="572" text-anchor="middle" fill="#c9d0e6" font-family="Arial, sans-serif" font-size="19">示意图，非产品照片；不代表真实色彩、比例、笔尖弹性、库存或具体 SKU。</text>
