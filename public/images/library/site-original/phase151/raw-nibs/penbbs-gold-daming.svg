<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">PenBBS 金尖／大明尖选配边界事实示意图</title><desc id="d">同一品牌不同型号和尖片选项不能混为一个型号。</desc><rect width="1600" height="900" fill="#f7efe4"/><rect x="220" y="260" width="340" height="280" rx="34" fill="#a3b9bd" stroke="#3e4a4f" stroke-width="12"/><rect x="630" y="260" width="340" height="280" rx="34" fill="#d6b05c" stroke="#5a4823" stroke-width="12"/><rect x="1040" y="260" width="340" height="280" rx="34" fill="#b58c95" stroke="#55353d" stroke-width="12"/><text x="300" y="410" font-size="54" fill="#273338" font-family="sans-serif">456</text><text x="690" y="410" font-size="54" fill="#5a4823" font-family="sans-serif">268 / 469</text><text x="1110" y="410" font-size="54" fill="#55353d" font-family="sans-serif">494</text><text x="315" y="650" font-size="44" fill="#3e4a4f" font-family="sans-serif">尖片选项随具体 SKU</text><text x="205" y="760" font-size="34" fill="#63574f" font-family="sans-serif">“金尖／大明尖”是线索，不是独立统一型号</text><text x="170" y="840" font-size="28" fill="#766b63" font-family="sans-serif">本站原创 factual SVG；非产品照片；not-to-scale；non-colour-proof；non-logo</text></svg>
