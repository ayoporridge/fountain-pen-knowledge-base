<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Ipsilon Demo Colors six-colour and two-trim matrix</title>
  <desc id="desc">Editorial matrix grouping six official colour names into chrome stainless-steel and gold gold-plated-steel nib groups. Swatches are layout codes, not colour proof. Not a photo, logo, scale or finish proof.</desc>
  <rect width="1600" height="900" fill="#eef3f0"/>
  <text x="90" y="110" font-family="serif" font-size="54" fill="#173b35">DEMO COLORS · CURRENT BOUNDARY</text>
  <text x="90" y="164" font-family="sans-serif" font-size="24" fill="#4b625d">glossy coloured resin · clear grip section · official PDF retrieved 2026-07-21</text>
  <rect x="90" y="230" width="680" height="475" rx="30" fill="#dfe8eb"/><rect x="830" y="230" width="680" height="475" rx="30" fill="#eee4ce"/>
  <text x="430" y="295" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#344a50">CHROME TRIM</text><text x="430" y="335" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#53676c">stainless-steel nib</text>
  <text x="1170" y="295" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#5c4924">GOLD TRIM</text><text x="1170" y="335" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#74613a">gold-plated steel nib</text>
  <g font-family="sans-serif" font-size="25" text-anchor="middle" fill="#1f2927">
    <circle cx="260" cy="470" r="72" fill="#b84c4c"/><text x="260" y="580">red</text><circle cx="430" cy="470" r="72" fill="#795c91"/><text x="430" y="580">purple</text><circle cx="600" cy="470" r="72" fill="#4e9996"/><text x="600" y="580">turquoise</text>
    <circle cx="1000" cy="470" r="72" fill="#5b8b62"/><text x="1000" y="580">green</text><circle cx="1170" cy="470" r="72" fill="#d48843"/><text x="1170" y="580">orange</text><circle cx="1340" cy="470" r="72" fill="#d4b84f"/><text x="1340" y="580">yellow</text>
  </g>
  <path d="M210 650H650M950 650H1390" stroke="#7a8c87" stroke-width="3"/>
  <text x="90" y="790" font-family="sans-serif" font-size="24" fill="#50615c">2020 C/C · nib widths · lineup · matching-ink gift remain DATED CONTEXT, not current stable fields.</text>
  <text x="90" y="840" font-family="sans-serif" font-size="20" fill="#687772">SITE-ORIGINAL · NON-PHOTO · NON-LOGO · NON-SCALE · SWATCHES ARE NOT COLOUR OR FINISH PROOF</text>
</svg>
