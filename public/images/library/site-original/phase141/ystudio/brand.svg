  <text x="98" y="182" fill="#8b5e34" font-family="Arial,sans-serif" font-size="30">台湾设计品牌 · 金属笔具 · 使用痕迹会随时间改变表面</text>
  <g transform="translate(105 295)">
    <rect x="0" y="65" width="1040" height="128" rx="58" fill="#b77b38" stroke="#493729" stroke-width="8"/>
