<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Wancher Dream Pen 系列导航示意图</title>
  <desc id="desc">说明 Dream Pen 是产品系列，必须由材料和具体 SKU 确定规格；非产品照片。</desc>
  <rect width="1440" height="900" fill="#f6f1e7"/>
  <rect x="80" y="72" width="1280" height="756" rx="28" fill="#fffdf8" stroke="#1d4d4f" stroke-width="3"/>
  <text x="720" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#173b3d">Wancher Dream Pen</text>
  <text x="720" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#526466">系列导航，不是一支固定规格的钢笔</text>
  <path d="M720 255 V325 M720 325 H280 M720 325 H720 M720 325 H1160" fill="none" stroke="#b48745" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="366" width="320" height="232" rx="20" fill="#202728"/>
    <text x="280" y="425" font-size="32" fill="#f4dec0">True Ebonite</text>
    <text x="280" y="469" font-size="22" fill="#d7dfe0">硬橡胶分支</text>
    <text x="280" y="517" font-size="19" fill="#d7dfe0">查具体 SKU 的笔尖、供墨、</text>
    <text x="280" y="546" font-size="19" fill="#d7dfe0">表面、批次与笔夹配置</text>
    <rect x="560" y="366" width="320" height="232" rx="20" fill="#455259"/>
    <text x="720" y="425" font-size="32" fill="#fff">Titanium Black</text>
    <text x="720" y="469" font-size="22" fill="#e0e7e6">钛金属分支</text>
    <text x="720" y="517" font-size="19" fill="#e0e7e6">不能沿用硬橡胶款的</text>
    <text x="720" y="546" font-size="19" fill="#e0e7e6">材质、手感或护理结论</text>
    <rect x="1000" y="366" width="320" height="232" rx="20" fill="#6c4735"/>
    <text x="1160" y="425" font-size="32" fill="#ffe8c4">Urushi / Raden</text>
    <text x="1160" y="469" font-size="22" fill="#f6dbc0">漆艺与装饰分支</text>
    <text x="1160" y="517" font-size="19" fill="#f6dbc0">按作品名、工艺、年份、</text>
    <text x="1160" y="546" font-size="19" fill="#f6dbc0">限量与官方页逐一确认</text>
  </g>
  <path d="M280 636 V678 H720 V636 M1160 636 V678" fill="none" stroke="#b48745" stroke-width="5"/>
  <rect x="390" y="708" width="660" height="72" rx="18" fill="#dbe9e2" stroke="#1d4d4f" stroke-width="2"/>
  <text x="720" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#173b3d">材料／工艺 → 官方全名 → 具体 SKU → 再确认规格</text>
  <text x="720" y="812" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b5c4d">本站原创事实图 · 非产品照片 · 不得跨版本转移规格</text>
</svg>
