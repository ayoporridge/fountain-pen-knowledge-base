<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wancher True Ebonite Marble Green 事实边界图</title>
  <desc id="desc">本站原创非产品照片示意图，区分当前官网、True Ebonite 家族工艺与零售库存快照。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102019"/><stop offset="1" stop-color="#263c32"/></linearGradient>
    <style>.k{font:700 25px system-ui,sans-serif;letter-spacing:2px;fill:#d4b875}.h{font:700 48px system-ui,sans-serif;fill:#f4f0e7}.t{font:700 28px system-ui,sans-serif;fill:#f4f0e7}.b{font:400 22px system-ui,sans-serif;fill:#d7ded9}.s{font:500 19px system-ui,sans-serif;fill:#a9b5ae}.card{fill:#182b22;stroke:#688274;stroke-width:2}.line{stroke:#d4b875;stroke-width:4;stroke-linecap:round}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="102" class="k">FACT BOUNDARY · SITE ORIGINAL</text>
  <text x="90" y="170" class="h">True Ebonite · Marble Green</text>
  <line x1="92" y1="207" x2="1508" y2="207" class="line"/>
  <g transform="translate(90 270)"><rect class="card" width="440" height="405" rx="26"/><text x="34" y="62" class="t">CURRENT EXACT SKU</text><text x="34" y="112" class="b">Ebonite · pattern varies</text><text x="34" y="153" class="b">European International C/C</text><text x="34" y="194" class="b">JoWo steel / Wancher 18K</text><text x="34" y="235" class="b">Plastic / ebonite feeds</text><line x1="34" y1="278" x2="406" y2="278" stroke="#688274"/><text x="34" y="324" class="s">Same SKU, different pattern.</text><text x="34" y="360" class="s">Not a colour or finish proof.</text></g>
  <g transform="translate(580 270)"><rect class="card" width="440" height="405" rx="26"/><text x="34" y="62" class="t">FAMILY PROCESS</text><text x="34" y="112" class="b">Japanese ebonite narrative</text><text x="34" y="153" class="b">Nikko Ebonite context</text><text x="34" y="194" class="b">ASO hand-polishing context</text><text x="34" y="235" class="b">Not a per-piece passport</text><line x1="34" y1="278" x2="406" y2="278" stroke="#688274"/><text x="34" y="324" class="s">Family scope stays qualified.</text><text x="34" y="360" class="s">No component origin inferred.</text></g>
  <g transform="translate(1070 270)"><rect class="card" width="440" height="405" rx="26"/><text x="34" y="62" class="t">RETAIL SNAPSHOT</text><text x="34" y="112" class="b">Titanium threads claim</text><text x="34" y="153" class="b">Spring-loaded cap claim</text><text x="34" y="194" class="b">6.08 / 5.28 inch listing</text><text x="34" y="235" class="b">One inventory context</text><line x1="34" y1="278" x2="406" y2="278" stroke="#688274"/><text x="34" y="324" class="s">Not current stable specs.</text><text x="34" y="360" class="s">Price and stock stay mutable.</text></g>
  <text x="90" y="770" class="t">Identity exclusions</text>
  <text x="90" y="816" class="b">Not Mine Marble Green · not Marble Blue/Brown · not Silk/Matte Black</text>
