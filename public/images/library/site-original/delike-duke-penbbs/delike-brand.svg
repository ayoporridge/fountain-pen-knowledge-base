<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Delike 型号边界事实图</title><desc id="desc">示意图，非产品照片。Element 黄铜口袋笔与 Alpha、Brass、New Moon 分开。</desc><rect width="1600" height="900" fill="#171913"/><text x="110" y="140" fill="#f3dfaa" font-size="60" font-family="serif">Delike：先核对型号，再看相似外形</text><path d="M210 420h480l90 65-90 65H210z" fill="#b98c45"/><text x="270" y="505" fill="#171913" font-size="52" font-family="sans-serif">Element</text><text x="950" y="370" fill="#f6f0df" font-size="44" font-family="sans-serif">Alpha / Brass / New Moon</text><text x="950" y="430" fill="#a8ad9a" font-size="30" font-family="sans-serif">不同名称、外形和资料页</text><path d="M790 485h110" stroke="#e8c46e" stroke-width="8"/><text x="110" y="760" fill="#a8ad9a" font-size="30" font-family="sans-serif">黄铜旋帽、无夹、可后插：仅说明 Element 的已核对边界</text></svg>
