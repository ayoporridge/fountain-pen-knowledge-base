<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Duke 资料边界事实图</title><desc id="desc">示意图，非产品照片。品牌页只链接已核对的 Duke 551。</desc><rect width="1600" height="900" fill="#1b1713"/><text x="110" y="150" fill="#e7c98a" font-size="62" font-family="serif">Duke 不是一支笔的型号</text><circle cx="410" cy="470" r="155" fill="#9c6d3e"/><text x="305" y="485" fill="#1b1713" font-size="48" font-family="sans-serif">551</text><path d="M570 470h300" stroke="#e7c98a" stroke-width="8"/><text x="920" y="455" fill="#f6f0df" font-size="50" font-family="sans-serif">已核对：Confucius fude</text><text x="920" y="530" fill="#aba093" font-size="32" font-family="sans-serif">其他 Duke 名称需逐一验证</text><text x="110" y="790" fill="#aba093" font-size="28" font-family="sans-serif">示意图，非产品照片；不宣称完整产品线或当代库存。</text></svg>
