<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Delike Element 事实图</title><desc id="desc">示意图，非产品照片。展示合帽、无帽和后插长度边界。</desc><rect width="1600" height="900" fill="#171913"/><text x="110" y="130" fill="#f3dfaa" font-size="60" font-family="serif">Delike Element</text><g fill="#b98c45"><rect x="170" y="330" width="400" height="70" rx="35"/><rect x="170" y="490" width="370" height="70" rx="35"/><rect x="170" y="650" width="510" height="70" rx="35"/></g><g fill="#f6f0df" font-size="36" font-family="sans-serif"><text x="730" y="380">合帽约 120 mm</text><text x="730" y="540">无帽约 112 mm</text><text x="730" y="700">后插约 152 mm</text></g><text x="110" y="820" fill="#a8ad9a" font-size="28" font-family="sans-serif">示意图，非产品照片；尺寸来自指定来源样本，不代表所有批次。</text></svg>
