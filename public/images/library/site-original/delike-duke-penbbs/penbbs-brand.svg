<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">PenBBS 型号结构事实图</title><desc id="desc">示意图，非产品照片。268 真空上墨与其他编号的结构边界。</desc><rect width="1600" height="900" fill="#122029"/><text x="100" y="130" fill="#b9e4e8" font-size="60" font-family="serif">PenBBS：编号后面是结构</text><g font-family="sans-serif" font-size="45"><rect x="130" y="315" width="260" height="150" rx="28" fill="#4fa9b4"/><text x="200" y="405" fill="#122029">268</text><rect x="480" y="315" width="260" height="150" rx="28" fill="#294d5a"/><text x="545" y="405" fill="#d9eef0">456</text><rect x="830" y="315" width="260" height="150" rx="28" fill="#294d5a"/><text x="900" y="405" fill="#d9eef0">469</text></g><text x="130" y="570" fill="#b9e4e8" font-size="38" font-family="sans-serif">268：较小真空上墨、固定式弯 Fine 样本</text><text x="130" y="780" fill="#8bb0b5" font-size="28" font-family="sans-serif">示意图，非产品照片；不要以 456、308、355、469 的规格替代 268。</text></svg>
