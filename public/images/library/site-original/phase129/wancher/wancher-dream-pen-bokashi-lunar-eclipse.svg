<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wancher Bokashi Urushi Lunar Eclipse fact boundary diagram</title>
  <desc id="desc">Site-original non-photographic diagram showing red-to-black Bokashi gradation and exact variant boundaries. Not to scale and not a colour or finish proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3ebe7"/><stop offset="1" stop-color="#cfc5c3"/></linearGradient>
    <linearGradient id="bokashi" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f151c"/><stop offset=".38" stop-color="#a84337"/><stop offset=".68" stop-color="#3a2425"/><stop offset="1" stop-color="#111315"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="96" y="112" font-family="Georgia,serif" font-size="52" fill="#351b1c">Bokashi Urushi · Lunar Eclipse</text>
  <text x="98" y="162" font-family="Arial,sans-serif" font-size="24" fill="#645052">exact red/black variant · handcrafted in Wajima</text>
  <g transform="translate(120 270)">
    <rect x="0" y="72" width="880" height="116" rx="58" fill="url(#bokashi)" stroke="#241719" stroke-width="8"/>
    <path d="M880 72h190l110 58-110 58H880z" fill="#17191b" stroke="#241719" stroke-width="8"/>
    <path d="M1180 130l96-24-58 48z" fill="#d5b36a" stroke="#70552b" stroke-width="5"/>
    <circle cx="356" cy="102" r="7" fill="#d27864" opacity=".55"/><circle cx="498" cy="160" r="5" fill="#d27864" opacity=".45"/><circle cx="654" cy="112" r="6" fill="#8f5a51" opacity=".42"/>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="104" y="590" width="420" height="188" rx="24" fill="#fff" opacity=".9"/>
    <text x="138" y="638" font-size="25" font-weight="700" fill="#351b1c">Official exact-page facts</text>
    <text x="138" y="682" font-size="22" fill="#514043">Ebonite + natural red/black Urushi</text>
    <text x="138" y="720" font-size="22" fill="#514043">Bokashi-nuri gradation · Wajima</text>
    <text x="138" y="758" font-size="22" fill="#514043">Handmade variation is expected</text>
    <rect x="590" y="590" width="410" height="188" rx="24" fill="#fff" opacity=".9"/>
    <text x="624" y="638" font-size="25" font-weight="700" fill="#351b1c">Exact variant boundary</text>
    <text x="624" y="682" font-size="22" fill="#514043">Lunar Eclipse only</text>
    <text x="624" y="720" font-size="22" fill="#514043">Not Sunset / Sunrise / Solar Eclipse</text>
    <text x="624" y="758" font-size="22" fill="#514043">Availability is a dated snapshot</text>
    <rect x="1066" y="590" width="420" height="188" rx="24" fill="#fff" opacity=".9"/>
    <text x="1100" y="638" font-size="25" font-weight="700" fill="#351b1c">Diagram limits</text>
    <text x="1100" y="682" font-size="22" fill="#514043">non-photo · non-logo</text>
    <text x="1100" y="720" font-size="22" fill="#514043">not-to-scale · not-colour-proof</text>
    <text x="1100" y="758" font-size="22" fill="#514043">not-finish-proof</text>
  </g>
</svg>
