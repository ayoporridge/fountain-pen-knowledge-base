<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wancher Dream Pen Tokiwa-iro fact boundary diagram</title>
  <desc id="desc">Site-original non-photographic diagram separating exact product identity, Tsugaru Urushi process, and configurable writing system. Not to scale and not a colour or finish proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4e8"/><stop offset="1" stop-color="#d8e4cc"/></linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#163f2b"/><stop offset=".35" stop-color="#557a38"/><stop offset=".62" stop-color="#244c32"/><stop offset="1" stop-color="#8a9c4f"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="96" y="112" font-family="Georgia,serif" font-size="54" fill="#183425">Dream Pen Tokiwa-iro</text>
  <text x="98" y="162" font-family="Arial,sans-serif" font-size="24" fill="#4c5d50">exact SKU · Wancher 10th anniversary · 30 pieces</text>
  <g transform="translate(120 270)">
    <rect x="0" y="72" width="880" height="116" rx="58" fill="url(#pen)" stroke="#12281c" stroke-width="8"/>
    <path d="M880 72h190l110 58-110 58H880z" fill="#31583b" stroke="#12281c" stroke-width="8"/>
    <path d="M1180 130l96-24-58 48z" fill="#d6b66e" stroke="#725a2e" stroke-width="5"/>
    <path d="M132 76c54 34 94 72 158 108M364 76c48 31 80 64 139 108M590 76c55 35 85 68 145 108" fill="none" stroke="#a5b95c" stroke-width="20" opacity=".45"/>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="104" y="590" width="420" height="188" rx="24" fill="#fff" opacity=".9"/>
    <text x="138" y="638" font-size="25" font-weight="700" fill="#183425">Official exact-page facts</text>
    <text x="138" y="682" font-size="22" fill="#33483a">Ebonite + Urushi · Aomori</text>
    <text x="138" y="720" font-size="22" fill="#33483a">Kara-nuri · Midori-age · 3–6 months</text>
    <text x="138" y="758" font-size="22" fill="#33483a">European International filling</text>
    <rect x="590" y="590" width="410" height="188" rx="24" fill="#fff" opacity=".9"/>
    <text x="624" y="638" font-size="25" font-weight="700" fill="#183425">Configured per order</text>
    <text x="624" y="682" font-size="22" fill="#33483a">#6 JoWo steel or Wancher 18K</text>
    <text x="624" y="720" font-size="22" fill="#33483a">Plastic / black / red ebonite feed</text>
    <text x="624" y="758" font-size="22" fill="#33483a">Verify the individual pen</text>
    <rect x="1066" y="590" width="420" height="188" rx="24" fill="#fff" opacity=".9"/>
    <text x="1100" y="638" font-size="25" font-weight="700" fill="#183425">Diagram limits</text>
    <text x="1100" y="682" font-size="22" fill="#33483a">non-photo · non-logo</text>
    <text x="1100" y="720" font-size="22" fill="#33483a">not-to-scale · not-colour-proof</text>
    <text x="1100" y="758" font-size="22" fill="#33483a">not-finish-proof</text>
