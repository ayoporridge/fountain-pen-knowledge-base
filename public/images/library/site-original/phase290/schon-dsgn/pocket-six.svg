<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Schon DSGN Pocket Six 结构事实示意图</title>
  <desc id="desc">本站原创示意图，表达 Pocket Six 的短杆、上帽书写、六号笔尖与短国际墨囊；不是产品照片。product-photo=false;factual-svg=true</desc>
  <rect width="1600" height="900" fill="#f5f1e8"/>
  <rect x="90" y="90" width="1420" height="720" rx="36" fill="#fffdf8" stroke="#1d3557" stroke-width="6"/>
  <text x="150" y="175" font-family="sans-serif" font-size="46" font-weight="700" fill="#1d3557">SCHON DSGN · POCKET SIX</text>
  <text x="150" y="228" font-family="sans-serif" font-size="26" fill="#52616b">factual diagram · editorial illustration · not a product photograph</text>
  <g transform="translate(190 345)">
    <rect x="0" y="110" width="500" height="100" rx="50" fill="#7a8fa6" stroke="#243447" stroke-width="8"/>
