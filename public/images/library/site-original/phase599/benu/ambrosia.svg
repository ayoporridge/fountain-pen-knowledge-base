<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BENU Ambrosia 花卉与短墨囊事实图</title><desc id="desc">原创非摄影示意图，用抽象花瓣说明 Ambrosia 的花名 variants、短国际墨囊、五号尖与单款限量边界。</desc>
  <rect width="1600" height="900" fill="#1d1025"/><g transform="translate(500 470)" fill="#a855f7" opacity=".65"><ellipse rx="95" ry="250" transform="rotate(0)"/><ellipse rx="95" ry="250" transform="rotate(60)"/><ellipse rx="95" ry="250" transform="rotate(120)"/></g><circle cx="500" cy="470" r="85" fill="#f0abfc"/>
  <text x="105" y="125" fill="#fdf4ff" font-size="64" font-family="system-ui" font-weight="700">BENU Ambrosia</text><text x="107" y="180" fill="#e879f9" font-size="27" font-family="system-ui">flower-named compact family · factual diagram · not a product photo</text>
  <g font-family="system-ui"><text x="900" y="320" fill="#fff" font-size="34" font-weight="700">#5 Schmidt steel</text><text x="900" y="380" fill="#f0abfc" font-size="26">short international cartridge</text><text x="900" y="480" fill="#fff" font-size="34" font-weight="700">No standard converter</text><text x="900" y="540" fill="#f0abfc" font-size="26">mini ≤ 4 cm / eyedropper by care</text><text x="107" y="805" fill="#d946ef" font-size="25">Marigold 20-piece limit does not apply to every Ambrosia colour</text></g>
</svg>
