<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BENU Scepter 五号尖历史系列事实图</title><desc id="desc">原创示意图，以抽象螺旋权杖轮廓说明 Scepter 的五号钢尖、一百三十三毫米、不可套帽和罗马数字颜色；非产品照片。</desc>
  <rect width="1600" height="900" fill="#160b08"/><text x="105" y="125" fill="#fff7ed" font-size="64" font-family="system-ui" font-weight="700">BENU Scepter</text><text x="107" y="180" fill="#fdba74" font-size="27" font-family="system-ui">historical spiral-facet family · #5 nib · not a product photo</text>
  <path d="M210 360 L300 280 H980 L1070 360 L980 600 H300 L210 520Z" fill="#7c2d12" stroke="#fb923c" stroke-width="6"/><g fill="none" stroke="#fed7aa" stroke-width="7" opacity=".7"><path d="M330 300 Q450 570 570 300 T810 300 T990 570"/><path d="M330 570 Q450 300 570 570 T810 570 T990 300"/></g>
  <g font-family="system-ui"><text x="1140" y="340" fill="#fff" font-size="34" font-weight="700">≈ 133 mm · 23–24 g</text><text x="1140" y="400" fill="#fed7aa" font-size="25">#5 Schmidt steel</text><text x="1140" y="490" fill="#fff" font-size="34" font-weight="700">Cartridge / converter</text><text x="1140" y="550" fill="#fed7aa" font-size="25">cap does not post</text><text x="107" y="805" fill="#fb923c" font-size="25">Roman numerals mark colours, not generations · Scepter ≠ Grand Scepter</text></g>
</svg>
