  <text x="105" y="125" fill="#f7fee7" font-size="64" font-family="system-ui" font-weight="700">BENU Grand Scepter</text><text x="107" y="180" fill="#bef264" font-size="27" font-family="system-ui">#6 nib + named glow resins · historical family · not a product photo</text>
  <path d="M210 390 L320 300 H900 L1010 390 L900 590 H320 L210 500Z" fill="#14532d" stroke="#a3e635" stroke-width="7"/><path d="M380 445 H820" stroke="#ecfccb" stroke-width="24" stroke-linecap="round"/><path d="M820 415 L980 457 L820 499Z" fill="#ecfccb"/>
  <g font-family="system-ui"><text x="1110" y="335" fill="#fff" font-size="34" font-weight="700">≈ 133 mm · ≈ 24 g</text><text x="1110" y="395" fill="#d9f99d" font-size="26">#6 Schmidt steel</text><text x="1110" y="485" fill="#fff" font-size="34" font-weight="700">Glow fades after charging</text><text x="1110" y="545" fill="#d9f99d" font-size="26">avoid heat and long exposure</text><text x="107" y="805" fill="#84cc16" font-size="25">same-size shell does not erase the #5 / #6 canonical boundary</text></g>
