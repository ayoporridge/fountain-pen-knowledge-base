<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BENU Grand Scepter 六号尖与发光边界事实图</title><desc id="desc">原创示意图，以双环和发光节点说明 Grand Scepter 的六号钢尖、一百三十三毫米、标准国际供墨和发光衰减；非产品照片。</desc>
