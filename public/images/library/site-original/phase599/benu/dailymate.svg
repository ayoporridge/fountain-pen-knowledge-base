<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BENU DailyMate 历史家族事实图</title><desc id="desc">原创示意图，以七个星期节点说明 DailyMate 的七色家族、一百四十毫米、六号尖和长旋帽行程；非产品照片。</desc>
  <rect width="1600" height="900" fill="#111827"/><text x="105" y="125" fill="#f9fafb" font-size="64" font-family="system-ui" font-weight="700">BENU DailyMate</text><text x="107" y="180" fill="#93c5fd" font-size="27" font-family="system-ui">seven daily variants · historical catalogue identity · not a product photo</text>
  <g transform="translate(130 300)" font-family="system-ui" text-anchor="middle"><g fill="#1d4ed8" stroke="#60a5fa" stroke-width="4"><circle cx="80" cy="100" r="58"/><circle cx="260" cy="100" r="58"/><circle cx="440" cy="100" r="58"/><circle cx="620" cy="100" r="58"/><circle cx="800" cy="100" r="58"/><circle cx="980" cy="100" r="58"/><circle cx="1160" cy="100" r="58"/></g><g fill="#dbeafe" font-size="25" font-weight="700"><text x="80" y="108">MON</text><text x="260" y="108">TUE</text><text x="440" y="108">WED</text><text x="620" y="108">THU</text><text x="800" y="108">FRI</text><text x="980" y="108">SAT</text><text x="1160" y="108">SUN</text></g></g>
  <path d="M280 590 H1120" stroke="#bfdbfe" stroke-width="24" stroke-linecap="round"/><g font-family="system-ui" text-anchor="middle"><text x="700" y="560" fill="#fff" font-size="30" font-weight="700">≈ 140 mm · #6 Schmidt · converter</text><text x="700" y="660" fill="#93c5fd" font-size="27">about five cap turns · cap does not post</text><text x="800" y="805" fill="#60a5fa" font-size="25">old path now shows Cocktail Hour; no rename inferred</text></g>
</svg>
