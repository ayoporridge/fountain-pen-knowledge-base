<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TACCIA Spectrum factual diagram</title>
  <desc id="desc">Non-photo, non-logo, not-to-scale, non-colour-proof diagram of a translucent resin cartridge converter fountain pen.</desc>
  <rect width="1600" height="900" fill="#fff7ef"/>
  <text x="80" y="90" font-family="sans-serif" font-size="42" font-weight="700" fill="#4b2637">TACCIA Spectrum</text>
  <text x="80" y="140" font-family="sans-serif" font-size="24" fill="#7b5364">translucent resin · cartridge / converter · Japanese nib routes</text>
  <g transform="translate(120 285)">
    <path d="M85 180 C85 112 160 62 275 62 H900 C1025 62 1135 112 1215 180 C1135 248 1025 298 900 298 H275 C160 298 85 248 85 180Z" fill="#dca5b9" fill-opacity=".62" stroke="#7d3e59" stroke-width="8"/>
    <path d="M1000 180 C1095 135 1198 135 1305 180 C1198 225 1095 225 1000 180Z" fill="#f5d2da" fill-opacity=".8" stroke="#7d3e59" stroke-width="8"/>
    <path d="M240 180 H835" stroke="#a15673" stroke-width="18" stroke-linecap="round"/>
    <rect x="420" y="125" width="340" height="110" rx="20" fill="#fff" fill-opacity=".45" stroke="#a15673" stroke-width="6"/>
    <path d="M770 180 h180" stroke="#7e8790" stroke-width="12"/>
    <path d="M1160 180 h180" stroke="#b17b3d" stroke-width="10"/>
    <text x="445" y="115" font-family="sans-serif" font-size="24" fill="#4b2637">converter</text>
    <text x="930" y="348" font-family="sans-serif" font-size="24" fill="#4b2637">two-tone Japanese nib</text>
  </g>
  <g font-family="sans-serif" font-size="28" fill="#4b2637">
    <text x="120" y="720">Ocean Blue</text>
    <text x="470" y="720">Forest Green</text>
    <text x="860" y="720">Merlot Red</text>
    <text x="1230" y="720">steel / 14K</text>
  </g>
  <text x="80" y="830" font-family="sans-serif" font-size="22" fill="#765263">NON-PHOTO · NON-LOGO · NOT-TO-SCALE · NON-COLOUR-PROOF</text>
</svg>
