  <text x="930" y="535" font-family="Arial, sans-serif" font-size="31" fill="#183a46">pocket 20：独立短笔形</text><text x="930" y="585" font-family="Arial, sans-serif" font-size="25" fill="#49636a">另页核对，不以相近图替代</text>
