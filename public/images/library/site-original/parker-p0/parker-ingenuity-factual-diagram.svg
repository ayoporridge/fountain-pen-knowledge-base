<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Parker Ingenuity 2023+ identity and SKU evidence diagram</title>
  <desc id="description">An original editorial information diagram separating the 2023 fountain pen from the 2011 5TH writing system and recording SKU-specific evidence. This is not a product photograph.</desc>
  <rect width="1600" height="1000" fill="#f4efe5"/>
  <rect x="70" y="65" width="1460" height="870" rx="34" fill="#fffaf0" stroke="#28251f" stroke-width="4"/>
  <text x="120" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="700" fill="#25231f">PARKER INGENUITY · IDENTITY MAP</text>
  <text x="120" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#6b6358">Editorial evidence diagram · no product likeness</text>
  <rect x="120" y="260" width="620" height="235" rx="24" fill="#243b35"/>
  <text x="160" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f6f0df">2023+ FOUNTAIN PEN</text>
  <text x="160" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#f6f0df">large stainless-steel nib</text>
  <text x="160" y="426" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#f6f0df">cartridge / converter</text>
  <text x="160" y="470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#cddad3">current fountain-pen family</text>
  <rect x="860" y="260" width="620" height="235" rx="24" fill="#ead8c4" stroke="#92513d" stroke-width="4"/>
  <text x="900" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#723828">2011 5TH TECHNOLOGY</text>
  <text x="900" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#723828">dedicated refill writing system</text>
  <text x="900" y="426" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#723828">not a fountain pen</text>
  <text x="900" y="470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#92513d">EXCLUDED FROM THIS PAGE</text>
  <path d="M760 377 H840" stroke="#92513d" stroke-width="7" stroke-dasharray="14 13"/>
  <text x="780" y="355" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#92513d">≠</text>
  <rect x="120" y="560" width="1360" height="255" rx="24" fill="#ece7dc"/>
  <text x="160" y="625" font-family="ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="700" fill="#25231f">SKU EVIDENCE STAYS WITH THE SKU</text>
  <text x="160" y="680" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#25231f">2213726 · official PDP: F  /  2026 EMEA catalogue: M</text>
  <text x="160" y="728" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" fill="#92513d">Conflict recorded; no family-wide nib size invented.</text>
  <text x="160" y="776" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#25231f">2182006 Black GT · M · 140 / 165 mm · Ø13.7 mm · 45 g</text>
  <rect x="120" y="850" width="1360" height="52" rx="14" fill="#25231f"/>
  <text x="800" y="886" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" fill="#fffaf0">示意图，非产品照片 · DIAGRAM, NOT A PRODUCT PHOTO</text>
</svg>
