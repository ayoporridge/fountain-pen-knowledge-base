<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Parker Vector XL Teal 2159746 specification diagram</title>
  <desc id="description">An original editorial specification card for Vector XL SKU 2159746 and its boundary from classic Vector. This is not a product photograph.</desc>
  <rect width="1600" height="1000" fill="#dfecea"/>
  <rect x="70" y="65" width="1460" height="870" rx="34" fill="#f8fcfb" stroke="#153f40" stroke-width="4"/>
  <text x="120" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="700" fill="#153f40">PARKER VECTOR XL · SKU CARD</text>
  <text x="120" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#4f7473">2159746 · Teal · evidence scoped to this SKU</text>
  <rect x="120" y="260" width="560" height="505" rx="28" fill="#176b69"/>
  <text x="170" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f8fcfb">M</text>
  <text x="245" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#f8fcfb">stainless-steel nib</text>
  <text x="170" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8fcfb">135 mm</text>
  <text x="355" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" fill="#cde4e2">closed</text>
  <text x="170" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8fcfb">157 mm</text>
  <text x="355" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" fill="#cde4e2">posted</text>
  <text x="170" y="575" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8fcfb">Ø 11.5 mm</text>
  <text x="170" y="645" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8fcfb">20 g</text>
  <text x="170" y="715" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" fill="#cde4e2">converter compatible · sold separately</text>
  <rect x="760" y="260" width="720" height="230" rx="28" fill="#e8f3f1" stroke="#176b69" stroke-width="4"/>
  <text x="810" y="335" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#153f40">2022 OFFICIAL CATALOGUE</text>
  <text x="810" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#153f40">Series separately listed; exact global</text>
  <text x="810" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#153f40">launch date remains unverified.</text>
  <rect x="760" y="535" width="720" height="230" rx="28" fill="#f3e7dc" stroke="#9b593f" stroke-width="4"/>
  <text x="810" y="610" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#7c412d">NOT CLASSIC VECTOR</text>
  <text x="810" y="665" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#7c412d">Separate identity, specs, variants</text>
  <text x="810" y="707" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27" fill="#7c412d">and publication record.</text>
  <rect x="120" y="850" width="1360" height="52" rx="14" fill="#153f40"/>
  <text x="800" y="886" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" fill="#f8fcfb">示意图，非产品照片 · DIAGRAM, NOT A PRODUCT PHOTO</text>
</svg>
