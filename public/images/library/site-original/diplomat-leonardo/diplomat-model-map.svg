<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Diplomat 型号关系示意图，非产品照片</title><desc id="d">Aero、Excellence A2/A+ 与 Elox 的结构边界。</desc><rect width="1600" height="900" fill="#f7f3eb"/><text x="100" y="120" font-size="52" fill="#263238">Diplomat：先认型号，再认表面与尖材</text><g font-family="sans-serif" font-size="34" fill="#263238"><rect x="120" y="240" width="360" height="260" rx="26" fill="#d8e7e5"/><text x="155" y="320">Aero</text><text x="155" y="380">纵向凹槽</text><text x="155" y="430">材质／尖材分 SKU</text><rect x="620" y="240" width="360" height="260" rx="26" fill="#e8ddcf"/><text x="655" y="320">Excellence A2</text><text x="655" y="380">Soft Sliding Click</text><text x="655" y="430">A+ 是螺纹帽 sibling</text><rect x="1120" y="240" width="360" height="260" rx="26" fill="#e6d5df"/><text x="1155" y="320">Elox</text><text x="1155" y="380">双阳极环</text><text x="1155" y="430">不是 Aero 配色</text></g><text x="100" y="760" font-size="36" fill="#6b6256">示意图，非产品照片。颜色、比例、笔尖、库存与具体 SKU 均需另行核对。</text></svg>
