<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Namiki Emperor facts</title>
  <desc id="desc">Factual editorial diagram showing No.50 18K nib, ebonite body, ink stopping function and Togidashi-Taka Maki-e.</desc>
  <rect width="1600" height="900" fill="#1c1917"/>
  <text x="110" y="150" fill="#fde68a" font-family="sans-serif" font-size="64" font-weight="700">NAMIKI EMPEROR</text>
  <text x="114" y="205" fill="#d6d3d1" font-family="sans-serif" font-size="28">collection-level facts; theme SKU details remain separate</text>
  <g font-family="sans-serif">
    <rect x="130" y="300" width="1340" height="100" rx="50" fill="#7f1d1d"/>
    <rect x="250" y="335" width="1040" height="30" rx="15" fill="#111827"/>
    <path d="M1290 335 1415 350 1290 365z" fill="#fef3c7"/>
    <text x="170" y="365" fill="#fff7ed" font-size="30" font-weight="700">ebonite body</text>
    <text x="1130" y="365" fill="#fde68a" font-size="27" text-anchor="end">large-scale Urushi / Maki-e</text>
    <g text-anchor="middle">
      <rect x="150" y="500" width="300" height="170" rx="20" fill="#292524" stroke="#f59e0b" stroke-width="3"/>
      <text x="300" y="570" fill="#fde68a" font-size="31" font-weight="700">No.50</text>
      <text x="300" y="620" fill="#e7e5e4" font-size="24">18K Jumbo nib</text>
      <rect x="500" y="500" width="300" height="170" rx="20" fill="#292524" stroke="#f59e0b" stroke-width="3"/>
      <text x="650" y="570" fill="#fde68a" font-size="31" font-weight="700">STOP</text>
      <text x="650" y="620" fill="#e7e5e4" font-size="24">ink stopping function</text>
      <rect x="850" y="500" width="300" height="170" rx="20" fill="#292524" stroke="#f59e0b" stroke-width="3"/>
      <text x="1000" y="570" fill="#fde68a" font-size="28" font-weight="700">Togidashi-Taka</text>
      <text x="1000" y="620" fill="#e7e5e4" font-size="24">Maki-e technique</text>
      <rect x="1200" y="500" width="250" height="170" rx="20" fill="#292524" stroke="#f59e0b" stroke-width="3"/>
      <text x="1325" y="570" fill="#fde68a" font-size="28" font-weight="700">2 types</text>
      <text x="1325" y="620" fill="#e7e5e4" font-size="24">clip / no clip</text>
    </g>
  </g>
  <text x="110" y="790" fill="#a8a29e" font-family="sans-serif" font-size="23">原创 factual SVG · 非产品照片 · 不代表真实比例、漆色、编号或库存</text>
