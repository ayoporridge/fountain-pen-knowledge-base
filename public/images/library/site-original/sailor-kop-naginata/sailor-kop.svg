  <path d="M100 755 H1500" stroke="#b69b80" stroke-width="3"/>
  <text x="100" y="815" fill="#725f50" font-family="sans-serif" font-size="25">21K 大型尖与墨囊／上墨器是家族线索；尺寸、重量、颜色必须回到具体官方货号。</text>
  <text x="100" y="855" fill="#9a8068" font-family="sans-serif" font-size="22">示意图，非产品照片 · Fountain Pen Graph editorial studio · 2026</text>
