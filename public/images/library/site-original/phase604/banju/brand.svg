<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Banju brand factual map</title>
  <desc id="desc">Editorial diagram separating verified Banju company, product and timeline evidence. Not a product photograph or logo reproduction.</desc>
  <rect width="1600" height="900" fill="#13231f"/>
  <path d="M0 690 C300 590 470 820 790 680 S1290 520 1600 670 V900 H0Z" fill="#203b33"/>
  <text x="92" y="118" fill="#f3ead5" font-family="Arial, sans-serif" font-size="72" font-weight="700">BANJU / 半句</text>
  <text x="96" y="170" fill="#a9cabc" font-family="Arial, sans-serif" font-size="27">verified identity map · not a logo · not a full catalogue</text>
  <g transform="translate(96 245)">
    <rect width="412" height="276" rx="24" fill="#193028" stroke="#5b8c79" stroke-width="3"/>
    <text x="34" y="58" fill="#f3ead5" font-family="Arial, sans-serif" font-size="31" font-weight="700">COMPANY ANCHOR</text>
    <text x="34" y="110" fill="#b8d1c6" font-family="Arial, sans-serif" font-size="25">Suzhou Banju Cultural</text>
    <text x="34" y="146" fill="#b8d1c6" font-family="Arial, sans-serif" font-size="25">Creative Co., Ltd.</text>
    <text x="34" y="201" fill="#e4c77b" font-family="Arial, sans-serif" font-size="23">design · R&amp;D · production</text>
    <text x="34" y="240" fill="#8fb2a4" font-family="Arial, sans-serif" font-size="19">2019 = marketplace account, not founding date</text>
  </g>
  <g transform="translate(594 245)">
    <rect width="412" height="276" rx="24" fill="#193028" stroke="#5b8c79" stroke-width="3"/>
    <text x="34" y="58" fill="#f3ead5" font-family="Arial, sans-serif" font-size="31" font-weight="700">VERIFIED MODEL</text>
    <text x="34" y="115" fill="#e4c77b" font-family="Arial, sans-serif" font-size="40" font-weight="700">DOER</text>
    <text x="34" y="155" fill="#b8d1c6" font-family="Arial, sans-serif" font-size="26">实践家 fountain pen</text>
    <text x="34" y="205" fill="#b8d1c6" font-family="Arial, sans-serif" font-size="22">retailer specs + independent sample</text>
    <text x="34" y="240" fill="#8fb2a4" font-family="Arial, sans-serif" font-size="19">textures and colors remain variants</text>
  </g>
  <g transform="translate(1092 245)">
    <rect width="412" height="276" rx="24" fill="#193028" stroke="#5b8c79" stroke-width="3"/>
    <text x="34" y="58" fill="#f3ead5" font-family="Arial, sans-serif" font-size="31" font-weight="700">RESEARCH LEADS</text>
    <text x="34" y="112" fill="#b8d1c6" font-family="Arial, sans-serif" font-size="24">Candy · Ferris Wheel</text>
    <text x="34" y="152" fill="#b8d1c6" font-family="Arial, sans-serif" font-size="24">White Sugar · F-Plan</text>
    <text x="34" y="205" fill="#e4c77b" font-family="Arial, sans-serif" font-size="21">not yet separate pages</text>
    <text x="34" y="240" fill="#8fb2a4" font-family="Arial, sans-serif" font-size="19">exact model evidence required</text>
  </g>
  <path d="M508 383 H594 M1006 383 H1092" stroke="#e4c77b" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(96 610)">
    <rect width="1408" height="164" rx="24" fill="#152a24" stroke="#426c5c" stroke-width="2"/>
    <text x="36" y="58" fill="#f3ead5" font-family="Arial, sans-serif" font-size="29" font-weight="700">Publication boundary</text>
    <text x="36" y="105" fill="#b8d1c6" font-family="Arial, sans-serif" font-size="23">Brand existence is supported; founder, exact launch date and complete production history remain unverified.</text>
    <text x="36" y="138" fill="#8fb2a4" font-family="Arial, sans-serif" font-size="19">Fountain Pen Graph editorial · factual diagram · not to scale · no trademark artwork</text>
  </g>
</svg>
