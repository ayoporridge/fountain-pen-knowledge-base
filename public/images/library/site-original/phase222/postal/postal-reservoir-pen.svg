  <text x="92" y="151" font-family="sans-serif" font-size="18" fill="#587078">透明 barrel · breather tube · bulb filler</text>
  <path d="M150 270 C270 220 445 220 620 270 L760 270" fill="none" stroke="#b8dfe1" stroke-width="46" stroke-linecap="round"/>
