    <text x="44" y="394" fill="#76848e" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18">工艺不可逆；图案、线条与银面质感不表示实物比例或颜色</text>
  </g>
  <g transform="translate(930 230)" filter="url(#shadow)">
