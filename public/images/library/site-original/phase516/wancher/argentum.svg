      <path d="M5 55 H300 C340 55 373 72 405 99 L475 151 L451 179 L376 127 C350 109 331 104 298 104 H5 Z" fill="url(#silver)" stroke="#69757e" stroke-width="4"/>
      <path d="M451 151 L520 179 L520 198 L451 180 Z" fill="#b8c2c9"/><path d="M520 179 L553 191 L553 204 L520 198 Z" fill="#d8b96f"/>
      <text x="0" y="234" fill="#4f616e" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="21">1-of-1 · 18K Shogun / Rhodium</text>
      <text x="0" y="270" fill="#4f616e" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="21">EF / F / MF / M / B / Kodachi</text>
      <text x="0" y="306" fill="#4f616e" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="21">Plastic feed · Sailor Standard</text>
      <text x="0" y="355" fill="#76848e" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18">converter / cartridge；尺寸与重量未公布</text>
