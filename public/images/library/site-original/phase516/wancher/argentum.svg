  <g transform="translate(100 755)"><rect width="1400" height="74" rx="37" fill="#25333f"/><text x="38" y="47" fill="#fbfcfd" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="22">资料边界：官方 exact record 确认 9316894867671 与 Argentum；本图不替代产品照片、真伪、价格或银面保养配方。</text></g>
