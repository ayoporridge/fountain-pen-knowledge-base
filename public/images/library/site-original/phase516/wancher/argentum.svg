<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wancher Argentum factual diagram</title>
  <desc id="desc">本站原创 factual SVG：非产品照片，说明 Argentum 的 925 Sterling Silver、acid etching、Shogun 尖与 Sailor Standard 供墨边界。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7f8fa"/><stop offset="1" stop-color="#d9dee4"/></linearGradient>
    <linearGradient id="silver" x1="0" x2="1"><stop offset="0" stop-color="#6f7880"/><stop offset="0.25" stop-color="#e9edf0"/><stop offset="0.55" stop-color="#9ca6ad"/><stop offset="0.78" stop-color="#f9fbfc"/><stop offset="1" stop-color="#737d85"/></linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#222931"/><stop offset="1" stop-color="#4b3a3d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#26323c" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="1420" cy="132" r="220" fill="#aeb9c5" opacity="0.2"/>
