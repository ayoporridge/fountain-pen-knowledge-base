    <text x="0" y="52" fill="#5e6d79" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="24">Wancher × Ariel Kullock｜事实边界示意图｜非产品照片</text>
  </g>
  <g transform="translate(100 230)" filter="url(#shadow)">
