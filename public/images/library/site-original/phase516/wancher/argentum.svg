    <path d="M115 218 C190 142 290 132 392 170 C490 206 585 200 684 148 L720 228 C620 290 518 304 400 274 C292 244 202 270 115 318 Z" fill="url(#silver)" stroke="#6f7b84" stroke-width="5"/>
